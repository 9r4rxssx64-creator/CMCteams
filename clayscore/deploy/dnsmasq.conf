# DHCP/DNS du réseau local ClayScore (jalon 7).
# Attribue des adresses aux tablettes et résout le hub sur un nom simple.
interface=wlan0
bind-interfaces
dhcp-range=192.168.50.10,192.168.50.100,255.255.255.0,24h
dhcp-option=3,192.168.50.1          # passerelle = le hub
dhcp-option=6,192.168.50.1          # DNS = le hub (réseau sans Internet)
# Le hub est joignable sur http://clayscore.local:8000 (et 192.168.50.1:8000)
address=/clayscore.local/192.168.50.1
