# Point d'accès WiFi local autonome du hub ClayScore (jalon 7).
# Réseau isolé, SANS Internet : les tablettes s'y connectent pour piloter le jeu.
# Adapter `interface` à la carte WiFi du hub (ex : wlan0).
interface=wlan0
driver=nl80211
ssid=ClayScore
hw_mode=g
channel=6
country_code=FR
ieee80211n=1
wmm_enabled=1
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
# ⚠️ Changez ce mot de passe (8 caractères min) avant mise en service.
wpa_passphrase=clayscore2026
