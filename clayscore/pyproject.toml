[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clayscore"
version = "0.1.0"
description = "Comptage automatique de points pour le ball-trap (tir aux plateaux)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary — tous droits réservés" }
authors = [{ name = "Kevin DESARZENS" }]
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Serveur + PWA (jalon 5)
server = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "websockets>=12.0"]
# Audio micro réel (jalon 7)
audio = ["sounddevice>=0.4"]
# IA v2 (jalon 8)
ml = ["ultralytics>=8.1"]
# Développement / tests
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[tool.setuptools.packages.find]
include = ["clayscore*"]

[tool.pytest.ini_options]
# Permet `import clayscore...` et `import tools...` depuis la racine du projet.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
