<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>ClayScore</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#0b1220; --panel:#141e30; --panel2:#1c2942; --line:#26364f;
    --txt:#eaf1ff; --muted:#9db0cf; --gold:#e8b830; --green:#1fbf6b;
    --red:#e8574a; --blue:#2f7be8; --amber:#f0a020;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right)
    calc(env(safe-area-inset-bottom) + 8px) env(safe-area-inset-left)}
  .wrap{max-width:640px;margin:0 auto;padding:12px}
  h1{font-size:22px;margin:8px 0}
  h2{font-size:17px;margin:14px 0 8px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.5px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:14px;margin:10px 0}
  label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
  input,select{width:100%;font-size:17px;padding:12px;border-radius:12px;
    border:1px solid var(--line);background:var(--panel2);color:var(--txt)}
  button{font-size:17px;font-weight:700;border:0;border-radius:14px;
    padding:16px;color:#fff;background:var(--blue);min-height:56px;width:100%}
  button:active{transform:translateY(1px)}
  .btn-big{min-height:72px;font-size:20px}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .green{background:var(--green)}.red{background:var(--red)}
  .amber{background:var(--amber)}.gold{background:var(--gold);color:#20160a}
  .ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
  .muted{color:var(--muted)} .hidden{display:none!important}
  .bignum{font-size:44px;font-weight:800;line-height:1}
  .pill{display:inline-block;padding:4px 10px;border-radius:999px;
    background:var(--panel2);font-size:13px;color:var(--muted)}
  table{width:100%;border-collapse:collapse}
  td,th{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-size:13px;font-weight:600}
  .cur{outline:2px solid var(--gold);border-radius:12px}
  video{width:100%;border-radius:12px;background:#000;max-height:38vh}
  .tag{font-size:13px;padding:3px 8px;border-radius:8px}
  .tag-casse{background:rgba(31,191,107,.2);color:#7ef0b0}
  .tag-manque{background:rgba(232,87,74,.2);color:#ff9c92}
  .tag-nobird{background:rgba(240,160,32,.2);color:#ffd27a}
  .tag-ambigu{background:rgba(232,184,48,.25);color:#ffe089}
  .topbar{display:flex;justify-content:space-between;align-items:center}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;
    padding:8px 12px;font-size:14px;display:flex;gap:8px;align-items:center}
  .chip b{color:var(--gold)}
  .foot{position:fixed;left:0;right:0;bottom:0;background:var(--panel);
    border-top:1px solid var(--line);display:flex;
    padding:8px calc(env(safe-area-inset-right)+8px)
      calc(env(safe-area-inset-bottom)+8px) calc(env(safe-area-inset-left)+8px)}
  .foot button{background:transparent;color:var(--muted);font-size:12px;
    min-height:48px;font-weight:600}
  .foot button.on{color:var(--gold)}
  .tvscore{font-size:clamp(28px,9vw,80px);font-weight:800}
  #toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);
    background:#000c;border:1px solid var(--line);padding:12px 18px;
    border-radius:12px;opacity:0;transition:.2s;pointer-events:none;z-index:50}
  #toast.show{opacity:1}
  .status{width:10px;height:10px;border-radius:50%;background:var(--red);
    display:inline-block;margin-right:6px}
  .status.ok{background:var(--green)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>🎯 ClayScore</h1>
    <span class="pill"><span id="wsdot" class="status"></span><span id="wslbl">hors ligne</span> · v0.5</span>
  </div>

  <!-- ============ CONFIG ============ -->
  <section id="view-config">
    <div class="card">
      <h2>Nouvelle partie</h2>
      <label for="f-disc">Discipline</label>
      <select id="f-disc"></select>
      <label>Tireurs</label>
      <div id="shooters"></div>
      <button class="ghost" id="addShooter" style="margin-top:8px">➕ Ajouter un tireur</button>
      <div class="grid2" style="margin-top:8px">
        <div><label for="f-serie">Série (plateaux)</label>
          <input id="f-serie" type="number" value="25" min="1" max="200"></div>
        <div><label for="f-cart">Cartouches</label>
          <select id="f-cart"><option value="">Auto</option>
            <option>1</option><option>2</option></select></div>
      </div>
      <label style="display:flex;gap:10px;align-items:center;margin-top:12px">
        <input type="checkbox" id="f-auto" style="width:auto">
        Valider seul les verdicts sûrs (mode auto)</label>
      <button class="btn-big gold" id="start" style="margin-top:14px">▶️ Démarrer la partie</button>
    </div>
    <div class="card">
      <h2>Historique</h2>
      <div id="hist-mini" class="muted">Aucune partie enregistrée.</div>
    </div>
  </section>

  <!-- ============ GAME ============ -->
  <section id="view-game" class="hidden">
    <div class="card">
      <div class="topbar">
        <div><span id="g-disc" class="pill"></span></div>
        <div id="g-progress" class="pill"></div>
      </div>
      <div class="row" style="margin-top:12px;text-align:center">
        <div><div class="muted">Tireur</div><div id="g-shooter" class="bignum" style="font-size:28px"></div></div>
        <div><div class="muted">Poste</div><div id="g-post" class="bignum"></div></div>
        <div><div class="muted">Plateau</div><div id="g-clay" class="bignum" style="font-size:28px"></div></div>
      </div>
    </div>

    <div class="card" id="board-card">
      <h2>Scores</h2>
      <div id="board" class="chips"></div>
    </div>

    <div class="card" id="throw-card">
      <div id="pending-area" class="hidden">
        <video id="replay" playsinline muted loop></video>
        <div style="text-align:center;margin:10px 0">
          Proposé : <span id="p-verdict" class="tag"></span>
          <span id="p-conf" class="muted"></span>
        </div>
        <div id="cart-row" class="grid2 hidden" style="margin-bottom:10px">
          <button class="ghost" data-cart="1">Cartouche 1</button>
          <button class="ghost" data-cart="2">Cartouche 2</button>
        </div>
        <div class="grid3">
          <button class="green btn-big" data-v="casse">✅ CASSÉ</button>
          <button class="red btn-big" data-v="manque">❌ MANQUÉ</button>
          <button class="amber btn-big" data-v="nobird">🔁 NO BIRD</button>
        </div>
        <button class="ghost" id="validate-auto" style="margin-top:10px">Valider la proposition</button>
      </div>
      <button id="throw" class="btn-big gold">🚀 LANCER LE PLATEAU</button>
    </div>

    <div class="card hidden" id="final-card">
      <h2>Partie terminée</h2>
      <div id="final-board"></div>
      <div class="row" style="margin-top:12px">
        <button class="green" id="save">💾 Enregistrer</button>
        <button class="ghost" id="csv">📄 Export CSV</button>
      </div>
      <button class="gold" id="again" style="margin-top:10px">🔄 Nouvelle partie</button>
    </div>
  </section>

  <!-- ============ HISTORY ============ -->
  <section id="view-history" class="hidden">
    <div class="card"><h2>Historique des parties</h2><div id="hist-list"></div></div>
  </section>

  <!-- ============ TV ============ -->
  <section id="view-tv" class="hidden">
    <div class="card" style="text-align:center">
      <div id="tv-disc" class="muted"></div>
      <div id="tv-board"></div>
    </div>
  </section>
</div>

<nav class="foot">
  <button data-nav="config">🆕 Partie</button>
  <button data-nav="game">🎯 En cours</button>
  <button data-nav="history">📜 Historique</button>
  <button data-nav="tv">📺 TV</button>
</nav>
<div id="toast"></div>

<script src="/app.js"></script>
</body>
</html>
