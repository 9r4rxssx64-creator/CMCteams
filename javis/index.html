<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#171008">
<title>Bee</title>
<meta name="description" content="Bee — l'assistante personnelle de Kevin, gratuit d'abord.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-512.png" type="image/png">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bee">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://lingua.kd-mc.com; connect-src 'self' https://apis.kd-mc.com https://api.open-meteo.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'; manifest-src 'self'">
<style>
:root{--gold:#e8b830;--gold2:#f5cc4a;--gold3:#c9a227;--bg:#0e0a04;--ink:#f7efd9;--mut:#a4906a;--card:#171008;--line:rgba(232,184,48,.22)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;min-height:100dvh}
#gate{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:var(--bg);padding:24px;text-align:center}
#gate.hidden{display:none}
#gate p{color:var(--mut);max-width:320px;margin:0}
#stage{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 16px 10px;flex:0 0 auto}
/* ===== Bee : LE rig de Lingua (mêmes images, mêmes classes, même géométrie
   mesurée sur son dessin). Port fidèle de lingua/index.html — si l'art de Bee
   évolue là-bas, cette app suit toute seule. ===== */
#javis-face{width:min(56vw,270px);height:min(56vw,270px);border-radius:50%;overflow:hidden;background:#fdf7e7;
  box-shadow:0 0 0 4px rgba(246,183,60,.5),0 14px 34px rgba(0,0,0,.5);position:relative;
  transition:transform .45s cubic-bezier(.2,.8,.3,1);cursor:pointer;animation:beeFloat 3.4s ease-in-out infinite}
@keyframes beeFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-6px) rotate(1.5deg)}}
/* Gros plan quand elle parle (Kevin : « en gros plan le visage ») — on coupe le
   flottement pendant, sinon les deux transform se battent. */
#stage.javis-closeup #javis-face{animation:none;transform:scale(1.26) translateY(4%)}
#stage{transition:padding .45s ease}
#stage.javis-closeup{padding-top:10px;padding-bottom:0}
.rig-look{position:absolute;inset:0;transform:translate(var(--lx,0),var(--ly,0)) rotate(var(--lr,0deg));transition:transform .28s cubic-bezier(.22,1,.36,1)}
.rig-base,.rig-piece{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.bee-rig.vivant .rig-base{animation:respire 3.8s ease-in-out infinite;transform-origin:50% 88%}
@keyframes respire{0%,100%{transform:scale(1,1)}50%{transform:scale(1.018,.986)}}
.rig-wl{transform-origin:34% 46%;animation:wingL 1.15s ease-in-out infinite}
.rig-wr{transform-origin:66% 44%;animation:wingR 1.15s ease-in-out infinite}
@keyframes wingL{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
@keyframes wingR{0%,100%{transform:rotate(0)}50%{transform:rotate(6deg)}}
.bee-rig.talk .rig-wl{animation:wingL .32s ease-in-out infinite}
.bee-rig.talk .rig-wr{animation:wingR .32s ease-in-out infinite}
.bee-rig[data-mascot="bee"]{--lid:rgb(252,185,51);
  --ll-l:28.1%;--ll-t:29.6%;--ll-w:15.5%;--ll-h:15.0%;
  --lr-l:56.3%;--lr-t:29.7%;--lr-w:15.5%;--lr-h:15.5%;
  --mo-l:51.1%;--mo-t:54.9%}
.rig-lid{position:absolute;background:var(--lid);border:0;border-radius:46%;opacity:0;pointer-events:none;transition:opacity .05s}
.rig-lid.ll{left:var(--ll-l);top:var(--ll-t);width:var(--ll-w);height:var(--ll-h)}
.rig-lid.lr{left:var(--lr-l);top:var(--lr-t);width:var(--lr-w);height:var(--lr-h)}
.bee-rig.blink .rig-lid{opacity:1}
.disc-mouth{position:absolute;left:var(--mo-l);top:var(--mo-t);width:6.6%;height:5.2%;
  transform:translate(-50%,-50%) scale(1);border-radius:42% 42% 50% 50%/36% 36% 64% 64%;
  background:radial-gradient(60% 55% at 50% 66%,#ff5d6c 0%,#8a3018 60%,#53200f 100%);
  border:2px solid #3a1c10;opacity:0;pointer-events:none}
.disc-mouth.talking{opacity:1;animation:discMouth .27s ease-in-out infinite alternate}
@keyframes discMouth{0%{transform:translate(-50%,-50%) scale(1.02,.96)}100%{transform:translate(-50%,-50%) scale(1.38,1.52)}}
.bee-rig.dort .rig-lid{opacity:1}
.bee-rig.dort .rig-base{animation:respire 6.5s ease-in-out infinite}
.bee-rig.dort .rig-piece{animation:none!important}
.rig-zzz{position:absolute;left:64%;top:16%;font-size:15%;font-weight:900;color:#cfe0ee;opacity:0;pointer-events:none;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.bee-rig.dort .rig-zzz{animation:zzz 2.6s ease-out infinite}
@keyframes zzz{0%{opacity:0;transform:translate(0,0) scale(.6)}25%{opacity:.95}100%{opacity:0;transform:translate(38%,-52%) scale(1.5)}}
.bee-rig.rx-poke .rig-look{animation:rxPoke .9s cubic-bezier(.34,1.56,.64,1)}
@keyframes rxPoke{0%{transform:scale(1,1)}22%{transform:scale(1.1,.88) translateY(3%)}55%{transform:scale(.94,1.09) translateY(-4%)}100%{transform:scale(1,1)}}
.bee-rig.rx-joie .rig-look{animation:rxJoie 1.5s ease-in-out}
@keyframes rxJoie{0%,100%{transform:translateY(0) rotate(0)}20%{transform:translateY(-13%) rotate(-8deg)}45%{transform:translateY(0) rotate(6deg)}70%{transform:translateY(-8%) rotate(-4deg)}}
.bee-rig.rx-reflechit .rig-look{animation:rxPense 2s ease-in-out infinite}
@keyframes rxPense{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.bee-rig.rx-coucou .rig-look{animation:rxCoucou 1.4s ease-in-out}
@keyframes rxCoucou{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}50%{transform:rotate(7deg)}75%{transform:rotate(-5deg)}}
@media (prefers-reduced-motion:reduce){#javis-face,.rig-look,.bee-rig.vivant .rig-base,.rig-wl,.rig-wr,.disc-mouth.talking,.rig-zzz{animation:none;transition:none}}
#javis-name{margin-top:12px;font-weight:700;font-size:19px;background:linear-gradient(90deg,#ffd75e,#f6b73c);-webkit-background-clip:text;background-clip:text;color:transparent}
#javis-sub{color:var(--mut);font-size:12px;margin-top:2px}
#msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.bub{max-width:86%;padding:10px 13px;border-radius:15px;white-space:pre-wrap;word-break:break-word;animation:pop .15s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bub.me{align-self:flex-end;background:#3a2c16;color:#f7efd9;border-bottom-right-radius:4px}
.bub.js{align-self:flex-start;background:var(--card);color:#f0e2bd;border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.js small{display:block;margin-top:5px;color:var(--mut);font-size:10px}
form{display:flex;gap:8px;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);border-top:1px solid var(--line);background:var(--card)}
textarea{flex:1;background:#241905;border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:11px 14px;font-size:15px;min-height:46px;max-height:120px;resize:none;font-family:inherit}
textarea:focus{outline:2px solid var(--gold3)}
button.act{flex:0 0 46px;height:46px;border-radius:14px;border:0;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#241905;font-size:19px;font-weight:800;cursor:pointer}
#mic.on{background:linear-gradient(135deg,#c8506a,#e2748f)}
#voice-toggle{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:12px;background:rgba(36,25,5,.7);border:1px solid var(--line);color:var(--mut);border-radius:20px;padding:6px 12px;font-size:12px;cursor:pointer}
</style>
</head>
<body>

<div id="gate">
  <svg viewBox="0 0 200 200" style="width:96px;height:96px;opacity:.5"><circle cx="100" cy="100" r="80" fill="#e8b830" opacity=".3"/></svg>
  <div id="gate-msg">Vérification…</div>
  <p id="gate-sub">Bee est l'assistante personnelle de Kevin. Si c'est bien toi, connecte-toi d'abord sur le domaine.</p>
</div>

<button id="voice-toggle" type="button">🔊 Voix</button>

<div id="stage">
  <div id="javis-face" class="bee-rig" data-mascot="bee" data-art="vive">
    <div class="rig-look">
      <img class="rig-base" src="https://lingua.kd-mc.com/bee/v2/rig/base.webp" alt="Bee">
      <img class="rig-piece rig-wl" src="https://lingua.kd-mc.com/bee/v2/rig/wing-l.webp" alt="" onerror="this.remove()">
      <img class="rig-piece rig-wr" src="https://lingua.kd-mc.com/bee/v2/rig/wing-r.webp" alt="" onerror="this.remove()">
      <div class="rig-lid ll"></div><div class="rig-lid lr"></div>
      <div class="disc-mouth"></div>
      <div class="rig-zzz">z</div>
    </div>
  </div>
  <div id="javis-name">Bee</div>
  <div id="javis-sub">Ton assistante personnelle · gratuit d'abord</div>
</div>

<div id="msgs"></div>

<form id="form">
  <textarea id="input" placeholder="Demande-moi n'importe quoi…" rows="1"></textarea>
  <button id="mic" class="act" type="button" aria-label="Dicter">🎙</button>
  <button id="send" class="act" type="submit" aria-label="Envoyer">➤</button>
</form>

<script>
'use strict';
var AI_ENDPOINT = 'https://apis.kd-mc.com/ai';
var STORAGE_HIST = 'javis_app_history';
var STORAGE_VOICE = 'javis_app_voice_on';
var MAX_HISTORY = 60;

/* ---------- 1. Qui es-tu ? (même pattern éprouvé que tools/departs) ---------- */
function ssoToken(){
  try{
    var m=(location.hash||'').match(/[#&]kdmc_sso=([^&]+)/);
    if(m){ try{localStorage.setItem('kdmc_sso_token',decodeURIComponent(m[1]));}catch(_){}
           try{history.replaceState(null,'',location.pathname+location.search);}catch(_){} }
    return localStorage.getItem('kdmc_sso_token')||'';
  }catch(_){ return ''; }
}
function checkAdmin(cb){
  try{
    var tok=ssoToken(); var hdr={}; if(tok)hdr.Authorization='Bearer '+tok;
    fetch('/__sso/whoami',{credentials:'include',cache:'no-store',headers:hdr})
      .then(function(r){return r&&r.ok?r.json():null;})
      .then(function(j){cb(!!(j&&j.ok&&j.verified===true&&j.admin===true));})
      .catch(function(){cb(false);});
  }catch(_){ cb(false); }
}

/* ---------- 2. Elle est vivante — port de mascotAlive() de lingua/app.js ---------- */
function rig(){ return document.getElementById('javis-face'); }
function react(kind,dur){ var r=rig(); if(!r)return;
  ['rx-poke','rx-joie','rx-reflechit','rx-coucou'].forEach(function(c){r.classList.remove(c);});
  if(!kind)return; r.classList.add('rx-'+kind);
  setTimeout(function(){ try{r.classList.remove('rx-'+kind);}catch(_){} }, dur||1500); }
function closeup(on){ var st=document.getElementById('stage'); if(st)st.classList[on?'add':'remove']('javis-closeup'); }
function startTalking(){ var r=rig(); if(!r)return; closeup(true); r.classList.add('talk');
  var m=r.querySelector('.disc-mouth'); if(m)m.classList.add('talking'); }
function stopTalking(){ var r=rig(); if(!r)return; closeup(false); r.classList.remove('talk');
  var m=r.querySelector('.disc-mouth'); if(m)m.classList.remove('talking'); }
function setThinking(on){ var r=rig(); if(!r)return; r.classList[on?'add':'remove']('rx-reflechit'); }

function mascotAlive(){
  var r=rig(); if(!r||r._alive)return; r._alive=true;
  var look=r.querySelector('.rig-look')||r;
  r.classList.add('vivant');
  var lastTouch=Date.now(), dormi=false;
  (function blink(){ if(!document.contains(r))return;
    if(!dormi){ r.classList.add('blink'); setTimeout(function(){ try{r.classList.remove('blink');}catch(_){} },150); }
    setTimeout(blink, dormi?9000:(2400+Math.random()*3400)); })();
  function suivre(cx,cy){ if(dormi)return;
    var b=r.getBoundingClientRect(); if(!b.width)return;
    var dx=Math.max(-1,Math.min(1,(cx-(b.left+b.width/2))/(b.width*0.9)));
    var dy=Math.max(-1,Math.min(1,(cy-(b.top+b.height/2))/(b.height*0.9)));
    look.style.setProperty('--lx',(dx*3.2).toFixed(2)+'%');
    look.style.setProperty('--ly',(dy*2.2).toFixed(2)+'%');
    look.style.setProperty('--lr',(dx*4.5).toFixed(2)+'deg'); }
  function onMove(e){ var p=(e.touches&&e.touches[0])||e; if(p)suivre(p.clientX,p.clientY); reveille(); }
  document.addEventListener('pointermove',onMove,{passive:true});
  function reveille(){ lastTouch=Date.now();
    if(dormi){ dormi=false; r.classList.remove('dort'); react('coucou',1500); } }
  (function veille(){ if(!document.contains(r))return;
    if(!dormi && Date.now()-lastTouch>120000){ dormi=true; r.classList.add('dort');
      look.style.removeProperty('--lx'); look.style.removeProperty('--ly'); look.style.removeProperty('--lr'); }
    setTimeout(veille,4000); })();
  r.addEventListener('pointerdown',function(){ var dormait=dormi; reveille();
    if(!dormait)react('poke',900);
    try{ if(navigator.vibrate)navigator.vibrate(10); }catch(_){} },{passive:true});
}

/* ---------- 3. Voix (Web Speech API, gratuite) ---------- */
function voiceOn(){ try{return localStorage.getItem(STORAGE_VOICE)!=='0';}catch(_){return true;} }
function speak(text){
  if(!voiceOn()||!('speechSynthesis' in window)||!text) return;
  try{
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text.slice(0,600));
    u.lang='fr-FR'; u.rate=1.02; u.pitch=1.35;
    u.onstart=startTalking; u.onend=stopTalking; u.onerror=stopTalking;
    window.speechSynthesis.speak(u);
  }catch(_){}
}

/* ---------- 4. Intentions locales + chat (identique en principe au widget) ---------- */
var DOMAIN_APPS={
  'arbre|généalog|famille|arrière.grand.père|arrière grand père':'https://arbre.kd-mc.com',
  'apex|assistant ia avancé':'https://apex.kd-mc.com',
  'planning|cmcteams|équipe|départ':'https://cmcteams.kd-mc.com'
};
function tryLocalIntent(text,respond){
  var t=text.toLowerCase();
  for(var pattern in DOMAIN_APPS){
    if(new RegExp(pattern,'i').test(t) && /ouvre|va sur|montre|affiche|lance/.test(t)){
      var url=DOMAIN_APPS[pattern];
      respond('J\'ouvre ça pour toi 👉 '+url);
      setTimeout(function(){window.open(url,'_blank','noopener');},300);
      return true;
    }
  }
  if(/m[eé]t[eé]o|temps.*(fera|fait)|pleuvoir|prévisions?/.test(t)){
    var give=function(lat,lon,place){
      fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,weather_code&timezone=auto')
        .then(function(r){return r.json();})
        .then(function(j){
          var c=j&&j.current, temp=c?Math.round(c.temperature_2m):null;
          respond(temp!==null?('Il fait '+temp+'°C'+(place?' à '+place:'')+' en ce moment.'):'Je n\'ai pas réussi à lire la météo, réessaie.');
        }).catch(function(){respond('Météo indisponible là, réessaie.');});
    };
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(
        function(pos){give(pos.coords.latitude,pos.coords.longitude,'');},
        function(){give(43.7325,7.4197,'Monaco');},{timeout:4000});
    } else give(43.7325,7.4197,'Monaco');
    return true;
  }
  if(/envoie.*message|écris.*à|planning.*modifi|change.*planning/.test(t)){
    try{localStorage.setItem('apex_v13_chat_prefill',text);}catch(_){}
    respond('Ça, je te l\'ouvre dans Apex (lui a accès à ton compte et peut vraiment agir) — ta question est déjà écrite, tu n\'as qu\'à valider.');
    setTimeout(function(){window.open('https://apex.kd-mc.com/#chat','_blank','noopener');},500);
    return true;
  }
  return false;
}

function loadHistory(){ try{return JSON.parse(localStorage.getItem(STORAGE_HIST)||'[]');}catch(_){return [];} }
function saveHistory(h){ try{localStorage.setItem(STORAGE_HIST,JSON.stringify(h.slice(-MAX_HISTORY)));}catch(_){} }
function addBubble(role,text,meta){
  var list=document.getElementById('msgs');
  var b=document.createElement('div'); b.className='bub '+(role==='user'?'me':'js'); b.textContent=text;
  if(meta){var small=document.createElement('small');small.textContent=meta;b.appendChild(small);}
  list.appendChild(b); list.scrollTop=list.scrollHeight;
}
function ask(text){
  addBubble('user',text);
  var hist=loadHistory(); hist.push({role:'user',content:text}); saveHistory(hist);
  var handled=tryLocalIntent(text,function(reply){
    addBubble('javis',reply);
    var h=loadHistory(); h.push({role:'assistant',content:reply}); saveHistory(h);
    speak(reply);
  });
  if(handled) return;
  setThinking(true);
  var messages=hist.slice(-12).map(function(m){return {role:m.role,content:m.content};});
  fetch(AI_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    messages:messages,
    system:'Tu es Javis, l\'assistant personnel de Kevin sur son domaine kd-mc.com. Réponds court, chaleureux, tutoiement, en français. Si la demande exige une action réelle (envoyer un message, modifier des données), dis-le clairement plutôt que de prétendre l\'avoir fait.',
    max_tokens:500
  })})
    .then(function(r){return r.json();})
    .then(function(j){
      setThinking(false);
      var text2=(j&&j.ok&&j.text)?j.text:'Je n\'ai pas réussi à répondre là, réessaie dans un instant.';
      var meta=(j&&j.ok)?(j.provider+(j.provider==='qwen'?' (gratuit)':'')):null;
      addBubble('javis',text2,meta); if(j&&j.ok)react('joie',1200);
      var h=loadHistory(); h.push({role:'assistant',content:text2}); saveHistory(h);
      speak(text2);
    })
    .catch(function(){ setThinking(false); addBubble('javis','Le réseau ne répond pas là, réessaie dans un instant.'); });
}

/* ---------- 5. Montage ---------- */
function mount(){
  document.getElementById('gate').classList.add('hidden');
  mascotAlive();
  var hist=loadHistory();
  if(!hist.length) addBubble('javis','Coucou Kevin 🐝 C\'est moi, Bee ! Demande-moi n\'importe quoi — je réponds gratuit d\'abord, et je peux t\'ouvrir tes applis.');
  else hist.forEach(function(m){addBubble(m.role==='user'?'user':'javis',m.content);});

  var form=document.getElementById('form'), input=document.getElementById('input');
  form.addEventListener('submit',function(e){ e.preventDefault(); var v=(input.value||'').trim(); if(!v)return; input.value=''; ask(v); });
  input.addEventListener('keydown',function(e){ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit();} });

  var vt=document.getElementById('voice-toggle');
  vt.textContent=voiceOn()?'🔊 Voix':'🔇 Voix';
  vt.addEventListener('click',function(){
    var next=!voiceOn(); try{localStorage.setItem(STORAGE_VOICE,next?'1':'0');}catch(_){}
    vt.textContent=next?'🔊 Voix':'🔇 Voix';
    if(!next){try{window.speechSynthesis.cancel();}catch(_){}}
  });

  var mic=document.getElementById('mic');
  var Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(Recognition){
    var rec=new Recognition(); rec.lang='fr-FR'; rec.interimResults=false;
    mic.addEventListener('click',function(){
      if(mic.classList.contains('on')){ try{rec.stop();}catch(_){} return; }
      try{rec.start();mic.classList.add('on');}catch(_){}
    });
    rec.onresult=function(e){ var t=e.results&&e.results[0]&&e.results[0][0]&&e.results[0][0].transcript; if(t){input.value=t;form.requestSubmit();} };
    rec.onend=function(){mic.classList.remove('on');};
    rec.onerror=function(){mic.classList.remove('on');};
  } else mic.style.display='none';
}

/* ---------- 6. Go ---------- */
checkAdmin(function(isAdmin){
  if(isAdmin){ mount(); return; }
  document.getElementById('gate-msg').textContent='🔒 Cette app est personnelle à Kevin.';
  document.getElementById('gate-sub').textContent='Connecte-toi d\'abord sur le domaine (Face ID) puis rouvre Bee.';
});

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
</body>
</html>
