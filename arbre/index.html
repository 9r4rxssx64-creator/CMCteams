<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#e7d9ba">
<title>Arbre généalogique — Famille</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://*.firebasedatabase.app https://identitytoolkit.googleapis.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'; manifest-src 'self'">
<style>
:root{
  --bg:#e7d9ba; --ink:#3a2c16; --mut:#8a7550; --line:#cbb488;
  --glass:rgba(249,242,225,.85); --glass2:rgba(243,233,208,.92);
  --gold:#b0842c; --gold2:#e2bd5c; --cyan:#3c8a80; --violet:#7a6ad6; --pink:#c96f9e; --ok:#3f9d6a; --danger:#c8506a;
  --male:#3f6bb0; --female:#c96f9e;
  --r:18px; --sh:0 10px 30px rgba(92,70,28,.22);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;overflow-x:hidden}
/* animated aurora background */
#aura{position:fixed;inset:-20% -20% -20% -20%;z-index:-2;filter:blur(70px);opacity:.28;pointer-events:none}
#aura b{position:absolute;border-radius:50%;mix-blend-mode:screen;animation:float 18s ease-in-out infinite}
#aura b:nth-child(1){width:46vmax;height:46vmax;left:-8%;top:-10%;background:radial-gradient(circle,#caa24e,transparent 60%);animation-delay:-2s}
#aura b:nth-child(2){width:40vmax;height:40vmax;right:-6%;top:10%;background:radial-gradient(circle,#7fae63,transparent 60%);animation-delay:-6s}
#aura b:nth-child(3){width:44vmax;height:44vmax;left:20%;bottom:-16%;background:radial-gradient(circle,#d8c07a,transparent 60%);animation-delay:-10s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(4%,3%) scale(1.08)}66%{transform:translate(-3%,4%) scale(.96)}}
@media (prefers-reduced-motion:reduce){#aura b{animation:none}}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 80% at 50% -10%,rgba(200,168,104,.28),transparent 60%),linear-gradient(180deg,#efe3c6,#e0cfa6)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--ink);background:rgba(255,252,244,.85);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold)}
.btn{display:inline-flex;align-items:center;gap:7px;justify-content:center;min-height:44px;padding:10px 15px;border-radius:13px;background:var(--glass2);border:1px solid var(--line);font-weight:600;backdrop-filter:blur(10px);transition:transform .12s,border-color .2s}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#241905;border:0;box-shadow:0 6px 20px rgba(240,200,116,.35)}
.btn.ghost{background:rgba(255,255,255,.04)}
.btn.sm{min-height:44px;padding:9px 12px;font-size:13px;border-radius:11px}
.btn.dng{color:var(--danger);border-color:#5a2733}
.hidden{display:none!important}.mut{color:var(--mut)}.gold{color:var(--gold)}
/* topbar */
#top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:linear-gradient(180deg,rgba(239,227,198,.96),rgba(239,227,198,.55));backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
#top .logo{font-size:22px;filter:drop-shadow(0 2px 6px rgba(240,200,116,.5))}
#top h1{font-size:19px;margin:0;font-weight:700;font-family:Georgia,"Times New Roman",serif;font-style:italic;letter-spacing:.2px;flex:1;background:linear-gradient(90deg,var(--gold2),#7fc98a);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#syncPill{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:5px 9px;background:rgba(255,252,244,.7)}
#syncPill i{width:9px;height:9px;border-radius:50%;background:#6b7686;transition:background .3s}
#syncPill.on i{background:var(--ok);box-shadow:0 0 10px var(--ok)}#syncPill.off i{background:#f0b45f}
#syncPill.sav i{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
#tabs{display:flex;gap:7px;padding:10px 12px 4px;overflow-x:auto;scrollbar-width:none}#tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;min-height:44px;display:inline-flex;align-items:center;padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-weight:600;color:var(--mut);transition:.2s}
.tab.act{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#241905;border-color:transparent;box-shadow:0 6px 18px rgba(240,200,116,.3)}
#wrap{padding:8px 12px 24px;max-width:900px;margin:0 auto}
.sec{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:11px 0;backdrop-filter:blur(12px);box-shadow:var(--sh)}
.sec h3{margin:0 0 11px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--gold)}
.grid{display:grid;gap:10px}.chips{display:flex;flex-wrap:wrap;gap:8px}
.blgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:4px}
.blcard{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:10px 8px 12px;text-align:center;box-shadow:var(--sh);transition:transform .12s,border-color .2s}
.blcard:active{transform:translateY(1px) scale(.99)}
.blsvg svg,.blbig svg{width:100%;height:auto;display:block}
.blnm{font-weight:700;margin-top:7px;font-size:14px;letter-spacing:.3px}
.bln{color:var(--mut);font-size:12px}
.blbig{display:flex;justify-content:center;align-items:center;padding:4px 0;min-height:60px}
.blbig svg{width:62%;max-width:230px}
.blemb{width:44px;flex:none;align-self:center}
.blemb svg{width:44px;height:auto;display:block;filter:drop-shadow(0 2px 4px rgba(92,70,28,.3))}
.row2{display:flex;gap:9px}.row2>*{flex:1}
label.fl{display:block;font-size:12px;color:var(--mut);margin:11px 0 5px}
.empty{text-align:center;color:var(--mut);padding:44px 12px}
/* person card */
.pc{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;backdrop-filter:blur(10px);transition:transform .12s,border-color .2s}
.pc:active{transform:scale(.99);border-color:var(--gold)}
.av{width:52px;height:52px;border-radius:50%;flex:none;background:radial-gradient(circle at 36% 30%,#fffbef,#e7d4a6);color:#7a5427;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:700;font-family:Georgia,"Times New Roman",serif;overflow:hidden;position:relative;box-shadow:inset 0 0 0 1px rgba(120,84,36,.3)}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.av.M{box-shadow:0 0 0 2px rgba(63,107,176,.55),inset 0 0 0 1px rgba(120,84,36,.25)}
.av.F{box-shadow:0 0 0 2px rgba(201,111,158,.55),inset 0 0 0 1px rgba(120,84,36,.25)}
.pc .nm{font-weight:700}.pc .sub{font-size:12.5px;color:var(--mut);margin-top:2px}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:999px;background:#22304a;color:var(--mut);margin-left:6px;vertical-align:middle}
.badge.alive{background:rgba(99,230,163,.16);color:var(--ok)}
/* ---- graphical tree stage ---- */
#treeCtl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 4px}
#treeCtl .seg{display:flex;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;overflow:hidden}
#treeCtl .seg button{padding:9px 13px;font-size:13px;font-weight:600;color:var(--mut)}
#treeCtl .seg button.on{background:linear-gradient(135deg,var(--cyan),#39b9ff);color:#04222a}
#stageWrap{position:relative;height:74vh;min-height:480px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:radial-gradient(130% 80% at 50% 102%,rgba(120,150,86,.22),transparent),radial-gradient(100% 60% at 50% -4%,rgba(206,168,98,.22),transparent),linear-gradient(180deg,#efe4c8,#e3d1a8);touch-action:none;box-shadow:var(--sh)}
#treeBg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;transition:opacity .5s}
#treeArt{position:absolute;inset:0;opacity:.8;transition:opacity .6s}#treeArt svg{width:100%;height:100%;display:block}
#treePhoto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 40%;opacity:0;transition:opacity .6s}
#treePhoto.on{opacity:1}#treePhoto.on ~ #treeScrim{opacity:1}
#treeScrim{position:absolute;inset:0;opacity:0;background:linear-gradient(180deg,rgba(16,24,8,.10),rgba(16,24,8,0) 24%,rgba(14,18,6,.12))}
#stageWrap.plan #treeBg{opacity:0}
#stage{position:absolute;left:0;top:0;z-index:1;transform-origin:0 0;will-change:transform}
#stage svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.tnode{position:absolute;transform:translate(-50%,-50%);width:186px;padding:12px 13px;border-radius:16px;background:linear-gradient(180deg,#fffef8,#f6ecd3);border:1px solid #cbb684;display:flex;gap:11px;align-items:center;box-shadow:0 6px 16px rgba(74,54,22,.4),inset 0 1px 0 rgba(255,255,255,.7);cursor:pointer;transition:transform .12s,border-color .2s,box-shadow .2s}
.tnode:active{transform:translate(-50%,-50%) scale(.97)}
.tnode.root{border-color:var(--gold);box-shadow:0 0 0 1.5px var(--gold),0 12px 34px rgba(240,200,116,.3)}
.tnode.sM{border-top:2px solid rgba(93,159,214,.6)}
.tnode.sF{border-top:2px solid rgba(255,158,199,.6)}
.tnode .av{width:44px;height:44px;border-radius:50%;font-size:18px;font-family:Georgia,"Times New Roman",serif;color:#7a5427;background:radial-gradient(circle at 36% 30%,#fffbef,#e7d4a6)!important;box-shadow:inset 0 0 0 1px rgba(120,84,36,.3)}
.tnode.sM .av{box-shadow:0 0 0 2px rgba(63,107,176,.55),inset 0 0 0 1px rgba(120,84,36,.25)}
.tnode.sF .av{box-shadow:0 0 0 2px rgba(201,111,158,.55),inset 0 0 0 1px rgba(120,84,36,.25)}
.tnode.root .av{box-shadow:0 0 0 2px var(--gold),0 2px 8px rgba(176,132,44,.4)}
.tnf{font-weight:800;font-size:12.5px;letter-spacing:.4px;line-height:1.15}
.tnode .tn{font-weight:700;font-size:14px;line-height:1.16;overflow:hidden;text-overflow:ellipsis;color:#2c2010;font-family:Georgia,"Times New Roman",serif}
.tnode .ty{font-size:11.5px;color:#856a3a;margin-top:1px}
.av.M,.av.F{background:radial-gradient(circle at 36% 30%,#fffbef,#e7d4a6)}
.bandlab{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:#f3e6c2;background:rgba(74,54,26,.9);padding:5px 14px;border:1px solid var(--line);border-radius:999px;backdrop-filter:blur(8px);white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:4;pointer-events:none}
.couplebadge{position:absolute;transform:translate(-50%,-50%);font-size:15px;background:rgba(255,248,230,.96);border:1px solid var(--gold);border-radius:999px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(240,200,116,.35)}
.couplebadge.exb{width:auto;height:auto;padding:3px 9px;gap:4px;font-size:13px;border-color:#c46a6a;background:rgba(255,241,238,.97);box-shadow:0 3px 10px rgba(196,106,106,.3)}
.couplebadge.exb small{font-size:10px;font-weight:700;letter-spacing:.3px;color:#a03d3d;text-transform:uppercase}
.treemode{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:6;display:flex;gap:4px;background:rgba(74,54,26,.9);border:1px solid var(--gold);border-radius:999px;padding:3px;backdrop-filter:blur(8px);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.treemode button{font-size:12px;font-weight:700;color:#f3e6c2;padding:7px 12px;border-radius:999px;white-space:nowrap}
.treemode button.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#3a2708}
.fampick{top:56px}
.famchips{display:flex;gap:7px;margin:2px 0 10px;overflow-x:auto;padding-bottom:2px}
.famchip{min-height:44px;padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.5);border:1.5px solid var(--line);font-weight:700;font-size:13px;color:var(--mut);white-space:nowrap}
.famchip.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#3a2708;border-color:transparent}
.okb{color:#2c7a3f;font-weight:700}
#printArea{display:none}
@media print{
  body.printing #app,body.printing #gate,body.printing .ov,body.printing #toast{display:none!important}
  body.printing #printArea{display:block!important;background:#fff}
  #printArea .pr-title{font-family:Georgia,serif;font-size:20px;font-weight:700;color:#5a3d18;margin:0 0 10px}
  #printArea .pr-stage{position:relative;overflow:hidden;margin:0 auto}
  #printArea .tnode{box-shadow:none;border-color:#8a6420}
  #printArea .pr-foot{font-size:11px;color:#8a7a55;margin-top:8px;text-align:center}
  @page{size:A4 landscape;margin:10mm}
}
.tmed{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:7px;width:158px;cursor:pointer}
.tmed .tma{border-radius:999px;display:inline-flex}
.tmed .tma img,.tmed .tma div{border-radius:999px}
.tmn{display:inline-flex;flex-direction:column;align-items:center;gap:1px;background:rgba(52,36,12,.82);color:#f7ecce;font-weight:700;font-size:12.5px;line-height:1.25;padding:5px 12px;border-radius:11px;text-align:center;max-width:158px;box-shadow:0 3px 9px rgba(20,12,2,.35);backdrop-filter:blur(3px)}
.tmn small{font-weight:600;font-size:10.5px;color:#d9c48f}
.tmed.root .tmn{background:linear-gradient(135deg,#b0842c,#8a6420);color:#fff8e6}
.relkev{color:var(--gold);font-weight:700;font-size:13.5px;margin-top:2px}
.tnode.blood{border-color:#c9992f;box-shadow:0 6px 16px rgba(74,54,22,.4),0 0 0 2.5px rgba(201,153,47,.55),inset 0 1px 0 rgba(255,255,255,.7)}
.brchips{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
.brchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--mut);background:rgba(255,255,255,.5);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.brchip i{width:12px;height:12px;border-radius:3px;display:inline-block}
.legrow{display:flex;gap:12px;align-items:flex-start;margin:11px 0;font-size:14.5px;line-height:1.45}
.legico{font-size:20px;flex:0 0 28px;text-align:center}
.genlab.soft{color:rgba(243,230,194,.5);text-shadow:0 1px 6px rgba(0,0,0,.5)}
.genlab{position:absolute;left:10px;font-size:30px;font-weight:800;color:rgba(122,84,39,.55);letter-spacing:.4px;pointer-events:none}

.addrel{display:flex;gap:8px;flex-wrap:wrap}.addrel .btn{flex:1;min-width:calc(50% - 4px)}
.tnode .rt{position:absolute;top:-8px;left:9px;font-size:9px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#04222a;background:var(--cyan);padding:1px 6px;border-radius:999px}
.zoomBtns{position:absolute;right:12px;bottom:12px;z-index:5;display:flex;flex-direction:column;gap:8px}
.zoomBtns button{width:44px;height:44px;border-radius:13px;background:var(--glass2);border:1px solid var(--line);font-size:20px;font-weight:800;backdrop-filter:blur(10px);box-shadow:var(--sh)}
.hintpan{position:absolute;left:112px;bottom:12px;right:74px;z-index:4;pointer-events:none;font-size:11px;color:var(--mut);background:rgba(255,250,238,.8);border:1px solid var(--line);padding:5px 9px;border-radius:10px}
/* modal */
.ov{position:fixed;inset:0;z-index:60;background:rgba(4,7,12,.72);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{position:relative;background:linear-gradient(180deg,#f8f1dd,#efe3c6);width:100%;max-width:680px;max-height:93vh;overflow:auto;border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:0;padding:16px 16px calc(env(safe-area-inset-bottom) + 26px);animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:translateY(0);opacity:1}}
.grab{width:46px;height:5px;border-radius:3px;background:#33405a;margin:2px auto 12px}
.sheet h2{margin:2px 0}
.caro{position:relative;border-radius:18px;overflow:hidden;background:#ddcaa0;border:1px solid var(--line);aspect-ratio:4/3;margin:12px 0}
.caro .slide{position:absolute;inset:0;opacity:0;transition:opacity .6s}
.caro .slide.on{opacity:1}.caro img{width:100%;height:100%;object-fit:cover}
.caro .dots{position:absolute;left:0;right:0;bottom:9px;display:flex;gap:6px;justify-content:center;z-index:2}
.caro .dots i{width:7px;height:7px;border-radius:50%;background:#ffffff66}.caro .dots i.on{background:#fff;width:18px;border-radius:4px}
.caro .nav{position:absolute;top:0;bottom:0;width:38%;z-index:2}.caro .nav.l{left:0}.caro .nav.r{right:0}
.caro .carocnt{position:absolute;right:10px;bottom:9px;z-index:2;background:rgba(20,14,6,.55);color:#fff;font-size:11.5px;padding:3px 9px;border-radius:10px;letter-spacing:.4px}
.caro .ph-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);font-size:13px;padding:20px}
.thumbs{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.thumbs .t{width:50px;height:50px;border-radius:11px;overflow:hidden;border:1px solid var(--line);position:relative}
.thumbs .t img{width:100%;height:100%;object-fit:cover}
.thumbs .t b{position:absolute;top:-3px;right:2px;color:var(--danger);font-weight:900;font-size:15px;text-shadow:0 1px 3px #000}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}.kv .k{color:var(--mut);font-size:13px}
.linkbtn{color:var(--cyan);text-decoration:none;font-weight:600}
a{color:var(--cyan);text-decoration:none}
.acterow{display:flex;gap:10px;overflow-x:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch}
.actecard{flex:0 0 auto;width:120px;cursor:pointer;text-align:center}
.actecard img{width:120px;height:150px;object-fit:cover;object-position:top;border:2px solid var(--gold);border-radius:10px;background:#fffef8;box-shadow:0 3px 10px rgba(60,40,10,.25)}
.docrow{display:flex;gap:10px;overflow-x:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch}
.doccard{flex:0 0 auto;width:120px;position:relative;cursor:pointer;text-align:center}
.doccard .dprev{width:120px;height:150px;border:2px solid var(--line);border-radius:10px;background:#fffef8;object-fit:cover;object-position:top;box-shadow:0 3px 10px rgba(60,40,10,.2)}
.doccard .dcover{width:120px;height:150px;border:2px solid var(--line);border-radius:10px;background:linear-gradient(160deg,#fffef8,#efe4c8);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 3px 10px rgba(60,40,10,.2)}
.doccard .dcover .big{font-size:42px}
.doccard .dcover .ext{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--gold);text-transform:uppercase}
.doccard .alab{font-size:10.5px;line-height:1.25;color:var(--ink);opacity:.85;margin-top:4px;word-break:break-word;max-height:2.6em;overflow:hidden}
.doccard .dsz2{font-size:10px;color:var(--mut)}
.doclegacy{display:flex;flex-direction:column;gap:8px;margin:6px 0 10px}
.docitem{display:flex;align-items:center;gap:10px;background:#fffef8;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;min-height:44px;cursor:pointer}
.docitem .dic{font-size:22px}
.docitem .dnm{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.docitem .dsz{font-size:11px;color:var(--mut);white-space:nowrap}
.docitem .ddel{width:30px;height:30px;line-height:28px;text-align:center;border-radius:50%;background:#a3403a;color:#fff;font-size:15px;flex:0 0 auto}
.actecard{position:relative}

<script>
"use strict";
var APP_VER="v2.96";
var DEFAULT_CODEHASH="a43c9ae454dfed007839c2e26b7b5358b7bc4087ecd74094d2dd43cc4b624aa7"; // MAIFFRET
/* ---------- utils ---------- */
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function $(s,r){return (r||document).querySelector(s);}
function el(h){var d=document.createElement("div");d.innerHTML=h.trim();return d.firstChild;}
function uid(){return "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function now(){return Date.now();}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove("on");},2600);}
function relTime(ts){var s=(now()-ts)/1000;if(s<60)return "à l'instant";if(s<3600)return Math.floor(s/60)+" min";if(s<86400)return Math.floor(s/3600)+" h";var d=Math.floor(s/86400);if(d<30)return d+" j";return new Date(ts).toLocaleDateString("fr-FR");}
async function sha256(s){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0");}).join("");}

/* ---------- storage ---------- */
var IDB=null;
function idbOpen(){return new Promise(function(res){try{var r=indexedDB.open("arbreDB",1);r.onupgradeneeded=function(){r.result.createObjectStore("kv");};r.onsuccess=function(){IDB=r.result;res(IDB);};r.onerror=function(){res(null);};}catch(e){res(null);}});}
function idbGet(k){return new Promise(function(res){if(!IDB)return res(null);try{var t=IDB.transaction("kv","readonly").objectStore("kv").get(k);t.onsuccess=function(){res(t.result||null);};t.onerror=function(){res(null);};}catch(e){res(null);}});}
function idbSet(k,v){return new Promise(function(res){if(!IDB)return res(false);try{var t=IDB.transaction("kv","readwrite").objectStore("kv").put(v,k);t.onsuccess=function(){res(true);};t.onerror=function(){res(false);};}catch(e){res(false);}});}
var DB={persons:{},meta:{updatedAt:0}};
var CODEHASH="",VIEW="tree",ROOT=null,TREEMODE="asc",EXP={},ME="";
var VIEWER="";try{var _vw=localStorage.getItem("arbre_viewer");if(_vw)VIEWER=_vw;}catch(e){}
function viewerId(){return (VIEWER&&P(VIEWER))?VIEWER:null;}
function setViewer(id){VIEWER=id;try{localStorage.setItem("arbre_viewer",id);}catch(e){}}
function textOnly(db){var c={persons:{},meta:db.meta};for(var id in db.persons){var p=db.persons[id],q={};for(var k in p)if(k!=="photos"&&k!=="docs")q[k]=p[k];q.photoCount=(p.photos||[]).length;q.docCount=(p.docs||[]).length;if(p.actes)q.actes=p.actes.map(function(a){return {label:a.label,by:a.by,ts:a.ts,img:(a.img&&a.img.length<200000)?a.img:undefined};});c.persons[id]=q;}return c;}
async function saveLocal(){DB.meta.updatedAt=now();await idbSet("tree",DB);try{localStorage.setItem("arbre_v2_text",JSON.stringify(textOnly(DB)));}catch(e){}}
async function loadLocal(){var d=await idbGet("tree");if(d&&d.persons){DB=d;return true;}try{var t=JSON.parse(localStorage.getItem("arbre_v2_text")||"null");if(t&&t.persons){DB=t;return true;}}catch(e){}return false;}

/* ---------- cloud sync (anon Firebase, fail-open, temps réel) ---------- */
var FB="https://cmcteams-c16ab-default-rtdb.europe-west1.firebasedatabase.app";
var FB_KEY="AIzaSyDciW-0sIIg9msdmgZjQHBksqzsfA6DCMs";
var _tok=null,_tokExp=0,_cloudOK=false;
function setPill(state){var p=$("#syncPill"),t=$("#syncTxt");if(!p)return;p.className="";if(state==="sav"){p.classList.add("sav");t.textContent="Enregistré";}else if(_cloudOK){p.classList.add("on");t.textContent="Synchro famille";}else{p.classList.add("off");t.textContent="Local";}}
async function anonAuth(){if(_tok&&now()<_tokExp-60000)return _tok;try{var r=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signUp?key="+FB_KEY,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({returnSecureToken:true})});if(!r.ok)throw 0;var j=await r.json();_tok=j.idToken;_tokExp=now()+((+j.expiresIn||3600)*1000);return _tok;}catch(e){_tok=null;return null;}}
function cloudBase(){return FB+"/arbre/"+CODEHASH;}
async function cloudPush(id){var t=await anonAuth();if(!t)return _fail();try{var r=await fetch(cloudBase()+"/persons/"+id+".json?auth="+t,{method:"PUT",body:JSON.stringify(DB.persons[id]||null)});if(!r.ok)throw 0;_cloudOK=true;setPill();return true;}catch(e){return _fail();}}
function _fail(){_cloudOK=false;setPill();return false;}
async function cloudPushAll(){var t=await anonAuth();if(!t)return _fail();try{var r=await fetch(cloudBase()+".json?auth="+t,{method:"PUT",body:JSON.stringify({persons:DB.persons,meta:DB.meta})});if(!r.ok)throw 0;_cloudOK=true;setPill();return true;}catch(e){return _fail();}}
async function cloudPull(silent){var t=await anonAuth();if(!t)return _fail();try{var r=await fetch(cloudBase()+".json?auth="+t);if(!r.ok)throw 0;var rem=await r.json();_cloudOK=true;setPill();if(!rem||!rem.persons){if(Object.keys(DB.persons).length)await cloudPushAll();return;}var changed=false;for(var id in rem.persons){var rp=rem.persons[id];if(!rp)continue;var lp=DB.persons[id];if(!lp||(rp.updatedAt||0)>(lp.updatedAt||0)){DB.persons[id]=rp;changed=true;}}
  // deletions: remote tombstone
  if(changed){var sh=purgeSeedShadows();if(sh.length)cloudPushAll().catch(function(){});}
  if(changed){await idbSet("tree",DB);try{localStorage.setItem("arbre_v2_text",JSON.stringify(textOnly(DB)));}catch(e){}if(!silent)toast("🔄 Mis à jour depuis la famille");if(!$(".ov"))render();}
}catch(e){return _fail();}}
async function persist(id){await saveLocal();setPill("sav");setTimeout(setPill,1100);if(id)cloudPush(id);else cloudPushAll();}

/* ---------- model ---------- */
function P(id){return DB.persons[id]||null;}
function full(p){if(!p)return "?";return ((p.prenom||"")+" "+(p.nom||"")).trim()||"(sans nom)";}
function yr(d){if(!d)return "";var m=String(d).match(/\d{4}/);return m?m[0]:"";}
function lifespan(p){var a=yr(p.naissance&&p.naissance.date),b=yr(p.deces&&p.deces.date);if(p.vivant)return a?a+" · vivant":"vivant";if(!a&&!b)return "";return (a||"?")+(b?"–"+b:"");}
function childrenOf(id){var r=[];for(var k in DB.persons){var p=DB.persons[k];if(p.pere===id||p.mere===id)r.push(k);}return r;}
var DIVORCED=[["seed_stephan_bruno","seed_sabrina"],["seed_emile","seed_mariefrance"],["seed_gerard","seed_marienoel"]];
function isDivorced(a,b){return DIVORCED.some(function(d){return (d[0]===a&&d[1]===b)||(d[0]===b&&d[1]===a);});}
var SEPARATED=[["seed_kevin","seed_pascale_vervloet"]];
function isSeparated(a,b){return SEPARATED.some(function(d){return (d[0]===a&&d[1]===b)||(d[0]===b&&d[1]===a);});}
function spouseNames(p){return (p.conjoints||[]).map(function(id){return full(P(id));}).filter(Boolean);}
function initials(p){return ((p.prenom||"?")[0]||"?").toUpperCase();}
function avatarHTML(p,sz){var cls=p.sexe==="F"?"F":p.sexe==="M"?"M":"";var ph=(p.photos&&p.photos[0]);var st=sz?'style="width:'+sz+'px;height:'+sz+'px;font-size:'+(sz*0.42|0)+'px"':"";return '<div class="av '+cls+'" '+st+'>'+(ph?'<img src="'+ph+'" alt="">':esc(initials(p)))+'</div>';}
function personCardHTML(id){var p=P(id);if(!p)return "";var ls=lifespan(p);if(p.vivant&&ls==="vivant")ls="";var sub=[ls,(p.naissance&&p.naissance.lieu)||""].filter(Boolean).join(" · ");var cc=(p.comments||[]).length;var b=p.vivant?'<span class="badge alive">vivant</span>':'';return '<div class="pc" data-open="'+id+'" style="border-left:6px solid '+branchOf(p).c+'">'+avatarHTML(p)+'<div style="flex:1;min-width:0"><div class="nm">'+esc(full(p))+b+'</div><div class="sub">'+esc(sub)+(cc?' · 💬 '+cc:"")+'</div></div><span class="mut">›</span></div>';}

/* ---------- graphical tree ---------- */
var VIEWST={tx:40,ty:40,sc:1};
/* Arbre COMPLET : chaque FAMILLE reliée = un bloc-arbre soigné (couples + enfants),
   empilés et centrés ; les personnes pas encore reliées = une grille propre en bas.
   Fini la longue bande minuscule dans le coin. */
var TREE={ROWH:158,BOXW:198,COUPLEGAP:24,UNITGAP:64,PAD:34,COMPGAP:64,CARD:184};
/* ---------- 2 FAMILLES = 2 ARBRES (demande Kevin 2026-08-03) ----------
   🫒 "o" = famille SAUVAIGO · MAIFFRET (côté maman — olivier, Nice/Monaco)
   🌳 "c" = famille DESARZENS (côté papa — chêne, racines suisses/Vaud)
   "oc" = dans les DEUX arbres (Gérard, Kevin, Sabrina, Ronan, Théo = sang des deux). */
var FAM_OVERRIDE={seed_gerard:"oc",seed_kevin:"oc",seed_laurence:"oc",seed_sabrina:"oc",seed_ronan:"oc",seed_theo:"oc",seed_marielle:"o",seed_yvonne_ch:"o",seed_monique_jaillet:"o",seed_jean_besqueut:"o",seed_brigitte_besqueut:"o",seed_olivier_besqueut:"o",seed_christophe_besqueut:"o",seed_michele_patrice:"c",seed_herve_ep_sylvie:"c",seed_virgile_dsz:"c",
  seed_christian:"o",seed_cecile:"o",seed_marienoel:"oc",seed_christine_vdb:"o",seed_philippe_vdb:"o",seed_laura_vdb:"o",
  seed_guy:"c",seed_emile:"c",seed_loic:"c",seed_yann:"c",seed_claude_desarzens:"c"};
function famOf(p){if(!p)return "oc";var ov=FAM_OVERRIDE[p.id];if(ov)return ov;var n=(p.nom||"").toUpperCase();
  if(/SARZENS|SARZANCE/.test(n))return "c";
  if(/SAUVAIGO|MAIFFRET|BOSCH|MOLINARIO|DENTAU|VIRGILI/.test(n))return "o";
  return "oc";}
var FAMKEY="o";try{var _fk=localStorage.getItem("arbre_fam");if(_fk==="o"||_fk==="c")FAMKEY=_fk;}catch(e){}
function famLabel(k){return k==="c"?"🌳 Desarzens":"🫒 Sauvaigo · Maiffret";}
function famPhoto(k){return k==="c"?"tree-oak.jpg":"tree.jpg";}
function compLabel(ids){/* Kevin 8.08.2026 « ce n'est pas la famille Bruno » : le bandeau ne porte QUE les noms de la lignée de la famille affichée (Desarzens côté chêne ; Sauvaigo/Maiffret… côté olivier) — jamais un nom entré par mariage (Bruno, Vervloet…). */
  var re=FAMKEY==="c"?/SARZENS|SARZANCE/:/SAUVAIGO|MAIFFRET|BOSCH|MOLINARIO|DENTAU|VIRGILI|CRESTO/;
  var cnt={},cntAll={};ids.forEach(function(x){var nm=(P(x).nom||"").trim().toUpperCase();if(!nm)return;cntAll[nm]=(cntAll[nm]||0)+1;if(re.test(nm))cnt[nm]=(cnt[nm]||0)+1;});
  var src=Object.keys(cnt).length?cnt:cntAll;
  var top=Object.keys(src).sort(function(a,b){return src[b]-src[a];}).slice(0,2);
  return top.length?("Famille "+top.join(" · ")):"Famille";}
/* Agencement « propre » d'une famille : les PARENTS en haut, chaque enfant
   DIRECTEMENT EN DESSOUS de ses parents (couple centré au-dessus de ses enfants).
   Les plus jeunes descendent tout en bas (ex : Ronan au pied du tronc). */
function tidyTree(ids){
  var T=TREE,ROWH=T.ROWH,BOXW=T.BOXW,COUPLEGAP=T.COUPLEGAP,UNITGAP=T.UNITGAP;
  var set={};ids.forEach(function(x){set[x]=1;});
  var placed={},nodes=[],links=[],rowCur={},depthMax=0,bx={};/* bx = carte (objet nœud) par personne — suit les décalages en bloc */
  /* ── GÉNÉRATION GLOBALE par propagation de contraintes (union-find pondéré) ──
     Deux époux = MÊME étage ; un enfant = étage parent+1. Corrige le défaut vu par
     Kevin : un conjoint « marié dans la famille » (Victor, Gérard, Pascale…) ne
     flotte plus au mauvais niveau — il partage la rangée de son époux/épouse. */
  var uf={},pot={};
  function ufFind(x){if(uf[x]===undefined){uf[x]=x;pot[x]=0;return x;}if(uf[x]===x)return x;var r=ufFind(uf[x]);pot[x]+=pot[uf[x]];uf[x]=r;return r;}
  function ufUnion(a,b,diff){/* impose niveau[b]-niveau[a]=diff */var ra=ufFind(a),rb=ufFind(b);if(ra===rb)return (pot[b]-pot[a])===diff;uf[rb]=ra;pot[rb]=diff+pot[a]-pot[b];return true;}
  ids.forEach(function(x){var pp=P(x);[pp.pere,pp.mere].forEach(function(par){if(par&&set[par])ufUnion(par,x,1);});(pp.conjoints||[]).forEach(function(c){if(set[c])ufUnion(x,c,0);});});
  var glevel={},gmin=1e9;ids.forEach(function(x){ufFind(x);if(pot[x]<gmin)gmin=pot[x];});
  ids.forEach(function(x){glevel[x]=pot[x]-gmin;});
  function members(x){/* Kevin 2026-08-06 : les EX (divorcés/séparés) et anciennes unions À GAUCHE, l'union ACTUELLE À DROITE. */
    var pp=P(x),ex=[],rest=[];
    (pp.conjoints||[]).forEach(function(c){if(set[c]&&!placed[c]&&c!==x&&ex.indexOf(c)<0&&rest.indexOf(c)<0){if(isDivorced(x,c)||isSeparated(x,c))ex.push(c);else rest.push(c);}});
    var cur=rest.length?[rest.pop()]:[];
    return ex.concat(rest,[x],cur);}
  function unit(x,depth){
    if(placed[x])return null;
    var mem=members(x);mem.forEach(function(z){placed[z]=1;});var d=glevel[x]||0;if(d>depthMax)depthMax=d;
    var kidset={};mem.forEach(function(z){childrenOf(z).forEach(function(k){if(set[k]&&!placed[k])kidset[k]=1;});});
    /* Position (relative au centre de l'unité) du MILIEU DU COUPLE des parents d'un
       enfant k — sert à trier les fratries par couple (moins de croisements) ET à
       placer le parent pile au-dessus de ses enfants (médiane, Kevin 2026-08-07). */
    var STEP=BOXW+COUPLEGAP,half=(mem.length-1)/2;
    function relMid(pid){var i=mem.indexOf(pid);return i<0?null:(i-half)*STEP;}
    function coupleRel(k){var ck=P(k)||{},a=relMid(ck.pere),b=relMid(ck.mere);if(a!=null&&b!=null)return (a+b)/2;if(a!=null)return a;if(b!=null)return b;return 0;}
    var kids=Object.keys(kidset).sort(function(a,b){var ra=coupleRel(a),rb=coupleRel(b);if(ra!==rb)return ra-rb;return ((yr(P(a).naissance&&P(a).naissance.date))||9999)-((yr(P(b).naissance&&P(b).naissance.date))||9999);});
    var nStart=nodes.length,lStart=links.length;   /* pour décaler le sous-arbre enfants EN BLOC si besoin */
    var cc=[];kids.forEach(function(k){var c=unit(k,depth+1);if(c!=null)cc.push({x:c,id:k});});
    var uW=mem.length*BOXW+(mem.length-1)*COUPLEGAP;
    /* curseur PAR RANGÉE : deux unités d'une même ligne ne se chevauchent JAMAIS,
       ET chaque couple reste centré PILE au-dessus de ses enfants. */
    var minC=(rowCur[d]!==undefined?rowCur[d]:0)+uW/2,center;
    if(cc.length){
      /* Kevin 2026-08-07 « chaque enfant bien en dessous de ses parents » : on place
         le parent à la MÉDIANE des positions idéales — pour chaque enfant, l'idéal
         est que le MILIEU DE SON COUPLE parental (pas le centre du bloc) tombe pile
         au-dessus de SA carte. Un enfant unique atterrit exactement sous ses parents,

var _GED_MONTHS={JAN:"01",FEB:"02",MAR:"03",APR:"04",MAY:"05",JUN:"06",JUL:"07",AUG:"08",SEP:"09",OCT:"10",NOV:"11",DEC:"12"};

  var m=s.match(/^(\d{1,2})\s+([A-Z]{3})\s+(\d{3,4})$/i);if(m&&_GED_MONTHS[m[2].toUpperCase()])return ("0"+m[1]).slice(-2)+"."+_GED_MONTHS[m[2].toUpperCase()]+"."+m[3];
  m=s.match(/^([A-Z]{3})\s+(\d{3,4})$/i);if(m&&_GED_MONTHS[m[1].toUpperCase()])return _GED_MONTHS[m[1].toUpperCase()]+"."+m[2];

      else if(xref&&tag==="FAM"){cur=fams[xref]={husb:"",wife:"",chil:[],mdate:"",mlieu:""};curType="F";}
      continue;}

  add({id:"seed_gerard",prenom:"Gérard",nom:"DESARZENS",sexe:"M",pere:"seed_guy",mere:"seed_renee_dejean",conjoints:["seed_marienoel"],naissance:{date:"19.04.1944",lieu:"Salon-de-Provence"},deces:{date:"25.03.2025",lieu:"Monaco"},notes:"Gérard Ange Émile DESARZENS — père de Kevin et de Sabrina, ex-époux de Marie-Noëlle SAUVAIGO (divorcés le 28 novembre 1996, Tribunal de Première Instance de Monaco). Retraité, de nationalité monégasque, domicilié 4 Avenue Hector Otto « Le Garden House », Monaco. 🕯 DÉCÉDÉ le 25 MARS 2025 à MONACO. 📜 ACTE REÇU (Kevin, 6.08.2026) — acte de notoriété après décès dressé par Me Charles-Henri REY, notaire à Monaco, enregistré à Monaco le 12 mai 2025 : il CONFIRME décès 25.03.2025 Monaco · naissance 19 avril 1944 à Salon-de-Provence (Bouches-du-Rhône) · nationalité monégasque · 2 enfants seuls héritiers (Sabrina, née 22.03.1971, et Kevin, né 5.02.1979) issus de son union avec Marie-Noëlle SAUVAIGO. ✅ PARENTS CONFIRMÉS par l'ACTE DE DÉCÈS intégral de Monaco (N°125/2025, fourni par Kevin le 6.08.2026) : « fils de Guy Édouard DESARZENS et de Renée Gilberte DEJEAN, décédés » → PÈRE = Guy Édouard DESARZENS (filiation CONFIRMÉE, fini le « à confirmer »), MÈRE = Renée Gilberte DEJEAN (grand-mère paternelle, désormais dans l'arbre). Décédé à 12h02 au Centre Hospitalier (Princesse Grace) ; acte dressé le 26.03.2025 par S. Robini, off. état civil, sur déclaration de Pascal Blanc. 🇲🇨 Décès à Monaco = enregistré à l'État Civil de Monaco (absent du fichier INSEE français, c'est normal — vérifié le 6.08.2026 sur les 46 décès DESARZENS). Fils de Guy Édouard DESARZENS (CONFIRMÉ) et de Renée Gilberte DEJEAN. Nom DESARZENS = « de Sarzens » : originaire de SARZENS, canton de Vaud (Suisse) — patronyme suisse romand (la particule « de » est toponymique, non noble). L'acte de naissance 1944 à Salon (Archives 13) confirmera le prénom de Guy + donnera la grand-mère paternelle.",sources:[{label:"🇲🇨 État Civil — Mairie de Monaco (demande d'acte de décès)",url:"https://mairie.mc/"},{label:"🇫🇷 Acte transcrit côté France — service-public (état civil de l'étranger)",url:"https://www.service-public.fr/particuliers/vosdroits/F1444"},SRC.ad13,SRC.gDesarzens,SRC.sarzens,SRC.davel]});

  add({id:"seed_jules_sauvaigo",prenom:"Jules",nom:"SAUVAIGO",sexe:"M",naissance:{date:"1858 ?"},conjoints:["seed_victoire"],notes:"🎯 REGISTRES MONACO LUS (2026-08-04) : il n'est PAS né à Monaco (registres 1852-1866 : seuls François-Arnulphe 1857 et Barthélemi 1860, fils de Joseph SAUVAIGO × BOUFFA, et Jacques-Adolphe 1860, fils de Louis-Étienne — TOUS « natifs de Nice ») → Jules (n. 1858) est très probablement né à NICE comme eux ; registres AD06 Nice 1858 à consulter (téléphone). 📜 DOCUMENT FAMILIAL + index Geneanet : marié en 1883 à Victoire MAIFFRET (fille de Jean-Baptiste). Leurs filles : Julie (1893–1912) et Micheline (1892–1907). 1ʳᵉ alliance Sauvaigo ⇄ Maiffret — la 2ᵉ sera Victor × Marie-Thérèse en 1939. Lien exact avec Victor Sauvaigo à établir.",sources:[SRC.gSauvaigo,SRC.monacoTree]});

  add({id:"seed_jb_maiffret",prenom:"Jean-Baptiste",nom:"MAIFFRET",sexe:"M",naissance:{date:"1815"},deces:{date:"9.04.1903"},notes:"📜 RACINE de l'arbre MAIFFRET (document familial) : né en 1815, décédé le 9 avril 1903 (~88 ans). Père de Jean (1852), Alexandre (1856), Michel (1857) et Victoire (1860). 7 générations le séparent de Ronan. 🔎 REMONTER AVANT 1815 (recherche 8.08.2026) : en 1815, Villefranche/Beaulieu = royaume de Sardaigne → sa naissance est dans les REGISTRES PAROISSIAUX de Villefranche-sur-Mer (en ligne aux Archives 06) ; son ACTE DE MARIAGE (~1845-1855, Villefranche) NOMMERA SES PARENTS — c'est la clé. Les arbres Geneanet (marieclaire1, abel88) sont bloqués aux robots (mur anti-robot vérifié) mais s'ouvrent sur téléphone. 🎖 PISTE trouvée à Gallica/BnF : un ANTOINE MAIFFRET figure dans « Les combattants français de la guerre américaine 1778-1783 » (liste officielle des Archives Nationales) — génération compatible avec un grand-père ou arrière-grand-père de Jean-Baptiste. NON prouvé, à relier par les registres. La presse locale numérisée (Le Réveil de Beaulieu 1924-28, bulletins horticoles de Nice) mentionne la famille — 409 documents « maiffret villefranche » à explorer sur Gallica.",sources:[SRC.ad06,SRC.gMaiffret,{label:"🎖 Gallica — Combattants français de la guerre d'Amérique (Maiffret, Antoine)",url:"https://gallica.bnf.fr/ark:/12148/bpt6k5525402h"},{label:"🗞 Gallica — presse « maiffret villefranche » (409 documents)",url:"https://gallica.bnf.fr/services/engine/search/sru?operation=searchRetrieve&version=1.2&query=gallica%20all%20%22maiffret%20villefranche%22"},SRC.marieclaire]});

/* Nettoyage doublons : même prénom+nom+dates → on garde la fiche la plus riche,
   on re-pointe les liens vers elle, on supprime les copies VIDES (sans photo ni
   commentaire) pour ne rien perdre. */
function dedupePersons(){
  var persons=DB.persons,by={};
  function key(p){return ((p.prenom||"")+"|"+(p.nom||"")+"|"+((p.naissance&&p.naissance.date)||"")+"|"+((p.deces&&p.deces.date)||"")).toLowerCase().replace(/\s+/g," ").trim();}
  function score(p){return (p.photos&&p.photos.length?p.photos.length*10:0)+(p.comments&&p.comments.length?p.comments.length*6:0)+(p.pere?1:0)+(p.mere?1:0)+((p.conjoints||[]).length)+childrenOf(p.id).length+(String(p.id).indexOf("seed_")===0?3:0)+(p.notes?1:0);}
  for(var id in persons){var k=key(persons[id]);if(!k||k.replace(/\|/g,"").trim()==="")continue;(by[k]=by[k]||[]).push(id);}
  var map={},removed=[];
  Object.keys(by).forEach(function(k){var ids=by[k];if(ids.length<2)return;ids.sort(function(a,b){return score(P(b))-score(P(a));});var keep=ids[0];for(var i=1;i<ids.length;i++){var d=P(ids[i]);if((d.photos&&d.photos.length)||(d.comments&&d.comments.length))continue;map[ids[i]]=keep;removed.push(ids[i]);}});
  if(!removed.length)return removed;
  for(var id2 in persons){var p=persons[id2];if(map[p.pere])p.pere=map[p.pere];if(map[p.mere])p.mere=map[p.mere];if(p.conjoints)p.conjoints=p.conjoints.map(function(c){return map[c]||c;}).filter(function(c,i,a){return c&&c!==id2&&a.indexOf(c)===i;});}
  removed.forEach(function(dupId){delete persons[dupId];});
  return removed;
}

function purgeLegacy(){var rm=[];for(var id in DB.persons){var p=DB.persons[id];if(String(id).indexOf("seed_")===0)continue;if((p.photos&&p.photos.length)||(p.comments&&p.comments.length))continue;for(var i=0;i<LEGACY_OBSOLETE.length;i++){var o=LEGACY_OBSOLETE[i];if((p.prenom||"")===o.prenom&&(p.nom||"")===o.nom&&((p.naissance&&p.naissance.date)||"")===o.nd){rm.push(id);break;}}}

/* Fantômes du cloud : anciennes copies (id aléatoire, versions précédentes de
   l'app) d'une personne du seed — même prénom+nom mais liens périmés (ex :
   Yann/Loïc rattachés à Christian & Marie-Brigitte alors que le document dit
   fils d'Émile). On supprime la copie VIDE (jamais si elle porte photos ou
   commentaires) et on re-pointe TOUS les liens (père/mère/conjoints) vers la
   fiche seed officielle. Prénom ambigu (2 seeds homonymes, ex : Jean MAIFFRET
   1852 et 1888) → jamais touché. Tourne au boot ET à chaque cloudPull. */
function purgeSeedShadows(){
  function nrm(p){return ((p.prenom||"")+" "+(p.nom||"")).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();}
  var seedBy={},amb={};
  for(var id in DB.persons){if(String(id).indexOf("seed_")!==0)continue;var k=nrm(DB.persons[id]);if(!k)continue;if(seedBy[k]&&seedBy[k]!==id)amb[k]=true;else seedBy[k]=id;}
  var map={},rm=[];
  for(var id2 in DB.persons){var p=DB.persons[id2];if(String(id2).indexOf("seed_")===0)continue;if((p.photos&&p.photos.length)||(p.comments&&p.comments.length))continue;var k2=nrm(p);if(!k2||amb[k2]||!seedBy[k2])continue;map[id2]=seedBy[k2];rm.push(id2);}
  if(!rm.length)return rm;
  for(var id3 in DB.persons){var q=DB.persons[id3],ch=false;
    if(map[q.pere]){q.pere=map[q.pere];ch=true;}
    if(map[q.mere]){q.mere=map[q.mere];ch=true;}
    if(q.conjoints&&q.conjoints.length){var nc=q.conjoints.map(function(c){return map[c]||c;}).filter(function(c,i,a){return c&&c!==id3&&a.indexOf(c)===i;});if(nc.join(",")!==(q.conjoints||[]).join(",")){q.conjoints=nc;ch=true;}}
    if(ch)q.updatedAt=now();}
  rm.forEach(function(x){delete DB.persons[x];});
  return rm;}

var _updTs=0;
async function checkUpdate(){
  if(Date.now()-_updTs<25000)return;_updTs=Date.now();
  if(document.querySelector(".ov"))return; /* ne coupe pas une saisie en cours */
  try{
    var r=await fetch("index.html?_v="+Date.now(),{cache:"reload"});if(!r.ok)return;
    var t=await r.text();var m=t.match(/APP_VER\s*=\s*"([^"]+)"/);
    function verNum(s){var g=String(s).match(/(\d+)\.(\d+)/);return g?(+g[1]*1000+ +g[2]):0;}
    /* On ne recharge QUE vers une version strictement plus récente → jamais de boucle
       si le CDN sert temporairement une ancienne version sur un de ses points. */
    if(m&&m[1]&&verNum(m[1])>verNum(APP_VER)){
      var last=+(localStorage.getItem("arbre_upd_ts")||0);
      if(Date.now()-last<90000)return; /* + garde temporelle : 1 rechargement max / 90 s */
      localStorage.setItem("arbre_upd_ts",String(Date.now()));
      try{if("serviceWorker"in navigator){var rs=await navigator.serviceWorker.getRegistrations();for(var i=0;i<rs.length;i++){try{await rs[i].unregister();}catch(e){}}}}catch(e){}
      try{if(window.caches){var ks=await caches.keys();for(var j=0;j<ks.length;j++){try{await caches.delete(ks[j]);}catch(e){}}}}catch(e){}
      location.replace(location.pathname+"?_upd="+Date.now());
    }
  }catch(e){}
}
