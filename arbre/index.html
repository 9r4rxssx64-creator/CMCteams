<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#0a0e17">
<title>Arbre généalogique — Famille</title>
<link rel="manifest" href="manifest.json">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://*.firebasedatabase.app https://identitytoolkit.googleapis.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'; manifest-src 'self'">
<style>
:root{
  --bg:#0a0e17; --ink:#eaf1fb; --mut:#94a6c4; --line:#243248;
  --glass:rgba(24,33,52,.62); --glass2:rgba(30,42,66,.8);
  --gold:#f0c874; --gold2:#ffe6a3; --cyan:#5be0d6; --violet:#9d8bff; --pink:#ff9ec7; --ok:#63e6a3; --danger:#ff7d97;
  --male:#7db8ff; --female:#ff9ec7;
  --r:18px; --sh:0 10px 40px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;overflow-x:hidden}
/* animated aurora background */
#aura{position:fixed;inset:-20% -20% -20% -20%;z-index:-2;filter:blur(60px);opacity:.55;pointer-events:none}
#aura b{position:absolute;border-radius:50%;mix-blend-mode:screen;animation:float 18s ease-in-out infinite}
#aura b:nth-child(1){width:46vmax;height:46vmax;left:-8%;top:-10%;background:radial-gradient(circle,#2a4bff,transparent 60%);animation-delay:-2s}
#aura b:nth-child(2){width:40vmax;height:40vmax;right:-6%;top:10%;background:radial-gradient(circle,#00d0b0,transparent 60%);animation-delay:-6s}
#aura b:nth-child(3){width:44vmax;height:44vmax;left:20%;bottom:-16%;background:radial-gradient(circle,#c46bff,transparent 60%);animation-delay:-10s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(4%,3%) scale(1.08)}66%{transform:translate(-3%,4%) scale(.96)}}
@media (prefers-reduced-motion:reduce){#aura b{animation:none}}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 80% at 50% -10%,rgba(120,150,255,.10),transparent 60%),linear-gradient(180deg,#0a0e17, #0a0e17)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--ink);background:rgba(12,18,30,.7);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold)}
.btn{display:inline-flex;align-items:center;gap:7px;justify-content:center;min-height:44px;padding:10px 15px;border-radius:13px;background:var(--glass2);border:1px solid var(--line);font-weight:600;backdrop-filter:blur(10px);transition:transform .12s,border-color .2s}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#241905;border:0;box-shadow:0 6px 20px rgba(240,200,116,.35)}
.btn.ghost{background:rgba(255,255,255,.04)}
.btn.sm{min-height:38px;padding:7px 11px;font-size:13px;border-radius:11px}
.btn.dng{color:var(--danger);border-color:#5a2733}
.hidden{display:none!important}.mut{color:var(--mut)}.gold{color:var(--gold)}
/* topbar */
#top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:linear-gradient(180deg,rgba(10,14,23,.92),rgba(10,14,23,.55));backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
#top .logo{font-size:22px;filter:drop-shadow(0 2px 6px rgba(240,200,116,.5))}
#top h1{font-size:16px;margin:0;font-weight:800;letter-spacing:.2px;flex:1;background:linear-gradient(90deg,var(--gold2),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#syncPill{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:5px 9px;background:rgba(12,18,30,.6)}
#syncPill i{width:9px;height:9px;border-radius:50%;background:#6b7686;transition:background .3s}
#syncPill.on i{background:var(--ok);box-shadow:0 0 10px var(--ok)}#syncPill.off i{background:#f0b45f}
#syncPill.sav i{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
#tabs{display:flex;gap:7px;padding:10px 12px 4px;overflow-x:auto;scrollbar-width:none}#tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:9px 15px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-weight:600;color:var(--mut);transition:.2s}
.tab.act{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#241905;border-color:transparent;box-shadow:0 6px 18px rgba(240,200,116,.3)}
#wrap{padding:8px 12px 24px;max-width:900px;margin:0 auto}
.sec{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:11px 0;backdrop-filter:blur(12px);box-shadow:var(--sh)}
.sec h3{margin:0 0 11px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--gold)}
.grid{display:grid;gap:10px}.chips{display:flex;flex-wrap:wrap;gap:8px}
.row2{display:flex;gap:9px}.row2>*{flex:1}
label.fl{display:block;font-size:12px;color:var(--mut);margin:11px 0 5px}
.empty{text-align:center;color:var(--mut);padding:44px 12px}
/* person card */
.pc{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;backdrop-filter:blur(10px);transition:transform .12s,border-color .2s}
.pc:active{transform:scale(.99);border-color:var(--gold)}
.av{width:52px;height:52px;border-radius:15px;flex:none;background:linear-gradient(135deg,#1b2740,#111a2c);display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;overflow:hidden;position:relative}
.av img{width:100%;height:100%;object-fit:cover}
.av.M{box-shadow:inset 0 0 0 2px var(--male),0 0 14px rgba(125,184,255,.25)}
.av.F{box-shadow:inset 0 0 0 2px var(--female),0 0 14px rgba(255,158,199,.25)}
.pc .nm{font-weight:700}.pc .sub{font-size:12.5px;color:var(--mut);margin-top:2px}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:999px;background:#22304a;color:var(--mut);margin-left:6px;vertical-align:middle}
.badge.alive{background:rgba(99,230,163,.16);color:var(--ok)}
/* ---- graphical tree stage ---- */
#treeCtl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 4px}
#treeCtl .seg{display:flex;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;overflow:hidden}
#treeCtl .seg button{padding:9px 13px;font-size:13px;font-weight:600;color:var(--mut)}
#treeCtl .seg button.on{background:linear-gradient(135deg,var(--cyan),#39b9ff);color:#04222a}
#stageWrap{position:relative;height:66vh;min-height:420px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:radial-gradient(90% 70% at 50% 0,rgba(90,120,220,.10),transparent),rgba(10,14,23,.5);touch-action:none;box-shadow:var(--sh)}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#stage svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.tnode{position:absolute;transform:translate(-50%,-50%);width:158px;padding:9px 10px;border-radius:15px;background:linear-gradient(180deg,var(--glass2),rgba(16,23,38,.9));border:1px solid var(--line);display:flex;gap:9px;align-items:center;box-shadow:0 8px 22px rgba(0,0,0,.4);cursor:pointer;transition:transform .12s,border-color .2s,box-shadow .2s}
.tnode:active{transform:translate(-50%,-50%) scale(.97)}
.tnode.root{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 10px 30px rgba(240,200,116,.25)}
.tnode .av{width:38px;height:38px;border-radius:11px;font-size:15px}
.tnode .tn{font-weight:700;font-size:12.5px;line-height:1.15;overflow:hidden}
.tnode .ty{font-size:10.5px;color:var(--mut)}
.tnode .rt{position:absolute;top:-8px;left:9px;font-size:9px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#04222a;background:var(--cyan);padding:1px 6px;border-radius:999px}
.zoomBtns{position:absolute;right:12px;bottom:12px;z-index:5;display:flex;flex-direction:column;gap:8px}
.zoomBtns button{width:44px;height:44px;border-radius:13px;background:var(--glass2);border:1px solid var(--line);font-size:20px;font-weight:800;backdrop-filter:blur(10px);box-shadow:var(--sh)}
.hintpan{position:absolute;left:12px;bottom:12px;z-index:5;font-size:11px;color:var(--mut);background:rgba(10,14,23,.6);border:1px solid var(--line);padding:5px 9px;border-radius:10px}
/* modal */
.ov{position:fixed;inset:0;z-index:60;background:rgba(4,7,12,.72);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:linear-gradient(180deg,#0d1320,#0a0e17);width:100%;max-width:680px;max-height:93vh;overflow:auto;border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:0;padding:16px 16px calc(env(safe-area-inset-bottom) + 26px);animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:translateY(0);opacity:1}}
.grab{width:46px;height:5px;border-radius:3px;background:#33405a;margin:2px auto 12px}
.sheet h2{margin:2px 0}
.caro{position:relative;border-radius:18px;overflow:hidden;background:#0c1220;border:1px solid var(--line);aspect-ratio:4/3;margin:12px 0}
.caro .slide{position:absolute;inset:0;opacity:0;transition:opacity .6s}
.caro .slide.on{opacity:1}.caro img{width:100%;height:100%;object-fit:cover}
.caro .dots{position:absolute;left:0;right:0;bottom:9px;display:flex;gap:6px;justify-content:center;z-index:2}
.caro .dots i{width:7px;height:7px;border-radius:50%;background:#ffffff66}.caro .dots i.on{background:#fff;width:18px;border-radius:4px}
.caro .nav{position:absolute;top:0;bottom:0;width:38%;z-index:2}.caro .nav.l{left:0}.caro .nav.r{right:0}
.caro .ph-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);font-size:13px;padding:20px}
.thumbs{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.thumbs .t{width:50px;height:50px;border-radius:11px;overflow:hidden;border:1px solid var(--line);position:relative}
.thumbs .t img{width:100%;height:100%;object-fit:cover}
.thumbs .t b{position:absolute;top:-3px;right:2px;color:var(--danger);font-weight:900;font-size:15px;text-shadow:0 1px 3px #000}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}.kv .k{color:var(--mut);font-size:13px}
.linkbtn{color:var(--cyan);text-decoration:none;font-weight:600}
.cmt{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:13px;padding:10px 11px;margin:8px 0}
.cmt .h{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin-bottom:3px}
.cmt .x{color:var(--danger);font-weight:800}
/* fab */
#fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:50;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#241905;font-size:32px;font-weight:800;box-shadow:0 10px 30px rgba(240,200,116,.5);display:flex;align-items:center;justify-content:center;transition:transform .15s}
#fab:active{transform:scale(.92) rotate(90deg)}
#ver{position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom) + 8px);z-index:50;font-size:10px;color:#5b6982;background:rgba(10,14,23,.7);padding:3px 8px;border-radius:8px;border:1px solid var(--line)}
/* gate */
#gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}
#gate .box{max-width:390px;width:100%;text-align:center;background:var(--glass);border:1px solid var(--line);border-radius:26px;padding:30px 24px;backdrop-filter:blur(16px);box-shadow:var(--sh)}
#gate .logo{font-size:60px;filter:drop-shadow(0 6px 20px rgba(240,200,116,.5));animation:bob 4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#gate h2{margin:10px 0 4px;background:linear-gradient(90deg,var(--gold2),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 90px);z-index:120;background:rgba(10,17,30,.96);border:1px solid var(--line);padding:11px 17px;border-radius:13px;box-shadow:var(--sh);max-width:88%;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none;backdrop-filter:blur(10px)}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="aura"><b></b><b></b><b></b></div>

<div id="gate">
  <div class="box">
    <div class="logo">🌳</div>
    <h2>Arbre familial</h2>
    <p class="mut" id="gateMsg" style="margin:6px 0 16px">Entre le code famille pour ouvrir l'arbre.</p>
    <input id="gateCode" type="password" inputmode="text" autocomplete="off" placeholder="Code famille" style="text-align:center;letter-spacing:3px;font-size:17px">
    <button class="btn gold" id="gateBtn" style="width:100%;margin-top:14px;min-height:50px">Entrer ✨</button>
    <p class="mut" id="gateHint" style="font-size:12px;margin-top:16px"></p>
  </div>
</div>

<div id="app" class="hidden">
  <div id="top">
    <span class="logo">🌳</span>
    <h1 id="ttl">Arbre familial</h1>
    <span id="syncPill"><i></i><span id="syncTxt">…</span></span>
  </div>
  <div id="tabs">
    <button class="tab act" data-view="tree">🌳 Arbre</button>
    <button class="tab" data-view="list">👥 Personnes</button>
    <button class="tab" data-view="search">🔎 Actes</button>
    <button class="tab" data-view="tools">⚙️ Réglages</button>
  </div>
  <div id="wrap"></div>
  <button id="fab" aria-label="Ajouter une personne">＋</button>
  <div id="ver"></div>
</div>
<div id="toast"></div>

<script>
"use strict";
var APP_VER="v2.1";
var DEFAULT_CODEHASH="a43c9ae454dfed007839c2e26b7b5358b7bc4087ecd74094d2dd43cc4b624aa7"; // MAIFFRET
/* ---------- utils ---------- */
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function $(s,r){return (r||document).querySelector(s);}
function el(h){var d=document.createElement("div");d.innerHTML=h.trim();return d.firstChild;}
function uid(){return "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function now(){return Date.now();}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove("on");},2600);}
function relTime(ts){var s=(now()-ts)/1000;if(s<60)return "à l'instant";if(s<3600)return Math.floor(s/60)+" min";if(s<86400)return Math.floor(s/3600)+" h";var d=Math.floor(s/86400);if(d<30)return d+" j";return new Date(ts).toLocaleDateString("fr-FR");}
async function sha256(s){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0");}).join("");}

/* ---------- storage ---------- */
var IDB=null;
function idbOpen(){return new Promise(function(res){try{var r=indexedDB.open("arbreDB",1);r.onupgradeneeded=function(){r.result.createObjectStore("kv");};r.onsuccess=function(){IDB=r.result;res(IDB);};r.onerror=function(){res(null);};}catch(e){res(null);}});}
function idbGet(k){return new Promise(function(res){if(!IDB)return res(null);try{var t=IDB.transaction("kv","readonly").objectStore("kv").get(k);t.onsuccess=function(){res(t.result||null);};t.onerror=function(){res(null);};}catch(e){res(null);}});}
function idbSet(k,v){return new Promise(function(res){if(!IDB)return res(false);try{var t=IDB.transaction("kv","readwrite").objectStore("kv").put(v,k);t.onsuccess=function(){res(true);};t.onerror=function(){res(false);};}catch(e){res(false);}});}
var DB={persons:{},meta:{updatedAt:0}};
var CODEHASH="",VIEW="tree",ROOT=null,TREEMODE="asc",EXP={},ME="";
function textOnly(db){var c={persons:{},meta:db.meta};for(var id in db.persons){var p=db.persons[id],q={};for(var k in p)if(k!=="photos")q[k]=p[k];q.photoCount=(p.photos||[]).length;c.persons[id]=q;}return c;}
async function saveLocal(){DB.meta.updatedAt=now();await idbSet("tree",DB);try{localStorage.setItem("arbre_v2_text",JSON.stringify(textOnly(DB)));}catch(e){}}
async function loadLocal(){var d=await idbGet("tree");if(d&&d.persons){DB=d;return true;}try{var t=JSON.parse(localStorage.getItem("arbre_v2_text")||"null");if(t&&t.persons){DB=t;return true;}}catch(e){}return false;}

/* ---------- cloud sync (anon Firebase, fail-open, temps réel) ---------- */
var FB="https://cmcteams-c16ab-default-rtdb.europe-west1.firebasedatabase.app";
var FB_KEY="AIzaSyDciW-0sIIg9msdmgZjQHBksqzsfA6DCMs";
var _tok=null,_tokExp=0,_cloudOK=false;
function setPill(state){var p=$("#syncPill"),t=$("#syncTxt");if(!p)return;p.className="";if(state==="sav"){p.classList.add("sav");t.textContent="Enregistré";}else if(_cloudOK){p.classList.add("on");t.textContent="Synchro famille";}else{p.classList.add("off");t.textContent="Local";}}
async function anonAuth(){if(_tok&&now()<_tokExp-60000)return _tok;try{var r=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signUp?key="+FB_KEY,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({returnSecureToken:true})});if(!r.ok)throw 0;var j=await r.json();_tok=j.idToken;_tokExp=now()+((+j.expiresIn||3600)*1000);return _tok;}catch(e){_tok=null;return null;}}
function cloudBase(){return FB+"/arbre/"+CODEHASH;}
async function cloudPush(id){var t=await anonAuth();if(!t)return _fail();try{var r=await fetch(cloudBase()+"/persons/"+id+".json?auth="+t,{method:"PUT",body:JSON.stringify(DB.persons[id]||null)});if(!r.ok)throw 0;_cloudOK=true;setPill();return true;}catch(e){return _fail();}}
function _fail(){_cloudOK=false;setPill();return false;}
async function cloudPushAll(){var t=await anonAuth();if(!t)return _fail();try{var r=await fetch(cloudBase()+".json?auth="+t,{method:"PUT",body:JSON.stringify({persons:DB.persons,meta:DB.meta})});if(!r.ok)throw 0;_cloudOK=true;setPill();return true;}catch(e){return _fail();}}
async function cloudPull(silent){var t=await anonAuth();if(!t)return _fail();try{var r=await fetch(cloudBase()+".json?auth="+t);if(!r.ok)throw 0;var rem=await r.json();_cloudOK=true;setPill();if(!rem||!rem.persons){if(Object.keys(DB.persons).length)await cloudPushAll();return;}var changed=false;for(var id in rem.persons){var rp=rem.persons[id];if(!rp)continue;var lp=DB.persons[id];if(!lp||(rp.updatedAt||0)>(lp.updatedAt||0)){DB.persons[id]=rp;changed=true;}}
  // deletions: remote tombstone
  if(changed){await idbSet("tree",DB);try{localStorage.setItem("arbre_v2_text",JSON.stringify(textOnly(DB)));}catch(e){}if(!silent)toast("🔄 Mis à jour depuis la famille");if(!$(".ov"))render();}
}catch(e){return _fail();}}
async function persist(id){await saveLocal();setPill("sav");setTimeout(setPill,1100);if(id)cloudPush(id);else cloudPushAll();}

/* ---------- model ---------- */
function P(id){return DB.persons[id]||null;}
function full(p){if(!p)return "?";return ((p.prenom||"")+" "+(p.nom||"")).trim()||"(sans nom)";}
function yr(d){if(!d)return "";var m=String(d).match(/\d{4}/);return m?m[0]:"";}
function lifespan(p){var a=yr(p.naissance&&p.naissance.date),b=yr(p.deces&&p.deces.date);if(p.vivant)return a?a+" · vivant":"vivant";if(!a&&!b)return "";return (a||"?")+(b?"–"+b:"");}
function childrenOf(id){var r=[];for(var k in DB.persons){var p=DB.persons[k];if(p.pere===id||p.mere===id)r.push(k);}return r;}
function spouseNames(p){return (p.conjoints||[]).map(function(id){return full(P(id));}).filter(Boolean);}
function initials(p){return ((p.prenom||"?")[0]||"?").toUpperCase();}
function avatarHTML(p,sz){var cls=p.sexe==="F"?"F":p.sexe==="M"?"M":"";var ph=(p.photos&&p.photos[0]);var st=sz?'style="width:'+sz+'px;height:'+sz+'px;font-size:'+(sz*0.42|0)+'px"':"";return '<div class="av '+cls+'" '+st+'>'+(ph?'<img src="'+ph+'" alt="">':esc(initials(p)))+'</div>';}

/* ---------- graphical tree ---------- */
var VIEWST={tx:40,ty:40,sc:1};
/* Arbre COMPLET : toute la famille en un seul arbre (couples + enfants), auto-agencé. */
function layoutForest(){
  var ROWH=150,BOXW=150,COUPLEGAP=12,UNITGAP=34,PAD=40;
  var placed={},nodes=[],links=[],cursor=PAD,maxY=0;
  function members(id){var p=P(id);var m=[id];(p.conjoints||[]).forEach(function(c){if(P(c)&&!placed[c]&&c!==id&&m.indexOf(c)<0)m.push(c);});return m;}
  function unit(id,depth){
    if(placed[id])return null;
    var mem=members(id);mem.forEach(function(x){placed[x]=1;});
    var y=PAD+depth*ROWH;if(y>maxY)maxY=y;
    var kidset={};mem.forEach(function(x){childrenOf(x).forEach(function(k){if(!placed[k])kidset[k]=1;});});
    var kids=Object.keys(kidset).sort(function(a,b){var ya=yr(P(a).naissance&&P(a).naissance.date),yb=yr(P(b).naissance&&P(b).naissance.date);return (ya||9999)-(yb||9999);});
    var childCenters=[];var childY=PAD+(depth+1)*ROWH;
    kids.forEach(function(k){var cc=unit(k,depth+1);if(cc!=null)childCenters.push(cc);});
    var unitW=mem.length*BOXW+(mem.length-1)*COUPLEGAP;
    var center;
    if(childCenters.length){center=(Math.min.apply(null,childCenters)+Math.max.apply(null,childCenters))/2;}
    else{center=cursor+unitW/2;cursor+=unitW+UNITGAP;}
    var startX=center-unitW/2+BOXW/2;
    mem.forEach(function(x,i){nodes.push({id:x,x:startX+i*(BOXW+COUPLEGAP),y:y,root:x==="seed_kevin"});});
    for(var i=0;i<mem.length-1;i++)links.push({couple:1,x1:startX+i*(BOXW+COUPLEGAP),y1:y,x2:startX+(i+1)*(BOXW+COUPLEGAP),y2:y});
    childCenters.forEach(function(cx){links.push({x1:center,y1:y+30,x2:cx,y2:childY-30});});
    return center;
  }
  var roots=[];for(var id in DB.persons){var p=DB.persons[id];if(!p.pere&&!p.mere)roots.push(id);}
  roots.sort(function(a,b){return (childrenOf(b).length?1:0)-(childrenOf(a).length?1:0);}); // familles d'abord
  roots.forEach(function(id){if(!placed[id])unit(id,0);});
  for(var id2 in DB.persons){if(!placed[id2])unit(id2,0);}
  return {nodes:nodes,links:links,w:Math.max(cursor,600)+PAD,h:maxY+ROWH};
}

  var w=$("#wrap");var n=Object.keys(DB.persons).length;
  if(!n){w.innerHTML='<div class="empty">Ton arbre est vide.<br>Touche ＋ pour ajouter la 1ʳᵉ personne.</div>';return;}
  w.innerHTML='<div id="stageWrap"><div id="stage"></div><div class="zoomBtns"><button data-z="1" aria-label="Zoom +">＋</button><button data-z="-1" aria-label="Zoom −">−</button><button data-z="fit" aria-label="Tout voir">⤢</button></div><div class="hintpan">👨‍👩‍👧‍👦 '+n+' personnes · glisse pour bouger · pince pour zoomer · touche une fiche</div></div>';

var _lay=null;
function drawStage(fit){
  var stage=$("#stage");if(!stage)return;_lay=layoutForest();
  var paths=_lay.links.map(function(l){if(l.couple)return '<line x1="'+l.x1+'" y1="'+l.y1+'" x2="'+l.x2+'" y2="'+l.y2+'" stroke="#d9b45a" stroke-width="3" stroke-linecap="round"/>';var my=(l.y1+l.y2)/2;return '<path d="M'+l.x1+' '+l.y1+' C '+l.x1+' '+my+' '+l.x2+' '+my+' '+l.x2+' '+l.y2+'" fill="none" stroke="#3a5578" stroke-width="2"/>';}).join("");
  var svg='<svg width="'+_lay.w+'" height="'+_lay.h+'">'+paths+'</svg>';
  stage.style.width=_lay.w+"px";stage.style.height=_lay.h+"px";
  stage.innerHTML=svg+_lay.nodes.map(tnodeHTML).join("");
  if(fit)fitStage();
}
function applyST(){var s=$("#stage");if(s)s.style.transform="translate("+VIEWST.tx+"px,"+VIEWST.ty+"px) scale("+VIEWST.sc+")";}
function fitStage(){var wr=$("#stageWrap");if(!wr||!_lay)return;var W=wr.clientWidth,H=wr.clientHeight;var sc=Math.min(W/_lay.w,H/_lay.h,1.1);sc=Math.max(sc,0.25);VIEWST.sc=sc;VIEWST.tx=(W-_lay.w*sc)/2;VIEWST.ty=(H-_lay.h*sc)/2;applyST();}
function zoomAt(fx,fy,factor){var wr=$("#stageWrap");if(!wr)return;var W=wr.clientWidth,H=wr.clientHeight;var cx=fx*W,cy=fy*H;var ns=Math.min(2.5,Math.max(0.2,VIEWST.sc*factor));VIEWST.tx=cx-(cx-VIEWST.tx)*(ns/VIEWST.sc);VIEWST.ty=cy-(cy-VIEWST.ty)*(ns/VIEWST.sc);VIEWST.sc=ns;applyST();}
function setupPanZoom(){
  var wr=$("#stageWrap");if(!wr||wr._pz)return;wr._pz=1;var drag=null,pts={},pinch=null;
  wr.addEventListener("pointerdown",function(e){pts[e.pointerId]={x:e.clientX,y:e.clientY};if(Object.keys(pts).length===1){drag={x:e.clientX,y:e.clientY,tx:VIEWST.tx,ty:VIEWST.ty,moved:false};}});
  wr.addEventListener("pointermove",function(e){if(!pts[e.pointerId])return;pts[e.pointerId]={x:e.clientX,y:e.clientY};var ids=Object.keys(pts);
    if(ids.length>=2){var a=pts[ids[0]],b=pts[ids[1]];var d=Math.hypot(a.x-b.x,a.y-b.y);var mx=(a.x+b.x)/2,my=(a.y+b.y)/2;var r=wr.getBoundingClientRect();if(pinch){var f=d/pinch.d;var ns=Math.min(2.5,Math.max(0.2,pinch.sc*f));var cx=mx-r.left,cy=my-r.top;VIEWST.tx=cx-(cx-pinch.tx)*(ns/pinch.sc);VIEWST.ty=cy-(cy-pinch.ty)*(ns/pinch.sc);VIEWST.sc=ns;applyST();}else pinch={d:d,sc:VIEWST.sc,tx:VIEWST.tx,ty:VIEWST.ty};drag=null;return;}
    if(drag){VIEWST.tx=drag.tx+(e.clientX-drag.x);VIEWST.ty=drag.ty+(e.clientY-drag.y);if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>10)drag.moved=true;applyST();}});
  function up(e){delete pts[e.pointerId];if(Object.keys(pts).length<2)pinch=null;if(Object.keys(pts).length===0){if(drag&&drag.moved){wr._suppress=now();}drag=null;}}
  wr.addEventListener("pointerup",up);wr.addEventListener("pointercancel",up);
  wr.addEventListener("wheel",function(e){e.preventDefault();var r=wr.getBoundingClientRect();zoomAt((e.clientX-r.left)/wr.clientWidth,(e.clientY-r.top)/wr.clientHeight,e.deltaY<0?1.12:1/1.12);},{passive:false});
  wr.addEventListener("click",function(e){if(wr._suppress&&now()-wr._suppress<300){e.stopPropagation();e.preventDefault();}},true);
}

function importPhoto(file){return new Promise(function(res,rej){
  var MAX=1400;
  function fromBitmap(){return createImageBitmap(file,{imageOrientation:"from-image"}).then(function(bm){return draw(bm,bm.width,bm.height);});}
  function fromImg(){return new Promise(function(rs,rj){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){rs(draw(im,im.naturalWidth,im.naturalHeight));};im.onerror=rj;im.src=r.result;};r.onerror=rj;r.readAsDataURL(file);});}
  function draw(src,w,h){var s=Math.min(1,MAX/Math.max(w,h));var cw=Math.round(w*s),chh=Math.round(h*s);var cv=document.createElement("canvas");cv.width=cw;cv.height=chh;var ctx=cv.getContext("2d");ctx.fillStyle="#0c1220";ctx.fillRect(0,0,cw,chh);ctx.drawImage(src,0,0,cw,chh);return cv.toDataURL("image/jpeg",0.82);}
  (("createImageBitmap"in window)?fromBitmap().catch(fromImg):fromImg()).then(res).catch(function(){fromImg().then(res).catch(rej);});
});}

function doExport(){var blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="arbre-familial-"+new Date().toISOString().slice(0,10)+".json";a.click();toast("⬇️ Exporté");}
function doImport(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=async function(){try{var d=JSON.parse(r.result);if(!d.persons)throw 0;var add=0;for(var id in d.persons){var rp=d.persons[id],lp=DB.persons[id];if(!lp||(rp.updatedAt||0)>(lp.updatedAt||0)){DB.persons[id]=rp;add++;}}await persist();render();toast("⬆️ Importé ("+add+" fiches)");}catch(err){toast("Fichier invalide");}};r.readAsText(f);e.target.value="";}
function setMe(){var n=prompt("Ton prénom (apparaîtra sur tes ajouts/commentaires) :",ME||"");if(n!=null){ME=n.trim();localStorage.setItem("arbre_me",ME);if(VIEW==="tools")render();}}
async function changeCode(){var c=prompt("Nouveau code famille :");if(!c)return;var c2=prompt("Confirme :");if(c!==c2){toast("Codes différents");return;}CODEHASH=await sha256("arbre::"+c.trim());localStorage.setItem("arbre_codehash",CODEHASH);await cloudPushAll();toast("🔑 Code changé — repartage-le");}
