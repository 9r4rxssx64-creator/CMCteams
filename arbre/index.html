<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#e7d9ba">
<title>Arbre généalogique — Famille</title>
<link rel="manifest" href="manifest.json">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://*.firebasedatabase.app https://identitytoolkit.googleapis.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'; manifest-src 'self'">
<style>
:root{
  --bg:#e7d9ba; --ink:#3a2c16; --mut:#8a7550; --line:#cbb488;
  --glass:rgba(249,242,225,.85); --glass2:rgba(243,233,208,.92);
  --gold:#b0842c; --gold2:#e2bd5c; --cyan:#3c8a80; --violet:#7a6ad6; --pink:#c96f9e; --ok:#3f9d6a; --danger:#c8506a;
  --male:#3f6bb0; --female:#c96f9e;
  --r:18px; --sh:0 10px 30px rgba(92,70,28,.22);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;overflow-x:hidden}
/* animated aurora background */
#aura{position:fixed;inset:-20% -20% -20% -20%;z-index:-2;filter:blur(70px);opacity:.28;pointer-events:none}
#aura b{position:absolute;border-radius:50%;mix-blend-mode:screen;animation:float 18s ease-in-out infinite}
#aura b:nth-child(1){width:46vmax;height:46vmax;left:-8%;top:-10%;background:radial-gradient(circle,#caa24e,transparent 60%);animation-delay:-2s}
#aura b:nth-child(2){width:40vmax;height:40vmax;right:-6%;top:10%;background:radial-gradient(circle,#7fae63,transparent 60%);animation-delay:-6s}
#aura b:nth-child(3){width:44vmax;height:44vmax;left:20%;bottom:-16%;background:radial-gradient(circle,#d8c07a,transparent 60%);animation-delay:-10s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(4%,3%) scale(1.08)}66%{transform:translate(-3%,4%) scale(.96)}}
@media (prefers-reduced-motion:reduce){#aura b{animation:none}}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 80% at 50% -10%,rgba(200,168,104,.28),transparent 60%),linear-gradient(180deg,#efe3c6,#e0cfa6)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--ink);background:rgba(255,252,244,.85);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold)}
.btn{display:inline-flex;align-items:center;gap:7px;justify-content:center;min-height:44px;padding:10px 15px;border-radius:13px;background:var(--glass2);border:1px solid var(--line);font-weight:600;backdrop-filter:blur(10px);transition:transform .12s,border-color .2s}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#241905;border:0;box-shadow:0 6px 20px rgba(240,200,116,.35)}
.btn.ghost{background:rgba(255,255,255,.04)}
.btn.sm{min-height:38px;padding:7px 11px;font-size:13px;border-radius:11px}
.btn.dng{color:var(--danger);border-color:#5a2733}
.hidden{display:none!important}.mut{color:var(--mut)}.gold{color:var(--gold)}
/* topbar */
#top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:linear-gradient(180deg,rgba(239,227,198,.96),rgba(239,227,198,.55));backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
#top .logo{font-size:22px;filter:drop-shadow(0 2px 6px rgba(240,200,116,.5))}
#top h1{font-size:19px;margin:0;font-weight:700;font-family:Georgia,"Times New Roman",serif;font-style:italic;letter-spacing:.2px;flex:1;background:linear-gradient(90deg,var(--gold2),#7fc98a);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#syncPill{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:5px 9px;background:rgba(255,252,244,.7)}
#syncPill i{width:9px;height:9px;border-radius:50%;background:#6b7686;transition:background .3s}
#syncPill.on i{background:var(--ok);box-shadow:0 0 10px var(--ok)}#syncPill.off i{background:#f0b45f}
#syncPill.sav i{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
#tabs{display:flex;gap:7px;padding:10px 12px 4px;overflow-x:auto;scrollbar-width:none}#tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:9px 15px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-weight:600;color:var(--mut);transition:.2s}
.tab.act{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#241905;border-color:transparent;box-shadow:0 6px 18px rgba(240,200,116,.3)}
#wrap{padding:8px 12px 24px;max-width:900px;margin:0 auto}
.sec{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:11px 0;backdrop-filter:blur(12px);box-shadow:var(--sh)}
.sec h3{margin:0 0 11px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--gold)}
.grid{display:grid;gap:10px}.chips{display:flex;flex-wrap:wrap;gap:8px}
.row2{display:flex;gap:9px}.row2>*{flex:1}
label.fl{display:block;font-size:12px;color:var(--mut);margin:11px 0 5px}
.empty{text-align:center;color:var(--mut);padding:44px 12px}
/* person card */
.pc{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;backdrop-filter:blur(10px);transition:transform .12s,border-color .2s}
.pc:active{transform:scale(.99);border-color:var(--gold)}
.av{width:52px;height:52px;border-radius:50%;flex:none;background:radial-gradient(circle at 36% 30%,#fffbef,#e7d4a6);color:#7a5427;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:700;font-family:Georgia,"Times New Roman",serif;overflow:hidden;position:relative;box-shadow:inset 0 0 0 1px rgba(120,84,36,.3)}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.av.M{box-shadow:0 0 0 2px rgba(63,107,176,.55),inset 0 0 0 1px rgba(120,84,36,.25)}
.av.F{box-shadow:0 0 0 2px rgba(201,111,158,.55),inset 0 0 0 1px rgba(120,84,36,.25)}
.pc .nm{font-weight:700}.pc .sub{font-size:12.5px;color:var(--mut);margin-top:2px}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:999px;background:#22304a;color:var(--mut);margin-left:6px;vertical-align:middle}
.badge.alive{background:rgba(99,230,163,.16);color:var(--ok)}
/* ---- graphical tree stage ---- */
#treeCtl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 4px}
#treeCtl .seg{display:flex;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;overflow:hidden}
#treeCtl .seg button{padding:9px 13px;font-size:13px;font-weight:600;color:var(--mut)}
#treeCtl .seg button.on{background:linear-gradient(135deg,var(--cyan),#39b9ff);color:#04222a}
#stageWrap{position:relative;height:74vh;min-height:480px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:radial-gradient(130% 80% at 50% 102%,rgba(120,150,86,.22),transparent),radial-gradient(100% 60% at 50% -4%,rgba(206,168,98,.22),transparent),linear-gradient(180deg,#efe4c8,#e3d1a8);touch-action:none;box-shadow:var(--sh)}
#treeBg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;transition:opacity .5s}
#treeArt{position:absolute;inset:0;opacity:.8;transition:opacity .6s}#treeArt svg{width:100%;height:100%;display:block}
#treePhoto{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center 46%;opacity:0;transition:opacity .6s}
#treePhoto.on{opacity:1}#treePhoto.on ~ #treeScrim{opacity:1}
#treeScrim{position:absolute;inset:0;opacity:0;background:linear-gradient(180deg,rgba(16,24,8,.10),rgba(16,24,8,0) 24%,rgba(14,18,6,.12))}
#stageWrap.plan #treeBg{opacity:0}
#stage{position:absolute;left:0;top:0;z-index:1;transform-origin:0 0;will-change:transform}
#stage svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.tnode{position:absolute;transform:translate(-50%,-50%);width:186px;padding:12px 13px;border-radius:14px;background:linear-gradient(180deg,#fffdf4,#f2e6c8);border:1.5px solid #b8912f;display:flex;gap:11px;align-items:center;box-shadow:0 6px 16px rgba(74,54,22,.4),inset 0 1px 0 rgba(255,255,255,.7);cursor:pointer;transition:transform .12s,border-color .2s,box-shadow .2s}
.tnode:active{transform:translate(-50%,-50%) scale(.97)}
.tnode.root{border-color:var(--gold);box-shadow:0 0 0 1.5px var(--gold),0 12px 34px rgba(240,200,116,.3)}
.tnode.sM{border-top:2px solid rgba(93,159,214,.6)}
.tnode.sF{border-top:2px solid rgba(255,158,199,.6)}
.tnode .av{width:44px;height:44px;border-radius:50%;font-size:18px;font-family:Georgia,"Times New Roman",serif;color:#7a5427;background:radial-gradient(circle at 36% 30%,#fffbef,#e7d4a6)!important;box-shadow:inset 0 0 0 1px rgba(120,84,36,.3)}
.tnode.sM .av{box-shadow:0 0 0 2px rgba(63,107,176,.55),inset 0 0 0 1px rgba(120,84,36,.25)}
.tnode.sF .av{box-shadow:0 0 0 2px rgba(201,111,158,.55),inset 0 0 0 1px rgba(120,84,36,.25)}
.tnode.root .av{box-shadow:0 0 0 2px var(--gold),0 2px 8px rgba(176,132,44,.4)}
.tnode .tn{font-weight:700;font-size:14px;line-height:1.16;overflow:hidden;text-overflow:ellipsis;color:#2c2010;font-family:Georgia,"Times New Roman",serif}
.tnode .ty{font-size:11.5px;color:#856a3a;margin-top:1px}
.av.M,.av.F{background:radial-gradient(circle at 36% 30%,#fffbef,#e7d4a6)}
.bandlab{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:#f3e6c2;background:rgba(74,54,26,.9);padding:5px 14px;border:1px solid var(--line);border-radius:999px;backdrop-filter:blur(8px);white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.couplebadge{position:absolute;transform:translate(-50%,-50%);font-size:15px;background:rgba(255,248,230,.96);border:1px solid var(--gold);border-radius:999px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(240,200,116,.35)}
.treemode{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:6;display:flex;gap:4px;background:rgba(74,54,26,.9);border:1px solid var(--gold);border-radius:999px;padding:3px;backdrop-filter:blur(8px);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.treemode button{font-size:12px;font-weight:700;color:#f3e6c2;padding:7px 12px;border-radius:999px;white-space:nowrap}
.treemode button.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#3a2708}
.addrel{display:flex;gap:8px;flex-wrap:wrap}.addrel .btn{flex:1;min-width:calc(50% - 4px)}
.tnode .rt{position:absolute;top:-8px;left:9px;font-size:9px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#04222a;background:var(--cyan);padding:1px 6px;border-radius:999px}
.zoomBtns{position:absolute;right:12px;bottom:12px;z-index:5;display:flex;flex-direction:column;gap:8px}
.zoomBtns button{width:44px;height:44px;border-radius:13px;background:var(--glass2);border:1px solid var(--line);font-size:20px;font-weight:800;backdrop-filter:blur(10px);box-shadow:var(--sh)}
.hintpan{position:absolute;left:12px;bottom:12px;z-index:5;font-size:11px;color:var(--mut);background:rgba(255,250,238,.8);border:1px solid var(--line);padding:5px 9px;border-radius:10px}
/* modal */
.ov{position:fixed;inset:0;z-index:60;background:rgba(4,7,12,.72);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{position:relative;background:linear-gradient(180deg,#f8f1dd,#efe3c6);width:100%;max-width:680px;max-height:93vh;overflow:auto;border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:0;padding:16px 16px calc(env(safe-area-inset-bottom) + 26px);animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:translateY(0);opacity:1}}
.grab{width:46px;height:5px;border-radius:3px;background:#33405a;margin:2px auto 12px}
.sheet h2{margin:2px 0}
.caro{position:relative;border-radius:18px;overflow:hidden;background:#ddcaa0;border:1px solid var(--line);aspect-ratio:4/3;margin:12px 0}
.caro .slide{position:absolute;inset:0;opacity:0;transition:opacity .6s}
.caro .slide.on{opacity:1}.caro img{width:100%;height:100%;object-fit:cover}
.caro .dots{position:absolute;left:0;right:0;bottom:9px;display:flex;gap:6px;justify-content:center;z-index:2}
.caro .dots i{width:7px;height:7px;border-radius:50%;background:#ffffff66}.caro .dots i.on{background:#fff;width:18px;border-radius:4px}
.caro .nav{position:absolute;top:0;bottom:0;width:38%;z-index:2}.caro .nav.l{left:0}.caro .nav.r{right:0}
.caro .ph-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);font-size:13px;padding:20px}
.thumbs{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.thumbs .t{width:50px;height:50px;border-radius:11px;overflow:hidden;border:1px solid var(--line);position:relative}
.thumbs .t img{width:100%;height:100%;object-fit:cover}
.thumbs .t b{position:absolute;top:-3px;right:2px;color:var(--danger);font-weight:900;font-size:15px;text-shadow:0 1px 3px #000}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}.kv .k{color:var(--mut);font-size:13px}
.linkbtn{color:var(--cyan);text-decoration:none;font-weight:600}
a{color:var(--cyan);text-decoration:none}
.srcbtn{display:inline-flex;align-items:center;gap:6px;background:rgba(91,224,214,.10);border:1px solid rgba(91,224,214,.35);color:var(--cyan);border-radius:11px;padding:9px 12px;font-size:13px;font-weight:600}
.relchip{display:inline-flex;align-items:center;gap:8px;background:var(--glass2);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 6px;font-weight:600;color:var(--ink)}
.relchip .av{width:30px;height:30px;border-radius:9px;font-size:13px}
.relchip small{color:var(--mut);font-weight:500;margin-left:2px}
.irow{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.irow:last-child{border:0}.irow .ic{font-size:18px;width:24px;text-align:center;flex:none}
.irow .lab{color:var(--mut);font-size:12px}.irow .val{font-weight:600}
.bkbtn{position:absolute;left:14px;top:14px;width:44px;height:44px;border-radius:12px;background:linear-gradient(180deg,#fffdf4,#f0e2c2);color:#7a5427;border:1px solid var(--gold);font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;z-index:5;box-shadow:0 3px 10px rgba(74,54,22,.25)}
.bkbtn:active{transform:scale(.94)}
.cmt{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:13px;padding:10px 11px;margin:8px 0}
.cmt .h{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin-bottom:3px}
.cmt .x{color:var(--danger);font-weight:800}
/* fab */
#fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:50;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#241905;font-size:32px;font-weight:800;box-shadow:0 10px 30px rgba(240,200,116,.5);display:flex;align-items:center;justify-content:center;transition:transform .15s}
#fab:active{transform:scale(.92) rotate(90deg)}
#ver{position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom) + 8px);z-index:50;font-size:10px;color:#8a7550;background:rgba(255,250,238,.8);padding:3px 8px;border-radius:8px;border:1px solid var(--line)}
/* gate */
#gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}
#gate .box{max-width:390px;width:100%;text-align:center;background:var(--glass);border:1px solid var(--line);border-radius:26px;padding:30px 24px;backdrop-filter:blur(16px);box-shadow:var(--sh)}
#gate .logo{font-size:60px;filter:drop-shadow(0 6px 20px rgba(240,200,116,.5));animation:bob 4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#gate h2{margin:10px 0 4px;background:linear-gradient(90deg,var(--gold2),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 90px);z-index:120;background:#3a2c16;color:#f7efd9;border:1px solid var(--line);padding:11px 17px;border-radius:13px;box-shadow:var(--sh);max-width:88%;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none;backdrop-filter:blur(10px)}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="aura"><b></b><b></b><b></b></div>

<div id="gate">
  <div class="box">
    <div class="logo">🌳</div>
    <h2>Arbre familial</h2>
    <p class="mut" id="gateMsg" style="margin:6px 0 16px">Entre le code famille pour ouvrir l'arbre.</p>
    <input id="gateCode" type="password" inputmode="text" autocomplete="off" placeholder="Code famille" style="text-align:center;letter-spacing:3px;font-size:17px">
    <button class="btn gold" id="gateBtn" style="width:100%;margin-top:14px;min-height:50px">Entrer ✨</button>
    <p class="mut" id="gateHint" style="font-size:12px;margin-top:16px"></p>
  </div>
</div>

<div id="app" class="hidden">
  <div id="top">
    <span class="logo">🌳</span>
    <h1 id="ttl">Arbre familial</h1>
    <span id="syncPill"><i></i><span id="syncTxt">…</span></span>
  </div>
  <div id="tabs">
    <button class="tab act" data-view="tree">🌳 Arbre</button>
    <button class="tab" data-view="list">👥 Personnes</button>
    <button class="tab" data-view="search">🔎 Actes</button>
    <button class="tab" data-view="tools">⚙️ Réglages</button>
  </div>
  <div id="wrap"></div>
  <button id="fab" aria-label="Ajouter une personne">＋</button>
  <div id="ver"></div>
</div>
<div id="toast"></div>

<script>
"use strict";
var APP_VER="v2.17";
var DEFAULT_CODEHASH="a43c9ae454dfed007839c2e26b7b5358b7bc4087ecd74094d2dd43cc4b624aa7"; // MAIFFRET
/* ---------- utils ---------- */
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function $(s,r){return (r||document).querySelector(s);}
function el(h){var d=document.createElement("div");d.innerHTML=h.trim();return d.firstChild;}
function uid(){return "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function now(){return Date.now();}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove("on");},2600);}
function relTime(ts){var s=(now()-ts)/1000;if(s<60)return "à l'instant";if(s<3600)return Math.floor(s/60)+" min";if(s<86400)return Math.floor(s/3600)+" h";var d=Math.floor(s/86400);if(d<30)return d+" j";return new Date(ts).toLocaleDateString("fr-FR");}
async function sha256(s){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0");}).join("");}

/* ---------- storage ---------- */
var IDB=null;
function idbOpen(){return new Promise(function(res){try{var r=indexedDB.open("arbreDB",1);r.onupgradeneeded=function(){r.result.createObjectStore("kv");};r.onsuccess=function(){IDB=r.result;res(IDB);};r.onerror=function(){res(null);};}catch(e){res(null);}});}
function idbGet(k){return new Promise(function(res){if(!IDB)return res(null);try{var t=IDB.transaction("kv","readonly").objectStore("kv").get(k);t.onsuccess=function(){res(t.result||null);};t.onerror=function(){res(null);};}catch(e){res(null);}});}
function idbSet(k,v){return new Promise(function(res){if(!IDB)return res(false);try{var t=IDB.transaction("kv","readwrite").objectStore("kv").put(v,k);t.onsuccess=function(){res(true);};t.onerror=function(){res(false);};}catch(e){res(false);}});}
var DB={persons:{},meta:{updatedAt:0}};
var CODEHASH="",VIEW="tree",ROOT=null,TREEMODE="asc",EXP={},ME="";

/* Arbre COMPLET : chaque FAMILLE reliée = un bloc-arbre soigné (couples + enfants),
   empilés et centrés ; les personnes pas encore reliées = une grille propre en bas.
   Fini la longue bande minuscule dans le coin. */
var TREE={ROWH:150,BOXW:198,COUPLEGAP:16,UNITGAP:26,PAD:34,COMPGAP:64,CARD:184};
function compLabel(ids){var cnt={};ids.forEach(function(x){var nm=(P(x).nom||"").trim().toUpperCase();if(nm)cnt[nm]=(cnt[nm]||0)+1;});var top=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a];}).slice(0,2);return top.length?("Famille "+top.join(" · ")):"Famille";}
/* Agencement « propre » d'une famille : les PARENTS en haut, chaque enfant
   DIRECTEMENT EN DESSOUS de ses parents (couple centré au-dessus de ses enfants).
   Les plus jeunes descendent tout en bas (ex : Ronan au pied du tronc). */
function tidyTree(ids){
  var T=TREE,ROWH=T.ROWH,BOXW=T.BOXW,COUPLEGAP=T.COUPLEGAP,UNITGAP=T.UNITGAP;
  var set={};ids.forEach(function(x){set[x]=1;});
  var placed={},nodes=[],links=[],cursor=0,depthMax=0;
  function members(x){var pp=P(x);var m=[x];(pp.conjoints||[]).forEach(function(c){if(set[c]&&!placed[c]&&c!==x&&m.indexOf(c)<0)m.push(c);});return m;}
  function unit(x,depth){
    if(placed[x])return null;
    var mem=members(x);mem.forEach(function(z){placed[z]=1;});if(depth>depthMax)depthMax=depth;
    var kidset={};mem.forEach(function(z){childrenOf(z).forEach(function(k){if(set[k]&&!placed[k])kidset[k]=1;});});
    var kids=Object.keys(kidset).sort(function(a,b){return ((yr(P(a).naissance&&P(a).naissance.date))||9999)-((yr(P(b).naissance&&P(b).naissance.date))||9999);});
    var cc=[];kids.forEach(function(k){var c=unit(k,depth+1);if(c!=null)cc.push(c);});
    var uW=mem.length*BOXW+(mem.length-1)*COUPLEGAP,center;
    if(cc.length)center=(Math.min.apply(null,cc)+Math.max.apply(null,cc))/2;else{center=cursor+uW/2;cursor+=uW+UNITGAP;}
    var sx=center-uW/2+BOXW/2,y=depth*ROWH;
    mem.forEach(function(z,i){nodes.push({id:z,x:sx+i*(BOXW+COUPLEGAP),y:y,root:z==="seed_kevin"});});
    for(var i=0;i<mem.length-1;i++)links.push({couple:1,x1:sx+i*(BOXW+COUPLEGAP),y1:y,x2:sx+(i+1)*(BOXW+COUPLEGAP),y2:y});
    cc.forEach(function(x2){links.push({x1:center,y1:y+36,x2:x2,y2:(depth+1)*ROWH-36});});
    return center;
  }
  var roots=ids.filter(function(x){var pp=P(x);return !(pp.pere&&set[pp.pere])&&!(pp.mere&&set[pp.mere]);});
  roots.sort(function(a,b){return childrenOf(b).length-childrenOf(a).length;});
  roots.forEach(function(x){if(!placed[x])unit(x,0);});
  ids.forEach(function(x){if(!placed[x])unit(x,0);});
  var minx=1e9,maxx=-1e9;nodes.forEach(function(n){if(n.x<minx)minx=n.x;if(n.x>maxx)maxx=n.x;});
  return {nodes:nodes,links:links,minx:minx,w:(maxx-minx)+BOXW,h:(depthMax+1)*ROWH};
}
/* Composant familial connecté qui contient Ronan (à défaut Kevin, à défaut le plus grand). */
function mainFamilyIds(){
  var persons=DB.persons,par={};
  function find(a){while(par[a]!==a){par[a]=par[par[a]];a=par[a];}return a;}
  function uni(a,b){if(!a||!b||!P(a)||!P(b))return;var ra=find(a),rb=find(b);if(ra!==rb)par[ra]=rb;}
  for(var id in persons)par[id]=id;
  for(var id in persons){var p=persons[id];if(p.pere&&P(p.pere))uni(id,p.pere);if(p.mere&&P(p.mere))uni(id,p.mere);(p.conjoints||[]).forEach(function(c){uni(id,c);});}
  var comps={};for(var k in persons){var r=find(k);(comps[r]=comps[r]||[]).push(k);}
  var seed=P("seed_ronan")?"seed_ronan":(P("seed_kevin")?"seed_kevin":null);
  if(seed){var rr=find(seed);if(comps[rr]&&comps[rr].length>1)return comps[rr];}
  var best=null;Object.keys(comps).forEach(function(c){if(comps[c].length>1&&(!best||comps[c].length>best.length))best=comps[c];});
  return best||Object.keys(persons);
}
/* Vue ARBRE : la famille de Ronan en descendance propre (enfants sous les parents). */
function layoutMainFamily(){

  var t=tidyTree(ids);if(!t.nodes.length)return null;
  var PAD=TREE.PAD,BOXW=TREE.BOXW,totalW=t.w+PAD*2,offx=PAD - t.minx + BOXW/2;
  var nodes=t.nodes.map(function(n){return {id:n.id,x:n.x+offx,y:n.y+PAD,root:n.root};});
  var links=t.links.map(function(l){return l.couple?{couple:1,x1:l.x1+offx,y1:l.y1+PAD,x2:l.x2+offx,y2:l.y2+PAD}:{x1:l.x1+offx,y1:l.y1+PAD,x2:l.x2+offx,y2:l.y2+PAD};});
  return {nodes:nodes,links:links,bands:[],w:totalW,h:t.h+PAD*2};
}
function layoutForest(){
  var T=TREE,ROWH=T.ROWH,BOXW=T.BOXW,COUPLEGAP=T.COUPLEGAP,UNITGAP=T.UNITGAP,PAD=T.PAD,COMPGAP=T.COMPGAP;
  var persons=DB.persons;
  /* union-find : regroupe par famille reliée (père/mère/conjoint) */
  var par={};function find(a){while(par[a]!==a){par[a]=par[par[a]];a=par[a];}return a;}
  function uni(a,b){if(!a||!b||!P(a)||!P(b))return;var ra=find(a),rb=find(b);if(ra!==rb)par[ra]=rb;}
  for(var id in persons)par[id]=id;
  for(var id in persons){var p=persons[id];if(p.pere&&P(p.pere))uni(id,p.pere);if(p.mere&&P(p.mere))uni(id,p.mere);(p.conjoints||[]).forEach(function(c){uni(id,c);});}
  var comps={};for(var id in persons){var r=find(id);(comps[r]=comps[r]||[]).push(id);}
  var arr=Object.keys(comps).map(function(r){return comps[r];});
  function hasEdge(ids){var s={};ids.forEach(function(x){s[x]=1;});for(var i=0;i<ids.length;i++){var pp=P(ids[i]);if((pp.pere&&s[pp.pere])||(pp.mere&&s[pp.mere]))return true;}return false;}
  var trees=[],singleIds=[];
  arr.forEach(function(ids){if(hasEdge(ids))trees.push(ids);else ids.forEach(function(x){singleIds.push(x);});});
  trees.sort(function(a,b){var ka=a.indexOf("seed_kevin")>=0?1:0,kb=b.indexOf("seed_kevin")>=0?1:0;if(ka!==kb)return kb-ka;return b.length-a.length;});
  var laid=trees.map(tidyTree),maxW=0;laid.forEach(function(t){if(t.w>maxW)maxW=t.w;});
  singleIds.sort(function(a,b){return full(P(a)).localeCompare(full(P(b)));});
  if(singleIds.length)maxW=Math.max(maxW,BOXW*Math.min(4,singleIds.length));
  var totalW=Math.max(maxW,BOXW*2)+PAD*2;
  var nodes=[],links=[],bands=[],y=PAD;
  laid.forEach(function(t,i){
    var offx=(totalW-t.w)/2 - t.minx + BOXW/2;
    t.nodes.forEach(function(n){nodes.push({id:n.id,x:n.x+offx,y:n.y+y,root:n.root});});
    t.links.forEach(function(l){links.push(l.couple?{couple:1,x1:l.x1+offx,y1:l.y1+y,x2:l.x2+offx,y2:l.y2+y}:{x1:l.x1+offx,y1:l.y1+y,x2:l.x2+offx,y2:l.y2+y});});
    bands.push({y:y-(i===0?18:COMPGAP/2),label:compLabel(trees[i])});
    y+=t.h+COMPGAP;
  });
  if(singleIds.length){
    bands.push({y:y-(nodes.length?COMPGAP/2:18),label:nodes.length?"Autres membres · à relier":"Membres de la famille"});
    var cols=Math.max(1,Math.min(singleIds.length,Math.floor((totalW-PAD*2)/BOXW)));
    var gx0=(totalW-cols*BOXW)/2 + BOXW/2;
    singleIds.forEach(function(x,idx){var r=Math.floor(idx/cols),c=idx%cols;nodes.push({id:x,x:gx0+c*BOXW,y:y+r*ROWH,root:x==="seed_kevin"});});

}

/* Vue ASCENDANCE (comme l'image « Our Family Tree ») : la personne au pied du
   tronc, ses parents au-dessus, puis grands-parents… qui montent dans les branches. */
/* Le « dernier de l'arbre » = le plus jeune descendant de la lignée de Kevin
   (son fils Ronan en priorité) : c'est lui au pied du tronc. */
function ascendanceRoot(){
  if(P("seed_ronan"))return "seed_ronan";
  var start=P("seed_kevin")?"seed_kevin":guessRoot();
  var cur=start,guard=0;
  while(guard++<12){var kids=childrenOf(cur);if(!kids.length)break;kids.sort(function(a,b){return ((yr(P(b).naissance&&P(b).naissance.date))||0)-((yr(P(a).naissance&&P(a).naissance.date))||0);});cur=kids[0];}
  return cur||start;
}
function layoutAscendance(rootId){

  var root=(rootId&&P(rootId))?rootId:ascendanceRoot();
  if(!root)return {nodes:[],links:[],bands:[],w:BOXW*2+PAD*2,h:ROWH+PAD*2};
  var gens=[[{id:root,slot:0}]],depth=1;
  while(depth<6){var next=[],any=false;gens[depth-1].forEach(function(cell){var pp=P(cell.id);var f=pp&&pp.pere&&P(pp.pere)?pp.pere:null,m=pp&&pp.mere&&P(pp.mere)?pp.mere:null;if(f){next.push({id:f,slot:cell.slot*2});any=true;}if(m){next.push({id:m,slot:cell.slot*2+1});any=true;}});if(!any)break;gens.push(next);depth++;}

function importPhoto(file){return new Promise(function(res,rej){
  var MAX=1400;
  function fromBitmap(){return createImageBitmap(file,{imageOrientation:"from-image"}).then(function(bm){return draw(bm,bm.width,bm.height);});}
  function fromImg(){return new Promise(function(rs,rj){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){rs(draw(im,im.naturalWidth,im.naturalHeight));};im.onerror=rj;im.src=r.result;};r.onerror=rj;r.readAsDataURL(file);});}
  function draw(src,w,h){var s=Math.min(1,MAX/Math.max(w,h));var cw=Math.round(w*s),chh=Math.round(h*s);var cv=document.createElement("canvas");cv.width=cw;cv.height=chh;var ctx=cv.getContext("2d");ctx.fillStyle="#0c1220";ctx.fillRect(0,0,cw,chh);ctx.drawImage(src,0,0,cw,chh);return cv.toDataURL("image/jpeg",0.82);}
  (("createImageBitmap"in window)?fromBitmap().catch(fromImg):fromImg()).then(res).catch(function(){fromImg().then(res).catch(rej);});
});}

  Object.keys(by).forEach(function(k){var ids=by[k];if(ids.length<2)return;ids.sort(function(a,b){return score(P(b))-score(P(a));});var keep=ids[0];for(var i=1;i<ids.length;i++){var d=P(ids[i]);if((d.photos&&d.photos.length)||(d.comments&&d.comments.length))continue;map[ids[i]]=keep;removed.push(ids[i]);}});
  if(!removed.length)return removed;
  for(var id2 in persons){var p=persons[id2];if(map[p.pere])p.pere=map[p.pere];if(map[p.mere])p.mere=map[p.mere];if(p.conjoints)p.conjoints=p.conjoints.map(function(c){return map[c]||c;}).filter(function(c,i,a){return c&&c!==id2&&a.indexOf(c)===i;});}
  removed.forEach(function(dupId){delete persons[dupId];});
  return removed;
}

var _updTs=0;
async function checkUpdate(){
  if(Date.now()-_updTs<25000)return;_updTs=Date.now();
  if(document.querySelector(".ov"))return; /* ne coupe pas une saisie en cours */
  try{
    var r=await fetch("index.html?_v="+Date.now(),{cache:"reload"});if(!r.ok)return;
    var t=await r.text();var m=t.match(/APP_VER\s*=\s*"([^"]+)"/);
    function verNum(s){var g=String(s).match(/(\d+)\.(\d+)/);return g?(+g[1]*1000+ +g[2]):0;}
    /* On ne recharge QUE vers une version strictement plus récente → jamais de boucle
       si le CDN sert temporairement une ancienne version sur un de ses points. */
    if(m&&m[1]&&verNum(m[1])>verNum(APP_VER)){
      var last=+(localStorage.getItem("arbre_upd_ts")||0);
      if(Date.now()-last<90000)return; /* + garde temporelle : 1 rechargement max / 90 s */
      localStorage.setItem("arbre_upd_ts",String(Date.now()));

      location.replace(location.pathname+"?_upd="+Date.now());
    }
  }catch(e){}
}
