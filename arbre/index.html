<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#e7d9ba">
<title>Arbre généalogique — Famille</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://*.firebasedatabase.app https://identitytoolkit.googleapis.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'; manifest-src 'self'">
<style>
:root{
  --bg:#e7d9ba; --ink:#3a2c16; --mut:#8a7550; --line:#cbb488;
  --glass:rgba(249,242,225,.85); --glass2:rgba(243,233,208,.92);
  --gold:#b0842c; --gold2:#e2bd5c; --cyan:#3c8a80; --violet:#7a6ad6; --pink:#c96f9e; --ok:#3f9d6a; --danger:#c8506a;
  --male:#3f6bb0; --female:#c96f9e;
  --r:18px; --sh:0 10px 30px rgba(92,70,28,.22);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;overflow-x:hidden}
/* animated aurora background */
#aura{position:fixed;inset:-20% -20% -20% -20%;z-index:-2;filter:blur(70px);opacity:.28;pointer-events:none}
#aura b{position:absolute;border-radius:50%;mix-blend-mode:screen;animation:float 18s ease-in-out infinite}
#aura b:nth-child(1){width:46vmax;height:46vmax;left:-8%;top:-10%;background:radial-gradient(circle,#caa24e,transparent 60%);animation-delay:-2s}
#aura b:nth-child(2){width:40vmax;height:40vmax;right:-6%;top:10%;background:radial-gradient(circle,#7fae63,transparent 60%);animation-delay:-6s}
#aura b:nth-child(3){width:44vmax;height:44vmax;left:20%;bottom:-16%;background:radial-gradient(circle,#d8c07a,transparent 60%);animation-delay:-10s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(4%,3%) scale(1.08)}66%{transform:translate(-3%,4%) scale(.96)}}
@media (prefers-reduced-motion:reduce){#aura b{animation:none}}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 80% at 50% -10%,rgba(200,168,104,.28),transparent 60%),linear-gradient(180deg,#efe3c6,#e0cfa6)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--ink);background:rgba(255,252,244,.85);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold)}
.btn{display:inline-flex;align-items:center;gap:7px;justify-content:center;min-height:44px;padding:10px 15px;border-radius:13px;background:var(--glass2);border:1px solid var(--line);font-weight:600;backdrop-filter:blur(10px);transition:transform .12s,border-color .2s}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#241905;border:0;box-shadow:0 6px 20px rgba(240,200,116,.35)}
.btn.ghost{background:rgba(255,255,255,.04)}
.btn.sm{min-height:44px;padding:9px 12px;font-size:13px;border-radius:11px}
.btn.dng{color:var(--danger);border-color:#5a2733}
.hidden{display:none!important}.mut{color:var(--mut)}.gold{color:var(--gold)}
/* topbar */
#top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:linear-gradient(180deg,rgba(239,227,198,.96),rgba(239,227,198,.55));backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
#top .logo{font-size:22px;filter:drop-shadow(0 2px 6px rgba(240,200,116,.5))}
#top h1{font-size:19px;margin:0;font-weight:700;font-family:Georgia,"Times New Roman",serif;font-style:italic;letter-spacing:.2px;flex:1;background:linear-gradient(90deg,var(--gold2),#7fc98a);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#syncPill{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:5px 9px;background:rgba(255,252,244,.7)}
#syncPill i{width:9px;height:9px;border-radius:50%;background:#6b7686;transition:background .3s}
#syncPill.on i{background:var(--ok);box-shadow:0 0 10px var(--ok)}#syncPill.off i{background:#f0b45f}
#syncPill.sav i{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
#tabs{display:flex;gap:7px;padding:10px 12px 4px;overflow-x:auto;scrollbar-width:none}#tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;min-height:44px;display:inline-flex;align-items:center;padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-weight:600;color:var(--mut);transition:.2s}
.tab.act{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#241905;border-color:transparent;box-shadow:0 6px 18px rgba(240,200,116,.3)}
#wrap{padding:8px 12px 24px;max-width:900px;margin:0 auto}
.sec{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:11px 0;backdrop-filter:blur(12px);box-shadow:var(--sh)}
.sec h3{margin:0 0 11px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--gold)}
.grid{display:grid;gap:10px}.chips{display:flex;flex-wrap:wrap;gap:8px}
.row2{display:flex;gap:9px}.row2>*{flex:1}
label.fl{display:block;font-size:12px;color:var(--mut);margin:11px 0 5px}
.empty{text-align:center;color:var(--mut);padding:44px 12px}
/* person card */
.pc{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;backdrop-filter:blur(10px);transition:transform .12s,border-color .2s}
.pc:active{transform:scale(.99);border-color:var(--gold)}
.av{width:52px;height:52px;border-radius:50%;flex:none;background:radial-gradient(circle at 36% 30%,#fffbef,#e7d4a6);color:#7a5427;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:700;font-family:Georgia,"Times New Roman",serif;overflow:hidden;position:relative;box-shadow:inset 0 0 0 1px rgba(120,84,36,.3)}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.av.M{box-shadow:0 0 0 2px rgba(63,107,176,.55),inset 0 0 0 1px rgba(120,84,36,.25)}
.av.F{box-shadow:0 0 0 2px rgba(201,111,158,.55),inset 0 0 0 1px rgba(120,84,36,.25)}
.pc .nm{font-weight:700}.pc .sub{font-size:12.5px;color:var(--mut);margin-top:2px}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:999px;background:#22304a;color:var(--mut);margin-left:6px;vertical-align:middle}
.badge.alive{background:rgba(99,230,163,.16);color:var(--ok)}
/* ---- graphical tree stage ---- */
#treeCtl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 4px}
#treeCtl .seg{display:flex;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;overflow:hidden}
#treeCtl .seg button{padding:9px 13px;font-size:13px;font-weight:600;color:var(--mut)}
#treeCtl .seg button.on{background:linear-gradient(135deg,var(--cyan),#39b9ff);color:#04222a}
#stageWrap{position:relative;height:74vh;min-height:480px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:radial-gradient(130% 80% at 50% 102%,rgba(120,150,86,.22),transparent),radial-gradient(100% 60% at 50% -4%,rgba(206,168,98,.22),transparent),linear-gradient(180deg,#efe4c8,#e3d1a8);touch-action:none;box-shadow:var(--sh)}
#treeBg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;transition:opacity .5s}
#treeArt{position:absolute;inset:0;opacity:.8;transition:opacity .6s}#treeArt svg{width:100%;height:100%;display:block}
#treePhoto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 40%;opacity:0;transition:opacity .6s}
#treePhoto.on{opacity:1}#treePhoto.on ~ #treeScrim{opacity:1}
#treeScrim{position:absolute;inset:0;opacity:0;background:linear-gradient(180deg,rgba(16,24,8,.10),rgba(16,24,8,0) 24%,rgba(14,18,6,.12))}
#stageWrap.plan #treeBg{opacity:0}
#stage{position:absolute;left:0;top:0;z-index:1;transform-origin:0 0;will-change:transform}
#stage svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.tnode{position:absolute;transform:translate(-50%,-50%);width:186px;padding:12px 13px;border-radius:16px;background:linear-gradient(180deg,#fffef8,#f6ecd3);border:1px solid #cbb684;display:flex;gap:11px;align-items:center;box-shadow:0 6px 16px rgba(74,54,22,.4),inset 0 1px 0 rgba(255,255,255,.7);cursor:pointer;transition:transform .12s,border-color .2s,box-shadow .2s}
.tnode:active{transform:translate(-50%,-50%) scale(.97)}
.tnode.root{border-color:var(--gold);box-shadow:0 0 0 1.5px var(--gold),0 12px 34px rgba(240,200,116,.3)}
.tnode.sM{border-top:2px solid rgba(93,159,214,.6)}
.tnode.sF{border-top:2px solid rgba(255,158,199,.6)}
.tnode .av{width:44px;height:44px;border-radius:50%;font-size:18px;font-family:Georgia,"Times New Roman",serif;color:#7a5427;background:radial-gradient(circle at 36% 30%,#fffbef,#e7d4a6)!important;box-shadow:inset 0 0 0 1px rgba(120,84,36,.3)}
.tnode.sM .av{box-shadow:0 0 0 2px rgba(63,107,176,.55),inset 0 0 0 1px rgba(120,84,36,.25)}
.tnode.sF .av{box-shadow:0 0 0 2px rgba(201,111,158,.55),inset 0 0 0 1px rgba(120,84,36,.25)}
.tnode.root .av{box-shadow:0 0 0 2px var(--gold),0 2px 8px rgba(176,132,44,.4)}
.tnf{font-weight:800;font-size:12.5px;letter-spacing:.4px;line-height:1.15}
.tnode .tn{font-weight:700;font-size:14px;line-height:1.16;overflow:hidden;text-overflow:ellipsis;color:#2c2010;font-family:Georgia,"Times New Roman",serif}
.tnode .ty{font-size:11.5px;color:#856a3a;margin-top:1px}
.av.M,.av.F{background:radial-gradient(circle at 36% 30%,#fffbef,#e7d4a6)}
.bandlab{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:#f3e6c2;background:rgba(74,54,26,.9);padding:5px 14px;border:1px solid var(--line);border-radius:999px;backdrop-filter:blur(8px);white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.couplebadge{position:absolute;transform:translate(-50%,-50%);font-size:15px;background:rgba(255,248,230,.96);border:1px solid var(--gold);border-radius:999px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(240,200,116,.35)}
.treemode{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:6;display:flex;gap:4px;background:rgba(74,54,26,.9);border:1px solid var(--gold);border-radius:999px;padding:3px;backdrop-filter:blur(8px);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.treemode button{font-size:12px;font-weight:700;color:#f3e6c2;padding:7px 12px;border-radius:999px;white-space:nowrap}
.treemode button.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#3a2708}
.fampick{top:56px}
.famchips{display:flex;gap:7px;margin:2px 0 10px;overflow-x:auto;padding-bottom:2px}
.famchip{min-height:44px;padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.5);border:1.5px solid var(--line);font-weight:700;font-size:13px;color:var(--mut);white-space:nowrap}
.famchip.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#3a2708;border-color:transparent}
.okb{color:#2c7a3f;font-weight:700}
#printArea{display:none}
@media print{
  body.printing #app,body.printing #gate,body.printing .ov,body.printing #toast{display:none!important}
  body.printing #printArea{display:block!important;background:#fff}
  #printArea .pr-title{font-family:Georgia,serif;font-size:20px;font-weight:700;color:#5a3d18;margin:0 0 10px}
  #printArea .pr-stage{position:relative;overflow:hidden;margin:0 auto}
  #printArea .tnode{box-shadow:none;border-color:#8a6420}
  #printArea .pr-foot{font-size:11px;color:#8a7a55;margin-top:8px;text-align:center}
  @page{size:A4 landscape;margin:10mm}
}
.tmed{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:7px;width:158px;cursor:pointer}
.tmed .tma{border-radius:999px;display:inline-flex}
.tmed .tma img,.tmed .tma div{border-radius:999px}
.tmn{display:inline-flex;flex-direction:column;align-items:center;gap:1px;background:rgba(52,36,12,.82);color:#f7ecce;font-weight:700;font-size:12.5px;line-height:1.25;padding:5px 12px;border-radius:11px;text-align:center;max-width:158px;box-shadow:0 3px 9px rgba(20,12,2,.35);backdrop-filter:blur(3px)}
.tmn small{font-weight:600;font-size:10.5px;color:#d9c48f}
.tmed.root .tmn{background:linear-gradient(135deg,#b0842c,#8a6420);color:#fff8e6}
.relkev{color:var(--gold);font-weight:700;font-size:13.5px;margin-top:2px}
.tnode.blood{border-color:#c9992f;box-shadow:0 6px 16px rgba(74,54,22,.4),0 0 0 2.5px rgba(201,153,47,.55),inset 0 1px 0 rgba(255,255,255,.7)}
.brchips{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
.brchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--mut);background:rgba(255,255,255,.5);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.brchip i{width:12px;height:12px;border-radius:3px;display:inline-block}
.legrow{display:flex;gap:12px;align-items:flex-start;margin:11px 0;font-size:14.5px;line-height:1.45}
.legico{font-size:20px;flex:0 0 28px;text-align:center}
.genlab.soft{color:rgba(243,230,194,.5);text-shadow:0 1px 6px rgba(0,0,0,.5)}
.genlab{position:absolute;left:10px;font-size:30px;font-weight:800;color:rgba(122,84,39,.55);letter-spacing:.4px;pointer-events:none}

.addrel{display:flex;gap:8px;flex-wrap:wrap}.addrel .btn{flex:1;min-width:calc(50% - 4px)}
.tnode .rt{position:absolute;top:-8px;left:9px;font-size:9px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#04222a;background:var(--cyan);padding:1px 6px;border-radius:999px}
.zoomBtns{position:absolute;right:12px;bottom:12px;z-index:5;display:flex;flex-direction:column;gap:8px}
.zoomBtns button{width:44px;height:44px;border-radius:13px;background:var(--glass2);border:1px solid var(--line);font-size:20px;font-weight:800;backdrop-filter:blur(10px);box-shadow:var(--sh)}
.hintpan{position:absolute;left:12px;bottom:12px;right:74px;z-index:4;pointer-events:none;font-size:11px;color:var(--mut);background:rgba(255,250,238,.8);border:1px solid var(--line);padding:5px 9px;border-radius:10px}
/* modal */
.ov{position:fixed;inset:0;z-index:60;background:rgba(4,7,12,.72);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{position:relative;background:linear-gradient(180deg,#f8f1dd,#efe3c6);width:100%;max-width:680px;max-height:93vh;overflow:auto;border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:0;padding:16px 16px calc(env(safe-area-inset-bottom) + 26px);animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:translateY(0);opacity:1}}
.grab{width:46px;height:5px;border-radius:3px;background:#33405a;margin:2px auto 12px}
.sheet h2{margin:2px 0}
.caro{position:relative;border-radius:18px;overflow:hidden;background:#ddcaa0;border:1px solid var(--line);aspect-ratio:4/3;margin:12px 0}
.caro .slide{position:absolute;inset:0;opacity:0;transition:opacity .6s}
.caro .slide.on{opacity:1}.caro img{width:100%;height:100%;object-fit:cover}
.caro .dots{position:absolute;left:0;right:0;bottom:9px;display:flex;gap:6px;justify-content:center;z-index:2}
.caro .dots i{width:7px;height:7px;border-radius:50%;background:#ffffff66}.caro .dots i.on{background:#fff;width:18px;border-radius:4px}
.caro .nav{position:absolute;top:0;bottom:0;width:38%;z-index:2}.caro .nav.l{left:0}.caro .nav.r{right:0}
.caro .ph-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);font-size:13px;padding:20px}
.thumbs{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.thumbs .t{width:50px;height:50px;border-radius:11px;overflow:hidden;border:1px solid var(--line);position:relative}
.thumbs .t img{width:100%;height:100%;object-fit:cover}
.thumbs .t b{position:absolute;top:-3px;right:2px;color:var(--danger);font-weight:900;font-size:15px;text-shadow:0 1px 3px #000}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}.kv .k{color:var(--mut);font-size:13px}
.linkbtn{color:var(--cyan);text-decoration:none;font-weight:600}
a{color:var(--cyan);text-decoration:none}
.srcbtn{display:inline-flex;align-items:center;gap:6px;background:rgba(91,224,214,.10);border:1px solid rgba(91,224,214,.35);color:var(--cyan);border-radius:11px;padding:9px 12px;font-size:13px;font-weight:600}
.relchip{display:inline-flex;align-items:center;gap:8px;background:var(--glass2);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 6px;font-weight:600;color:var(--ink)}
.relchip .av{width:30px;height:30px;border-radius:9px;font-size:13px}
.relchip small{color:var(--mut);font-weight:500;margin-left:2px}
.irow{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.irow:last-child{border:0}.irow .ic{font-size:18px;width:24px;text-align:center;flex:none}
.irow .lab{color:var(--mut);font-size:12px}.irow .val{font-weight:600}
.bkbtn{position:absolute;left:14px;top:14px;width:44px;height:44px;border-radius:12px;background:linear-gradient(180deg,#fffdf4,#f0e2c2);color:#7a5427;border:1px solid var(--gold);font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;z-index:5;box-shadow:0 3px 10px rgba(74,54,22,.25)}
.bkbtn:active{transform:scale(.94)}
.cmt{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:13px;padding:10px 11px;margin:8px 0}
.cmt .h{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin-bottom:3px}
.cmt .x{color:var(--danger);font-weight:800}
/* fab */
#fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:50;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#241905;font-size:32px;font-weight:800;box-shadow:0 10px 30px rgba(240,200,116,.5);display:flex;align-items:center;justify-content:center;transition:transform .15s}
#fab:active{transform:scale(.92) rotate(90deg)}
#ver{position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom) + 8px);z-index:50;font-size:10px;color:#8a7550;background:rgba(255,250,238,.8);padding:3px 8px;border-radius:8px;border:1px solid var(--line)}
/* gate */
#gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}
#gate .box{max-width:390px;width:100%;text-align:center;background:var(--glass);border:1px solid var(--line);border-radius:26px;padding:30px 24px;backdrop-filter:blur(16px);box-shadow:var(--sh)}
#gate .logo{font-size:60px;filter:drop-shadow(0 6px 20px rgba(240,200,116,.5));animation:bob 4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#gate h2{margin:10px 0 4px;background:linear-gradient(90deg,var(--gold2),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 90px);z-index:120;background:#3a2c16;color:#f7efd9;border:1px solid var(--line);padding:11px 17px;border-radius:13px;box-shadow:var(--sh);max-width:88%;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none;backdrop-filter:blur(10px)}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="aura"><b></b><b></b><b></b></div>

<div id="gate">
  <div class="box">
    <div class="logo">🌳</div>
    <h2>Arbre familial</h2>

    <input id="gateCode" type="password" inputmode="text" autocomplete="off" placeholder="Code famille" style="text-align:center;letter-spacing:3px;font-size:17px">

var TREE={ROWH:158,BOXW:198,COUPLEGAP:24,UNITGAP:64,PAD:34,COMPGAP:64,CARD:184};

/* Agencement « propre » d'une famille : les PARENTS en haut, chaque enfant
   DIRECTEMENT EN DESSOUS de ses parents (couple centré au-dessus de ses enfants).
   Les plus jeunes descendent tout en bas (ex : Ronan au pied du tronc). */
function tidyTree(ids){
  var T=TREE,ROWH=T.ROWH,BOXW=T.BOXW,COUPLEGAP=T.COUPLEGAP,UNITGAP=T.UNITGAP;
  var set={};ids.forEach(function(x){set[x]=1;});
  var placed={},nodes=[],links=[],rowCur={},depthMax=0;
  function members(x){var pp=P(x);var m=[x];(pp.conjoints||[]).forEach(function(c){if(set[c]&&!placed[c]&&c!==x&&m.indexOf(c)<0)m.push(c);});return m;}
  function unit(x,depth){
    if(placed[x])return null;
    var mem=members(x);mem.forEach(function(z){placed[z]=1;});if(depth>depthMax)depthMax=depth;
    var kidset={};mem.forEach(function(z){childrenOf(z).forEach(function(k){if(set[k]&&!placed[k])kidset[k]=1;});});
    var kids=Object.keys(kidset).sort(function(a,b){return ((yr(P(a).naissance&&P(a).naissance.date))||9999)-((yr(P(b).naissance&&P(b).naissance.date))||9999);});
    var cc=[];kids.forEach(function(k){var c=unit(k,depth+1);if(c!=null)cc.push({x:c,id:k});});
    var uW=mem.length*BOXW+(mem.length-1)*COUPLEGAP;
    /* curseur PAR RANGÉE : deux unités d'une même ligne ne peuvent JAMAIS se
       chevaucher (bug vu par Kevin : couples Gérard/Marie-Brigitte superposés),
       tout en gardant chaque couple centré au-dessus de ses enfants quand possible. */
    var minC=(rowCur[depth]!==undefined?rowCur[depth]:0)+uW/2,center;
    if(cc.length){var xs=cc.map(function(o){return o.x;});center=(Math.min.apply(null,xs)+Math.max.apply(null,xs))/2;if(center<minC)center=minC;}
    else center=minC;
    rowCur[depth]=center+uW/2+UNITGAP;
    var sx=center-uW/2+BOXW/2,y=depth*ROWH;
    mem.forEach(function(z,i){nodes.push({id:z,x:sx+i*(BOXW+COUPLEGAP),y:y,root:z===viewerId()});});
    for(var i=0;i<mem.length-1;i++)links.push({couple:1,x1:sx+i*(BOXW+COUPLEGAP),y1:y,x2:sx+(i+1)*(BOXW+COUPLEGAP),y2:y});
    cc.forEach(function(o){links.push({x1:center,y1:y+36,x2:o.x,y2:(depth+1)*ROWH-36,child:o.id});});
    return center;
  }
  var roots=ids.filter(function(x){var pp=P(x);return !(pp.pere&&set[pp.pere])&&!(pp.mere&&set[pp.mere]);});
  /* L'aïeul avec la lignée la plus PROFONDE d'abord (Jean-Baptiste avant Victor) :
     sinon un conjoint-racine « capture » son épouse en Gén. 1 et coupe la chaîne
     des ancêtres (bug vu par Kevin : plan Maiffret fragmenté, Victor au sommet). */
  var _sd={};function subDepth(x){if(_sd[x]!==undefined)return _sd[x];_sd[x]=0;var d=0;childrenOf(x).forEach(function(k){if(set[k]){var v=1+subDepth(k);if(v>d)d=v;}});_sd[x]=d;return d;}
  roots.sort(function(a,b){var da=subDepth(a),db=subDepth(b);if(da!==db)return db-da;return childrenOf(b).length-childrenOf(a).length;});
  roots.forEach(function(x){if(!placed[x])unit(x,0);});
  ids.forEach(function(x){if(!placed[x])unit(x,0);});
  var minx=1e9,maxx=-1e9;nodes.forEach(function(n){if(n.x<minx)minx=n.x;if(n.x>maxx)maxx=n.x;});
  return {nodes:nodes,links:links,minx:minx,w:(maxx-minx)+BOXW,h:(depthMax+1)*ROWH};
}
/* Membres de la famille FAMKEY, composant relié qui contient l'ancre de la famille. */
/* Vue ARBRE : TOUTE la famille choisie — le tronc relié en premier, puis les
   branches encore « à relier » en sections dessous (personne ne manque). */
function layoutMainFamily(){
  var filter={},n=0;
  for(var id in DB.persons){if(famOf(DB.persons[id]).indexOf(FAMKEY)>=0){filter[id]=1;n++;}}
  if(!n)return null;
  var anchors=[viewerId()].concat(FAMKEY==="c"?["seed_gerard","seed_guy","seed_kevin"]:["seed_marienoel","seed_victor_sauvaigo","seed_kevin"]);
  return layoutForest(filter,anchors);
}
function layoutForest(filter,anchors){
  var T=TREE,ROWH=T.ROWH,BOXW=T.BOXW,COUPLEGAP=T.COUPLEGAP,UNITGAP=T.UNITGAP,PAD=T.PAD,COMPGAP=T.COMPGAP;
  var persons=DB.persons;
  /* union-find : regroupe par famille reliée (père/mère/conjoint).
     filter (optionnel) = ne considérer QUE ces ids (vue par famille) ;
     anchors (optionnel) = le composant qui les contient passe en premier. */
  function inSet(id){return !filter||filter[id];}
  var par={};function find(a){while(par[a]!==a){par[a]=par[par[a]];a=par[a];}return a;}
  function uni(a,b){if(!a||!b||!P(a)||!P(b)||!inSet(a)||!inSet(b))return;var ra=find(a),rb=find(b);if(ra!==rb)par[ra]=rb;}
  for(var id in persons){if(inSet(id))par[id]=id;}
  for(var id in persons){if(!inSet(id))continue;var p=persons[id];if(p.pere&&P(p.pere))uni(id,p.pere);if(p.mere&&P(p.mere))uni(id,p.mere);(p.conjoints||[]).forEach(function(c){uni(id,c);});}
  var comps={};for(var id in persons){if(!inSet(id))continue;var r=find(id);(comps[r]=comps[r]||[]).push(id);}
  var arr=Object.keys(comps).map(function(r){return comps[r];});
  function hasEdge(ids){var s={};ids.forEach(function(x){s[x]=1;});for(var i=0;i<ids.length;i++){var pp=P(ids[i]);if((pp.pere&&s[pp.pere])||(pp.mere&&s[pp.mere]))return true;}return false;}
  var trees=[],singleIds=[];
  arr.forEach(function(ids){if(hasEdge(ids))trees.push(ids);else ids.forEach(function(x){singleIds.push(x);});});
  var anch=anchors&&anchors.length?anchors:["seed_kevin"];
  function hasAnchor(ids){for(var i=0;i<anch.length;i++)if(ids.indexOf(anch[i])>=0)return 1;return 0;}
  trees.sort(function(a,b){var ka=hasAnchor(a),kb=hasAnchor(b);if(ka!==kb)return kb-ka;return b.length-a.length;});
  var laid=trees.map(tidyTree),maxW=0;laid.forEach(function(t){if(t.w>maxW)maxW=t.w;});
  singleIds.sort(function(a,b){return full(P(a)).localeCompare(full(P(b)));});
  if(singleIds.length)maxW=Math.max(maxW,BOXW*Math.min(4,singleIds.length));
  var totalW=Math.max(maxW,BOXW*2)+PAD*2;
  var nodes=[],links=[],bands=[],y=PAD;
  laid.forEach(function(t,i){
    var offx=(totalW-t.w)/2 - t.minx + BOXW/2;
    t.nodes.forEach(function(n){nodes.push({id:n.id,x:n.x+offx,y:n.y+y,root:n.root});});
    t.links.forEach(function(l){links.push(l.couple?{couple:1,x1:l.x1+offx,y1:l.y1+y,x2:l.x2+offx,y2:l.y2+y}:{x1:l.x1+offx,y1:l.y1+y,x2:l.x2+offx,y2:l.y2+y,child:l.child});});
    bands.push({y:y-(i===0?18:COMPGAP/2),label:compLabel(trees[i])});
    y+=t.h+COMPGAP;
  });
  if(singleIds.length){
    bands.push({y:y-(nodes.length?COMPGAP/2:18),label:nodes.length?"Autres membres · à relier":"Membres de la famille"});
    var cols=Math.max(1,Math.min(singleIds.length,Math.floor((totalW-PAD*2)/BOXW)));
    var gx0=(totalW-cols*BOXW)/2 + BOXW/2;
    singleIds.forEach(function(x,idx){var r=Math.floor(idx/cols),c=idx%cols;nodes.push({id:x,x:gx0+c*BOXW,y:y+r*ROWH,root:x===viewerId()});});
    y+=Math.ceil(singleIds.length/cols)*ROWH;
  }
  return {nodes:nodes,links:links,bands:bands,w:totalW,h:y+PAD};
}

function exportPrint(){
  try{
    var lay=layoutMainFamily();if(!lay||!lay.nodes.length){toast("Rien à imprimer");return;}
    var W=lay.w,H=lay.h;
    var sc=Math.min(1100/W,720/H,1);
    window._LSET=_lineageSet();_RENDERSTYLE="card";
    var svg='<svg width="'+W+'" height="'+H+'" style="position:absolute;left:0;top:0">'+lay.links.map(function(l){
      var gold=l.child&&_LSET[l.child]&&(function(){var c=P(l.child);return c&&((c.pere&&_LSET[c.pere])||(c.mere&&_LSET[c.mere]));})();
      if(l.couple)return '<line x1="'+l.x1+'" y1="'+l.y1+'" x2="'+l.x2+'" y2="'+l.y2+'" stroke="#7a5427" stroke-width="2.6" stroke-linecap="round"/>';
      var my=(l.y1+l.y2)/2;return '<path d="M'+l.x1+' '+l.y1+' V '+my+' H '+l.x2+' V '+l.y2+'" fill="none" stroke="'+(gold?'#b0842c':'#7a5427')+'" stroke-width="'+(gold?3.4:2.3)+'"/>';}).join("")+'</svg>';
    var rowsY={};lay.nodes.forEach(function(n){var k=Math.round(n.y/10)*10;rowsY[k]=Math.min(rowsY[k]||1e9,n.y);});
    var _b2=(lay.bands&&lay.bands.length>1)?lay.bands[1].y:Infinity;
    var gl=Object.keys(rowsY).map(Number).sort(function(a,b){return a-b;}).filter(function(y){return rowsY[y]<_b2;})
      .map(function(y,i){return '<div class="genlab" style="top:'+Math.max(4,rowsY[y]-70)+'px">Gén. '+(i+1)+'</div>';}).join("");
    var nodes=lay.nodes.map(tnodeHTML).join("");
    var box=document.getElementById("printArea");
    if(!box){box=document.createElement("div");box.id="printArea";document.body.appendChild(box);}
    box.innerHTML='<div class="pr-title">'+famLabel(FAMKEY)+' — Arbre familial · '+new Date().toLocaleDateString("fr-FR")+'</div>'
      +'<div class="pr-stage" style="width:'+(W*sc)+'px;height:'+(H*sc)+'px"><div style="position:relative;width:'+W+'px;height:'+H+'px;transform:scale('+sc+');transform-origin:0 0">'+svg+gl+nodes+'</div></div>'
      +'<div class="pr-foot">arbre.kd-mc.com · '+Object.keys(DB.persons).filter(function(x){return famOf(DB.persons[x]).indexOf(FAMKEY)>=0;}).length+' personnes</div>';
    document.body.classList.add("printing");
    var done=function(){document.body.classList.remove("printing");window.removeEventListener("afterprint",done);};
    window.addEventListener("afterprint",done);
    setTimeout(function(){window.print();setTimeout(done,1500);},80);
  }catch(e){toast("Impression impossible : "+e.message);}
}

/* Accès aux ACTES officiels, calculé pour CHAQUE personne selon son cas :
   - état civil français : images librement consultables au-delà de 100 ans
     (archives départementales) ; en deçà, demande en ligne officielle gratuite ;
   - Monaco : base de registres de la mairie (≥1900) ;
   - décès ≥1970 en France : fichier INSEE (lien exact ajouté dans p.sources
     quand l'acte a été identifié, sinon recherche pré-remplie). */
function actLinks(p){
  var out=[];
  var lieu=(p.naissance&&p.naissance.lieu)||"";var bl=lieu.toLowerCase();
  var by=yr(p.naissance&&p.naissance.date)||0;var nowY=new Date().getFullYear();
  var mc=/monaco/.test(bl);
  var d06=/nice|beaulieu|villefranche|cagnes|antibes|cannes|vence/.test(bl);
  var d13=/salon|marseille|aix/.test(bl);
  if(mc)out.push({label:"🍼 Acte de naissance — base Monaco (≥1900)",url:"https://archives.mairie.mc/s/3/base-de-registres-a-partir-de-1900/"});
  else if(by&&nowY-by>=100&&d06)out.push({label:"🍼 Acte de naissance — registres AD06 ("+lieu+" "+by+")",url:"https://archives06.fr"});
  else if(by&&nowY-by>=100&&d13)out.push({label:"🍼 Acte de naissance — registres AD13 ("+lieu+" "+by+")",url:"https://www.archives13.fr/archive/recherche/etatcivil/n:64"});
  else if(by&&bl)out.push({label:"🍼 Demander l'acte de naissance (officiel, gratuit)",url:"https://www.service-public.fr/particuliers/vosdroits/F1427"});
  var dy=yr(p.deces&&p.deces.date)||0;
  var hasActe=(p.sources||[]).some(function(s){return /matchid\.io\/id\//.test(s.url||"");});
  if(dy>=1970&&!hasActe)out.push({label:"📜 Acte de décès — fichier INSEE",url:"https://deces.matchid.io/search?q="+encodeURIComponent(((p.prenom||"")+" "+(p.nom||"")).trim())});
  /* Actes récents = protégés par la loi (seul un proche peut les demander) →
     demande officielle PRÉ-RÉDIGÉE, copiée en 1 clic, à coller dans un email. */
  if(mc)out.push({label:"🏛 Mairie de Monaco (envoyer la demande)",url:"https://mairie.mc"});
  if(p.naissance&&(p.naissance.date||p.naissance.lieu))out.push({copy:"naissance",label:"📋 Copier la demande d'acte de naissance"});
  if(!p.vivant&&p.deces&&(p.deces.date||p.deces.lieu))out.push({copy:"décès",label:"📋 Copier la demande d'acte de décès"});
  return out;
}
/* Lettre de demande d'acte, pré-remplie avec l'identité et la filiation. */
function buildActRequest(p,type){
  var eF=p.sexe==="F"?"e":"";
  var l=type==="naissance"?(p.naissance||{}):(p.deces||{});
  var fil=[];if(p.pere&&P(p.pere))fil.push(full(P(p.pere)));if(p.mere&&P(p.mere))fil.push(full(P(p.mere)));
  return "Objet : Demande de copie intégrale d'acte de "+type+"\n\n"
    +"Madame, Monsieur,\n\n"
    +"Je vous prie de bien vouloir me délivrer une copie intégrale de l'acte de "+type+" de :\n"
    +"• "+full(p)+(p.naissance&&p.naissance.date?", né"+eF+" le "+p.naissance.date:"")+(p.naissance&&p.naissance.lieu?" à "+p.naissance.lieu:"")
    +(type==="décès"&&l.date?", décédé"+eF+" le "+l.date+(l.lieu?" à "+l.lieu:""):"")+"\n"
    +(fil.length?"• Filiation : "+(p.sexe==="F"?"fille":"fils")+" de "+fil.join(" et de ")+"\n":"")
    +"\nJe suis [TON PRÉNOM ET NOM], [lien de parenté : fils / petit-fils / arrière-petit-fils…] de la personne concernée.\n"
    +"Merci de me l'adresser par courriel ou par courrier à :\n[TON ADRESSE]\n[TON EMAIL / TÉLÉPHONE]\n\n"
    +"Cordialement,\n[TON NOM]";
}

/* Lien de parenté par rapport à Kevin (racine de l'arbre) — libellés FR clairs. */
function _upMap(start){var m={},q=[[start,0]];while(q.length){var it=q.shift(),x=it[0],d=it[1],p=P(x);if(!p)continue;[p.pere,p.mere].forEach(function(par){if(par&&P(par)&&m[par]===undefined){m[par]=d+1;q.push([par,d+1]);}});}return m;}
function _lineageSet(){var K=viewerId();var set={};if(!K)return set;set[K]=1;var up=_upMap(K);for(var a in up)set[a]=1;
  var q=[K];while(q.length){var x=q.shift();childrenOf(x).forEach(function(c){if(!set[c]){set[c]=1;q.push(c);}});}
  return set;}
function relationToKevin(id,noAlliance){
  var K=viewerId();if(!K||!P(id))return "";if(id===K)return "⭐ toi";
  var g=P(id).sexe==="F";
  if(((P(id).conjoints)||[]).indexOf(K)>=0)return g?"ta femme":"ton mari";
  var ak=_upMap(K);ak[K]=0;var ap=_upMap(id);ap[id]=0;
  var best=null;
  for(var a in ak){if(ap[a]!==undefined){var m=ak[a],n=ap[a];if(!best||m+n<best[0]+best[1]||(m+n===best[0]+best[1]&&Math.min(m,n)<Math.min(best[0],best[1])))best=[m,n];}}
  function anc(m){if(m===1)return g?"ta mère":"ton père";var pre="arrière-".repeat(Math.max(0,m-2));return (g?"ta ":"ton ")+pre+"grand-"+(g?"mère":"père");}
  function desc(n){if(n===1)return g?"ta fille":"ton fils";var pre="arrière-".repeat(Math.max(0,n-2));return (g?"ta ":"ton ")+pre+"petit"+(g?"e-fille":"-fils");}
  if(best){var m=best[0],n=best[1];
    if(n===0)return anc(m);
    if(m===0)return desc(n);
    if(m===1&&n===1)return g?"ta sœur":"ton frère";
    if(n===1){if(m===2)return g?"ta tante":"ton oncle";var pre="arrière-".repeat(Math.max(0,m-3));return (g?"ta ":"ton ")+pre+"grand-"+(g?"tante":"oncle");}
    if(m===1){if(n===2)return g?"ta nièce":"ton neveu";return g?"ta petite-nièce":"ton petit-neveu";}
    if(m===2&&n===2)return g?"ta cousine germaine":"ton cousin germain";
    return g?"ta cousine":"ton cousin";}
  if(!noAlliance){var cs=(P(id).conjoints||[]).filter(function(c){return P(c);});
    for(var i=0;i<cs.length;i++){var r=relationToKevin(cs[i],true);if(r)return (g?"femme de ":"mari de ")+r.replace("⭐ toi","toi");}}
  return "";}

  function draw(src,w,h){var s=Math.min(1,MAX/Math.max(w,h));var cw=Math.round(w*s),chh=Math.round(h*s);var cv=document.createElement("canvas");cv.width=cw;cv.height=chh;var ctx=cv.getContext("2d");ctx.fillStyle="#0c1220";ctx.fillRect(0,0,cw,chh);ctx.drawImage(src,0,0,cw,chh);return cv.toDataURL("image/jpeg",0.82);}
  (("createImageBitmap"in window)?fromBitmap().catch(fromImg):fromImg()).then(res).catch(function(){fromImg().then(res).catch(rej);});
});}

  add({id:"seed_francois_mc",prenom:"François Joseph Philippe",nom:"MAIFFRET",sexe:"M",pere:"seed_emmanuel_mc",mere:"seed_josephine_ciais",conjoints:["seed_madeleine_mathieu"],naissance:{date:"9.12.1912",lieu:"Monaco"},deces:{date:"6.11.2004",lieu:"Nice"},notes:"✅ ACTE DE NAISSANCE LU (n°71/1912, Mairie de Monte-Carlo — image dans le dépôt) : né le 9.12.1912 à 16h30, Maison Verani, rue des Orchidées, Monte-Carlo. Père : Emmanuel MAIFFRET, peintre, 27 ans, natif de Monaco. Mère : Joséphine Angèle CIAIS, couturière, 26 ans, son épouse. Témoin : un employé du Casino. Mentions marginales : marié à Monaco le 25.04.1957 avec Madeleine Marie Clémence MATHIEU ; décédé à Nice le 6.11.2004 (= INSEE ✓). Prénommé François (comme son oncle François-Louis, † 6 semaines avant sa naissance) et Philippe (comme son grand-père, † 1905). ⚠️ Sa branche (grand-père Philippe, arrière-grand-père Jérôme, familles de Nice/Monaco) est DISTINCTE de la lignée de Marie-Thérèse (Jean-Baptiste 1815, Beaulieu) — un lien plus ancien entre les deux familles MAIFFRET de Nice reste possible mais non prouvé.",sources:[{label:"🍼 Acte de naissance n°71/1912 — base Monaco (image scannée)",url:"https://archives.mairie.mc/r/5/base-de-registres-a-partir-de-1900/"},{label:"📜 Acte de décès officiel (INSEE)",url:"https://deces.matchid.io/id/lmAX_0gFBqZe"},SRC.matchid,SRC.monaco1900]});

function mergeSeed(){var s=buildSeed();for(var id in s){var loc=DB.persons[id];if(!loc){DB.persons[id]=s[id];}else if(id.indexOf("seed_")===0){var ph=(loc.photos&&loc.photos.length)?loc.photos:s[id].photos;var cm=(loc.comments&&loc.comments.length)?loc.comments:s[id].comments;DB.persons[id]=Object.assign({},s[id],{photos:ph,comments:cm});}}DB.meta=DB.meta||{};DB.meta.seedVersion=SEED_VERSION;}

function bindApp(){document.querySelectorAll("#tabs .tab").forEach(function(t){t.onclick=function(){VIEW=t.dataset.view;render();};});$("#fab").onclick=function(){openEdit(null);};document.body.addEventListener("click",function(e){if(e.target.closest(".ov"))return;var n=e.target.closest("#wrap [data-open]");if(n){openPerson(n.dataset.open);return;}var s=e.target.closest("#wrap [data-search]");if(s)openSearch(s.dataset.search);});document.addEventListener("visibilitychange",function(){if(!document.hidden&&sessionStorage.getItem("arbre_unlocked"))cloudPull(true);});window.addEventListener("focus",function(){if(sessionStorage.getItem("arbre_unlocked"))cloudPull(true);});setInterval(function(){if(sessionStorage.getItem("arbre_unlocked"))cloudPull(true);},8000);}
/* Nettoyage doublons : même prénom+nom+dates → on garde la fiche la plus riche,
   on re-pointe les liens vers elle, on supprime les copies VIDES (sans photo ni
   commentaire) pour ne rien perdre. */
function dedupePersons(){
  var persons=DB.persons,by={};
  function key(p){return ((p.prenom||"")+"|"+(p.nom||"")+"|"+((p.naissance&&p.naissance.date)||"")+"|"+((p.deces&&p.deces.date)||"")).toLowerCase().replace(/\s+/g," ").trim();}
  function score(p){return (p.photos&&p.photos.length?p.photos.length*10:0)+(p.comments&&p.comments.length?p.comments.length*6:0)+(p.pere?1:0)+(p.mere?1:0)+((p.conjoints||[]).length)+childrenOf(p.id).length+(String(p.id).indexOf("seed_")===0?3:0)+(p.notes?1:0);}
  for(var id in persons){var k=key(persons[id]);if(!k||k.replace(/\|/g,"").trim()==="")continue;(by[k]=by[k]||[]).push(id);}
  var map={},removed=[];
  Object.keys(by).forEach(function(k){var ids=by[k];if(ids.length<2)return;ids.sort(function(a,b){return score(P(b))-score(P(a));});var keep=ids[0];for(var i=1;i<ids.length;i++){var d=P(ids[i]);if((d.photos&&d.photos.length)||(d.comments&&d.comments.length))continue;map[ids[i]]=keep;removed.push(ids[i]);}});
  if(!removed.length)return removed;
  for(var id2 in persons){var p=persons[id2];if(map[p.pere])p.pere=map[p.pere];if(map[p.mere])p.mere=map[p.mere];if(p.conjoints)p.conjoints=p.conjoints.map(function(c){return map[c]||c;}).filter(function(c,i,a){return c&&c!==id2&&a.indexOf(c)===i;});}
  removed.forEach(function(dupId){delete persons[dupId];});
  return removed;
}

function purgeLegacy(){var rm=[];for(var id in DB.persons){var p=DB.persons[id];if(String(id).indexOf("seed_")===0)continue;if((p.photos&&p.photos.length)||(p.comments&&p.comments.length))continue;for(var i=0;i<LEGACY_OBSOLETE.length;i++){var o=LEGACY_OBSOLETE[i];if((p.prenom||"")===o.prenom&&(p.nom||"")===o.nom&&((p.naissance&&p.naissance.date)||"")===o.nd){rm.push(id);break;}}}
  rm.forEach(function(id){delete DB.persons[id];});return rm;}
/* Fantômes du cloud : anciennes copies (id aléatoire, versions précédentes de
   l'app) d'une personne du seed — même prénom+nom mais liens périmés (ex :
   Yann/Loïc rattachés à Christian & Marie-Brigitte alors que le document dit
   fils d'Émile). On supprime la copie VIDE (jamais si elle porte photos ou
   commentaires) et on re-pointe TOUS les liens (père/mère/conjoints) vers la
   fiche seed officielle. Prénom ambigu (2 seeds homonymes, ex : Jean MAIFFRET
   1852 et 1888) → jamais touché. Tourne au boot ET à chaque cloudPull. */
function purgeSeedShadows(){
  function nrm(p){return ((p.prenom||"")+" "+(p.nom||"")).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();}
  var seedBy={},amb={};
  for(var id in DB.persons){if(String(id).indexOf("seed_")!==0)continue;var k=nrm(DB.persons[id]);if(!k)continue;if(seedBy[k]&&seedBy[k]!==id)amb[k]=true;else seedBy[k]=id;}
  var map={},rm=[];
  for(var id2 in DB.persons){var p=DB.persons[id2];if(String(id2).indexOf("seed_")===0)continue;if((p.photos&&p.photos.length)||(p.comments&&p.comments.length))continue;var k2=nrm(p);if(!k2||amb[k2]||!seedBy[k2])continue;map[id2]=seedBy[k2];rm.push(id2);}
  if(!rm.length)return rm;
  for(var id3 in DB.persons){var q=DB.persons[id3],ch=false;
    if(map[q.pere]){q.pere=map[q.pere];ch=true;}
    if(map[q.mere]){q.mere=map[q.mere];ch=true;}
    if(q.conjoints&&q.conjoints.length){var nc=q.conjoints.map(function(c){return map[c]||c;}).filter(function(c,i,a){return c&&c!==id3&&a.indexOf(c)===i;});if(nc.join(",")!==(q.conjoints||[]).join(",")){q.conjoints=nc;ch=true;}}
    if(ch)q.updatedAt=now();}
  rm.forEach(function(x){delete DB.persons[x];});
  return rm;}

  var dups=dedupePersons();var legacy=purgeLegacy();var shadows=purgeSeedShadows();if(legacy.length||shadows.length)seedChanged=true;
  render();setPill();                 /* AFFICHE L'ARBRE TOUT DE SUITE — jamais bloqué par le réseau */
  if(seedChanged||dups.length){saveLocal();cloudPushAll().catch(function(){});if(dups.length)toast("🧹 "+dups.length+" doublon(s) nettoyé(s)");}
  cloudPull(false);}

/* ---------- MAJ auto FORCÉE : toujours la dernière version, sans rien faire ---------- */
var _updTs=0;
async function checkUpdate(){
  if(Date.now()-_updTs<25000)return;_updTs=Date.now();
  if(document.querySelector(".ov"))return; /* ne coupe pas une saisie en cours */
  try{
    var r=await fetch("index.html?_v="+Date.now(),{cache:"reload"});if(!r.ok)return;
    var t=await r.text();var m=t.match(/APP_VER\s*=\s*"([^"]+)"/);
    function verNum(s){var g=String(s).match(/(\d+)\.(\d+)/);return g?(+g[1]*1000+ +g[2]):0;}
    /* On ne recharge QUE vers une version strictement plus récente → jamais de boucle
       si le CDN sert temporairement une ancienne version sur un de ses points. */
    if(m&&m[1]&&verNum(m[1])>verNum(APP_VER)){
      var last=+(localStorage.getItem("arbre_upd_ts")||0);
      if(Date.now()-last<90000)return; /* + garde temporelle : 1 rechargement max / 90 s */
      localStorage.setItem("arbre_upd_ts",String(Date.now()));
      try{if("serviceWorker"in navigator){var rs=await navigator.serviceWorker.getRegistrations();for(var i=0;i<rs.length;i++){try{await rs[i].unregister();}catch(e){}}}}catch(e){}
      try{if(window.caches){var ks=await caches.keys();for(var j=0;j<ks.length;j++){try{await caches.delete(ks[j]);}catch(e){}}}}catch(e){}
      location.replace(location.pathname+"?_upd="+Date.now());
    }
  }catch(e){}
}
boot();
