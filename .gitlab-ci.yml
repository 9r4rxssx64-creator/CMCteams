# Publication kd-mc.com : GitLab -> Cloudflare (compte Desarzens-Kevin).
# Les commandes vivent dans tools/gitlab/*.sh — la recette YAML reste triviale
# (un deux-points dans une ligne de script casse le format : panne du 27/08).
workflow:
  rules:
    - if: '$CLOUDFLARE_API_TOKEN'
    - when: never

stages: [verifier, publier, etat]

verifier-cloudflare:
  stage: verifier
  image: alpine:3.20
  script:
    - 'sh tools/gitlab/verifier.sh'
  artifacts:
    reports:
      dotenv: compte.env

publier-site:
  stage: publier
  image: node:20
  needs: [verifier-cloudflare]
  script:
    - 'bash tools/gitlab/publier.sh'

# Sonde quotidienne (et sur demande) : qui est vivant, qui est mort — chiffres reels.
etat-du-domaine:
  stage: etat
  image: alpine:3.20
  needs: []
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never
  script:
    - 'sh tools/gitlab/etat.sh'

# Renaissance des workers sur le nouveau compte — a la demande, jamais automatique.
renaitre-workers:
  stage: publier
  image: node:20
  needs: [verifier-cloudflare]
  rules:
    - if: '$DEPLOYER_WORKERS'
    - when: never
  script:
    - 'for W in $DEPLOYER_WORKERS; do bash tools/gitlab/deployer-worker.sh services/$W; done'

# Mes yeux : inventaire Cloudflare a la demande (lecture seule).
regarder-cloudflare:
  stage: etat
  image: alpine:3.20
  needs: [verifier-cloudflare]
  allow_failure: true
  rules:
    - if: '$REGARDER'
    - when: never
  script:
    - 'sh tools/gitlab/regarder.sh'

# Mes yeux : lire n'importe quelle page web depuis la machine.
sonder-url:
  stage: etat
  image: alpine:3.20
  needs: []
  allow_failure: true
  rules:
    - if: '$SONDER_URL'
    - when: never
  script:
    - 'sh tools/gitlab/sonder-url.sh'

# Tableau de bord des branches — "que se passe-t-il partout ?" (à la demande).
tableau-branches:
  stage: etat
  image: alpine:3.20
  needs: []
  allow_failure: true
  rules:
    - if: '$BRANCHES'
    - when: never
  script:
    - 'sh tools/gitlab/branches.sh'
