<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#12b981">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KDMC Lingua">
<meta name="description" content="KDMC Lingua — apprends l'anglais, l'italien et l'espagnol en t'amusant. Application originale KDMC.">
<link rel="manifest" href="manifest.webmanifest">
<title>KDMC Lingua</title>
<style>
:root{
  --green:#12b981; --green-d:#0e9c6e; --gold:#f6b73c; --violet:#7c3aed;
  --red:#ef4444; --red-d:#dc2626; --ok:#58cc02; --ok-d:#46a302;
  --bg:#0f1720; --card:#182430; --card2:#1f2d3a; --line:#2a3a49;
  --tx:#eaf1f6; --tx2:#9fb2c2; --shadow:0 4px 0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  overscroll-behavior-y:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative}
.screen{padding:16px 16px 110px}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding-bottom:0}
.mascot{filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.mascot-wrap{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.brand{font-size:34px;font-weight:800;margin:14px 0 4px;letter-spacing:-1px}
.brand span{color:var(--green)}
.sub{color:var(--tx2);margin:0 0 26px;font-size:16px}
.sub2{color:var(--tx2);margin:-6px 0 14px;font-size:14px}
.legal-note{position:fixed;bottom:10px;left:0;right:0;text-align:center;color:#5f7284;font-size:11px}

/* Choix langue */
.course-pick{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
.course-card{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);
  border-bottom-width:4px;border-radius:16px;padding:16px 18px;font-size:18px;font-weight:700;transition:transform .06s}
.course-card:active{transform:translateY(2px);border-bottom-width:2px}
.course-card .flag{font-size:30px}
.course-card .cnom{flex:1;text-align:left}
.course-card .arrow{color:var(--tx2);font-size:26px}

/* Topbar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:rgba(15,23,32,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tb-flag{font-size:24px;width:44px;height:44px;border-radius:12px;background:var(--card)}
.tb-stat{display:flex;align-items:center;gap:5px;font-weight:800;font-size:16px;margin-left:auto;background:var(--card);
  padding:8px 11px;border-radius:12px}
.tb-stat.streak{color:var(--gold);margin-left:auto}
.tb-stat.gems{color:#4cc3ff;margin-left:8px}
.tb-stat.hearts{color:#ff5d6c;margin-left:8px}
.tb-stat span{font-size:16px}

/* Objectif */
.goal-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:18px}
.plan-card{background:linear-gradient(160deg,#1b2a38,#182430);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:16px;padding:14px;margin-bottom:16px}
.plan-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.plan-ttl{font-weight:900;font-size:16px}
.plan-lvl{font-weight:900;font-size:13px;color:#0f1720;background:linear-gradient(90deg,var(--gold),#ffd067);padding:3px 12px;border-radius:99px}
.plan-lvlsub{font-size:12px;color:#9fb2c2;margin-top:5px}
.plan-lvlsub b{color:#fff}
.plan-acts{display:flex;gap:10px;margin-top:12px}
.plan-btn{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:#fff;font-weight:800;font-size:14px;text-align:left;min-height:54px;cursor:pointer}
.plan-btn span{font-weight:600;font-size:11px;color:#9fb2c2}
.plan-btn.primary{background:linear-gradient(90deg,var(--green),var(--green-d));border-color:transparent}
.plan-btn.primary span{color:rgba(255,255,255,.85)}
.plan-btn:active{transform:translateY(1px)}
.plan-phrase{display:flex;align-items:center;gap:8px;margin-top:12px;background:var(--card2);border-radius:12px;padding:9px 12px;font-size:14px}
.plan-phrase b{color:#fff}
.pod-fr{color:#9fb2c2;font-size:12px}
.pod-say{margin-left:auto;background:transparent;border:0;font-size:20px;cursor:pointer;min-width:44px;min-height:44px}
.plan-tip{margin-top:10px;font-size:12.5px;color:#c7d4de;line-height:1.4}
.plan-diff{margin-top:10px;width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:#dfe8ef;font-size:13px;font-weight:700;text-align:left;cursor:pointer;min-height:44px}
.plan-diff b{color:var(--gold)}
.type-input{width:100%;margin-top:18px;padding:15px 16px;font-size:18px;border-radius:14px;border:2px solid var(--line);background:var(--card2);color:#fff;outline:none}
.type-input:focus{border-color:var(--green)}
.diff-pick{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.diff-opt{flex:1 1 40%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 10px;color:#fff;font-weight:700;font-size:14px;cursor:pointer;min-height:48px}
.diff-opt.sel{background:linear-gradient(90deg,var(--green),var(--green-d));border-color:transparent}
.goal-top{display:flex;justify-content:space-between;font-size:14px;color:var(--tx2);margin-bottom:8px}
.goal-top b{color:var(--tx)}
.bar{height:12px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar.big{flex:1;height:16px}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--gold),#ffd067);border-radius:99px;transition:width .4s}
.goal-done{margin-top:8px;color:var(--ok);font-weight:700;font-size:14px}

/* Arbre */
.unit{margin-bottom:26px}
.unit-head{display:flex;justify-content:space-between;align-items:center;background:var(--uc);
  border-radius:16px;padding:14px 16px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.unit-k{font-size:11px;font-weight:800;opacity:.85;letter-spacing:1px}
.unit-t{font-size:18px;font-weight:800}
.unit-crowns{font-weight:800;background:rgba(0,0,0,.18);padding:6px 10px;border-radius:99px;font-size:14px}
.path{padding:18px 0 4px;display:flex;flex-direction:column;gap:14px}
.cell{display:flex;flex-direction:column;align-items:center;gap:4px;width:74px}
.node{width:66px;height:60px;border-radius:50%;font-size:26px;display:flex;align-items:center;justify-content:center;
  background:var(--uc);box-shadow:0 6px 0 rgba(0,0,0,.3);transition:transform .08s}
.node:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.3)}
.node.locked{background:var(--card2);box-shadow:0 6px 0 rgba(0,0,0,.25);opacity:.75}
.node.done{background:var(--gold)}
.node .ncrown{filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.node-lab{font-size:11px;color:var(--tx2);text-align:center;max-width:80px;line-height:1.1}

/* Review / league / profile */
.ttl{font-size:22px;font-weight:800;margin:6px 0 12px}
.review-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.mascot-mini .mascot,.mascot-mini{width:80px;height:80px}
.mascot-mini.big .mascot{width:110px;height:110px}
.review-card p{color:var(--tx2);font-size:15px;line-height:1.5}
.review-card b{color:var(--tx)}
.lb{display:flex;flex-direction:column;gap:8px}
.lb-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.lb-row.top{border-color:var(--gold)}
.lb-row.me{background:var(--card2);border-color:var(--green)}
.lb-row .rk{width:26px;font-weight:800;color:var(--tx2)}
.lb-row .rn{flex:1;font-weight:700}
.lb-row .rx{font-weight:800;color:var(--gold)}

.profile-head{display:flex;flex-direction:column;align-items:center;gap:6px;margin:4px 0 18px}
.pname{font-size:22px;font-weight:800;outline:none;border-bottom:2px dashed transparent;padding:2px 6px}
.pname:focus{border-bottom-color:var(--green)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.sg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.sg span{font-size:22px}.sg b{display:block;font-size:22px;font-weight:800;margin-top:4px}.sg i{color:var(--tx2);font-size:12px;font-style:normal}
.settings{display:flex;flex-direction:column;gap:1px;background:var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px}
.settings .row{display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:15px 16px;font-size:15px;font-weight:600;width:100%;text-align:left}
.settings .row.danger{color:var(--red);justify-content:center}
.settings select{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:15px}
.settings input[type=checkbox]{width:22px;height:22px;accent-color:var(--green)}
.ver{text-align:center;color:#5f7284;font-size:12px}

/* Tabbar */
.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;display:flex;
  background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:30}
.tab{flex:1;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--tx2)}
.tab span{font-size:21px}.tab i{font-size:10px;font-style:normal;font-weight:700}
.tab.active{color:var(--green)}

/* ---- Traducteur ---- */
.tr-bar{margin-bottom:10px}
#trSrc{width:100%;background:var(--card2);color:var(--tx);border:2px solid var(--line);border-radius:12px;padding:12px;font-size:15px}
.tr-in{position:relative;margin-bottom:14px}
.tr-in .txt{margin-bottom:0;padding-right:52px}
.tr-mic{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:10px;background:var(--card2);font-size:18px}
.tr-out{display:flex;flex-direction:column;gap:10px}
.tr-hint{color:var(--tx2);font-size:14px;text-align:center;padding:24px 10px;background:var(--card);border:1px dashed var(--line);border-radius:14px}
.tr-card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tr-card .trflag{font-size:26px}
.tr-card .trtxt{flex:1;display:flex;flex-direction:column}
.tr-card .trtxt b{font-size:17px}.tr-card .trtxt i{font-style:normal;color:var(--tx2);font-size:12px}
.tr-card .trspk{width:40px;height:40px;border-radius:10px;background:var(--card2);font-size:18px}

/* Leçon */
.lesson{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.lesson-top{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 12px) 16px 8px}
.quit{font-size:22px;color:var(--tx2);width:34px;height:34px}
.lh{font-weight:800;color:#ff5d6c;font-size:15px}
.lesson-body{flex:1;padding:14px 16px}
.ex-h{display:flex;align-items:flex-end;gap:10px;margin-bottom:18px}
.ex-h .mascot{width:64px;height:64px}
.bubble{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:700;position:relative}
.bubble:before{content:"";position:absolute;left:-8px;bottom:14px;border:7px solid transparent;border-right-color:var(--line)}
.q-word{font-size:26px;font-weight:800;text-align:center;margin:18px 0 22px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.say,.q-audio{background:var(--card2);border-radius:10px}
.say{font-size:18px;padding:4px 10px}
.q-audio{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:40px;padding:26px;border-radius:18px;margin:16px auto 24px;width:60%;border:2px solid var(--line)}
.q-audio span{font-size:12px;color:var(--tx2);font-weight:600}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:16px;font-size:17px;font-weight:700;text-align:center;transition:transform .06s}
.opt:active{transform:translateY(2px)}
.opt.sel{border-color:var(--green);background:rgba(18,185,129,.12);color:var(--green)}

/* Match */
.match-grid{display:flex;gap:12px}
.mcol{flex:1;display:flex;flex-direction:column;gap:10px}
.mtile{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:14px 8px;font-weight:700;font-size:15px;min-height:52px}
.mtile.msel{border-color:var(--green);background:rgba(18,185,129,.14);color:var(--green)}
.mtile.matched{opacity:.35;border-color:var(--green)}
.mtile.mbad{border-color:var(--red);background:rgba(239,68,68,.14);color:var(--red)}

/* Bank */
.bank-answer{min-height:60px;border-bottom:2px solid var(--line);padding:8px 0 14px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;margin-bottom:6px}
.bank-src{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding-top:16px}
.tok{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:10px 14px;font-weight:700;font-size:16px}
.tok:active{transform:translateY(2px)}
.tok.used{opacity:.25;pointer-events:none}

/* Pied de leçon */
.lesson-foot{position:sticky;bottom:0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);background:var(--bg);border-top:1px solid var(--line)}
.lesson-foot.ok{background:rgba(88,204,2,.12);border-top-color:var(--ok)}
.lesson-foot.ko{background:rgba(239,68,68,.12);border-top-color:var(--red)}
.feedback{font-size:16px;margin-bottom:12px;font-weight:600}
.lesson-foot.ok .feedback b{color:var(--ok-d)}
.lesson-foot.ko .feedback b{color:var(--red)}
.btn-main{width:100%;background:var(--green);color:#fff;font-size:17px;font-weight:800;padding:16px;border-radius:14px;box-shadow:0 4px 0 var(--green-d);transition:transform .06s}
.btn-main:active{transform:translateY(2px);box-shadow:0 2px 0 var(--green-d)}
.btn-main:disabled{background:var(--card2);color:var(--tx2);box-shadow:0 4px 0 #14202b}
.lesson-foot.ko .btn-main{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn-ghost{width:100%;background:transparent;border:2px solid var(--line);color:var(--tx);font-weight:700;padding:14px;border-radius:14px;margin-top:10px}
.check{margin-top:0}

/* Toast + modal */
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:#0b1219;border:1px solid var(--line);
  color:var(--tx);padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.3s;z-index:100;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:90;opacity:0;transition:.25s}
.overlay.show{opacity:1}
.modal{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:26px 22px calc(env(safe-area-inset-bottom) + 22px);text-align:center;transform:translateY(30px);transition:.25s}
.overlay.show .modal{transform:translateY(0)}
.modal h3{font-size:22px;margin:10px 0 16px}
.modal p{color:var(--tx2);font-size:15px;margin:0 0 16px;line-height:1.5}
.reward-grid,.stat-grid{gap:12px}
.reward-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px}
.rw{background:var(--card2);border-radius:14px;padding:14px 6px}
.rw span{font-size:22px}.rw b{display:block;font-size:20px;font-weight:800;color:var(--gold);margin-top:4px}.rw i{font-size:11px;color:var(--tx2);font-style:normal}

/* ---- Comptes ---- */
.accounts .brand{margin-top:6px}
.acc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:400px;margin-top:8px}
.acc-cell{position:relative}
.acc-card{width:100%;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;padding:18px 10px;transition:transform .06s}
.acc-card:active{transform:translateY(2px);border-bottom-width:2px}
.acc-card.add{border-style:dashed;color:var(--tx2)}
.acc-card .av{font-size:42px;line-height:1}
.acc-card .an{font-weight:800;font-size:16px}
.acc-card .as{font-size:11px;color:var(--tx2)}
.acc-del{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;font-size:14px;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.btn-ghost.small{margin-top:18px;width:auto;padding:10px 18px}
.txt{width:100%;background:var(--card2);border:2px solid var(--line);border-radius:12px;padding:14px;font-size:17px;color:var(--tx);margin-bottom:14px}
.txt:focus{outline:none;border-color:var(--green)}
.mini{color:var(--tx2);font-size:13px;margin:0 0 8px;text-align:left}
.av-pick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:18px}
.av-opt{font-size:26px;padding:8px 0;border-radius:12px;border:2px solid transparent;background:var(--card2)}
.av-opt.sel{border-color:var(--green);background:rgba(18,185,129,.15)}
.tb-av{font-size:22px;width:44px;height:44px;border-radius:12px;background:var(--card);margin-left:8px}

/* ---- Quêtes ---- */
.quest-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:18px}
.qc-h{font-weight:800;font-size:14px;margin-bottom:8px}
.q-row{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:14px;border-top:1px solid var(--line)}
.q-row:first-of-type{border-top:none}
.q-row .qi{font-size:16px}.q-row .qt{flex:1;font-weight:600}.q-row .qp{color:var(--tx2);font-weight:700}.q-row .qr{color:var(--gold);font-weight:800;font-size:12px;min-width:44px;text-align:right}
.q-row.done{opacity:.55}.q-row.done .qt{text-decoration:line-through}

/* ---- Course pick progress ---- */
.cpct{font-style:normal;color:var(--green);font-size:12px;font-weight:800}
.cbar{display:block;height:5px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:5px}
.cbar span{display:block;height:100%;background:var(--green);border-radius:99px}
.course-card .cnom{display:flex;flex-direction:column;align-items:flex-start;gap:0}

/* ---- Succès / gel ---- */
.sec-h{font-weight:800;font-size:15px;margin:4px 0 10px}
.achv-wrap{margin-bottom:16px}
.achv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.achv{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;opacity:.4}
.achv.got{opacity:1;border-color:var(--gold)}
.achv .ai{font-size:22px}.achv .at{font-size:12px;font-weight:700;line-height:1.15}
.freeze-card{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px}
.freeze-card b{font-size:15px}.freeze-card span{color:var(--tx2);font-size:13px}
.freeze-card .fx{font-weight:800;color:#4cc3ff;font-size:18px}
.btn-buy{margin-left:auto;background:var(--violet);color:#fff;font-weight:800;padding:10px 14px;border-radius:12px;box-shadow:0 3px 0 #5b21b6;font-size:13px}
.btn-buy:active{transform:translateY(2px);box-shadow:0 1px 0 #5b21b6}
.settings .row.switch{color:var(--tx)}
.pav{font-size:52px;line-height:1}

/* ---- Dictionnaire ---- */
.dict-unit{margin-bottom:18px}
.du-h{font-weight:800;font-size:15px;margin-bottom:8px;color:var(--gold)}
.dict-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dword{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.dword b{font-size:16px}.dword i{font-style:normal;color:var(--tx2);font-size:12px}
.dword.known{border-color:var(--green)}
.dword .chk{position:absolute;top:8px;right:10px;color:var(--green);font-weight:800}

/* ---- Voix ---- */
.voice-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px}
.voice-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.voice-row:first-of-type{border-top:none}
.voice-row.sel{}
.voice-row .vn{flex:1;font-weight:600;font-size:14px}
.voice-row .vbadge{font-style:normal;font-size:10px;font-weight:800;color:#0b1219;background:var(--gold);padding:1px 5px;border-radius:6px;vertical-align:middle}
.vtest{width:38px;height:38px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:14px}
.vpick{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-weight:700;font-size:13px}
.vpick.on{background:rgba(18,185,129,.15);border-color:var(--green);color:var(--green)}

/* ---- Combo ---- */
.combo{font-weight:800;color:#ff7a1a;font-size:14px;animation:pop .3s ease}
@keyframes pop{from{transform:scale(1.4)}to{transform:scale(1)}}
.feedback .cb{color:#ff7a1a;font-size:13px}

/* ---- Mascotte animée ---- */
.mascot .arm{transform-box:fill-box}
.mascot .arm-r.wave{transform-origin:bottom center;animation:wave 1.3s ease-in-out infinite}
.mascot .arm.up{transform-origin:bottom center;animation:armup 1s ease infinite alternate}
.mascot .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.mascot.pose-party{animation:pbounce .55s ease infinite alternate}
@keyframes wave{0%,100%{transform:rotate(2deg)}25%{transform:rotate(-24deg)}75%{transform:rotate(16deg)}}
@keyframes armup{from{transform:rotate(0)}to{transform:rotate(-16deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
@keyframes pbounce{from{transform:translateY(0)}to{transform:translateY(-7px)}}
@media (prefers-reduced-motion:reduce){.mascot *,.mascot{animation:none!important}}
</style>
</head>
