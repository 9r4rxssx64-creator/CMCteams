name: "KDMC Lingua — Anime Bee en VIDÉO (IA image→vidéo, à la demande)"

# Donne VIE à Bee : génère de courtes boucles vidéo animées à partir de SON image
# (lingua/bee/bee-src.webp) via Replicate (clé secret AX_REPLICATE_KEY — modèle
# minimax/video-01-live, spécialisé dans l'animation d'illustrations/personnages).
# Manuel uniquement (workflow_dispatch) — zéro cron, zéro mail. Résultats committés
# sur claude/bee-mascot-art (lingua/bee-live/*.mp4) pour intégration par l'agent.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Génère les boucles vidéo (idle + salut)
        env:
          REPLICATE_KEY: ${{ secrets.AX_REPLICATE_KEY }}
        run: |
          set -e
          if [ -z "${REPLICATE_KEY:-}" ]; then echo "::error::AX_REPLICATE_KEY absente"; exit 1; fi
          mkdir -p /tmp/vid
          IMG_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/lingua/bee/bee-src.webp"
          KEEP="Keep the exact same cartoon bee character design, colors and cream background."
          gen_vid () {
            NAME="$1"; PROMPT="$2"
            echo "== $NAME =="
            CREATE=$(curl -sS https://api.replicate.com/v1/models/minimax/video-01-live/predictions \
              -H "Authorization: Bearer $REPLICATE_KEY" -H "Content-Type: application/json" \
              -d "$(jq -n --arg p "$PROMPT" --arg img "$IMG_URL" '{input:{prompt:$p, first_frame_image:$img, prompt_optimizer:true}}')")
            ID=$(printf '%s' "$CREATE" | jq -r '.id // empty')
            if [ -z "$ID" ]; then echo "::warning::$NAME création échouée : $(printf '%s' "$CREATE" | jq -r '.detail // .title // "?"' | head -c 200)"; return 1; fi
            for i in $(seq 1 60); do
              sleep 10
              ST=$(curl -sS -H "Authorization: Bearer $REPLICATE_KEY" "https://api.replicate.com/v1/predictions/$ID")
              STATUS=$(printf '%s' "$ST" | jq -r '.status')
              if [ "$STATUS" = "succeeded" ]; then
                URL=$(printf '%s' "$ST" | jq -r 'if (.output|type)=="array" then .output[0] else .output end')
                curl -sSL "$URL" -o "/tmp/vid/$NAME.mp4"
                echo "  OK ($(wc -c < /tmp/vid/$NAME.mp4) octets)"
                return 0
              fi
              if [ "$STATUS" = "failed" ] || [ "$STATUS" = "canceled" ]; then
                echo "::warning::$NAME $STATUS : $(printf '%s' "$ST" | jq -r '.error // "?"' | head -c 200)"; return 1
              fi
              [ $((i % 6)) -eq 0 ] && echo "  …$STATUS (${i}0s)"
            done
            echo "::warning::$NAME timeout (~10 min)"; return 1
          }
          OK=0
          gen_vid "idle"  "$KEEP The cute bee hovers gently in place, wings fluttering fast, she blinks naturally, breathes softly, tiny head tilts, subtle seamless idle loop, nothing else changes" && OK=$((OK+1))
          gen_vid "hello" "$KEEP The cute bee waves hello warmly with her raised hand, wings fluttering, blinking, joyful, subtle seamless loop" && OK=$((OK+1))
          gen_vid "dance" "$KEEP The cute bee dances happily in place, swaying side to side with rhythm, bouncing, wings fluttering, joyful expression, fun dance loop" && OK=$((OK+1))
          gen_vid "jump"  "$KEEP The cute bee jumps up with excitement and lands softly, then jumps again, celebratory hops, wings fluttering, happy, seamless loop" && OK=$((OK+1))
          gen_vid "fly"   "$KEEP The cute bee flies in a small playful circle, swooping gently up and down like a figure eight, wings fluttering fast, returns to center, seamless flying loop" && OK=$((OK+1))
          gen_vid "walk"  "$KEEP The cute bee walks cheerfully in place with a bouncy little march, arms swinging, wings fluttering, adorable strut, seamless loop" && OK=$((OK+1))
          echo "Vidéos générées : $OK/6"
          [ "$OK" -ge 1 ] || { echo "::error::aucune vidéo générée"; exit 1; }

      - name: Commit sur la branche d'art
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BR="claude/bee-video-${GITHUB_RUN_ID}"
          git checkout -B "$BR"
          mkdir -p lingua/bee-live
          cp /tmp/vid/*.mp4 lingua/bee-live/ 2>/dev/null || true
          git add lingua/bee-live/
          git commit -m "art(lingua): boucles vidéo animées de Bee (Replicate) [skip ci]" || { echo "rien à committer"; exit 0; }
          git push origin "$BR"

      - name: Artefact (trace)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bee-video
          path: /tmp/vid/
          retention-days: 30
