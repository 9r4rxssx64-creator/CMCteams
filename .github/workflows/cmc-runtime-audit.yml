name: CMCteams Runtime Audit
# Une seule execution a la fois par branche : un nouveau commit remplace
# l'ancien au lieu de s'empiler dans la file d'attente GitHub.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


# v9.628+ (Kevin 2026-05-16 "Intègre playwright") :
# Lance tests/runtime-audit.mjs + tests/runtime-audit-encadres.mjs
# (Playwright Chromium + iPhone Safari UA) sur chaque push sur
# claude/fix-cms-teams-import-* ou main.
# Garantit que :
#  - 147+ tests régression PASSENT en runtime réel (pas juste audit grep)
#  - PASSERON G + autres encadrés correctement classés
#  - Aucune régression intra-session

on:
  push:
    branches:
      - main
      - 'claude/fix-cms-teams-import-*'
    paths:
      - 'index.html'
      - 'sw.js'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/cmc-runtime-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'tests/**'
  workflow_dispatch:

jobs:
  runtime-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          # Pas de `cache: npm` : le dépôt n'a PAS de package-lock.json → setup-node
          # échouait en 17 s (« Dependencies lock file is not found ») et ces tests ne
          # tournaient plus du tout (mesuré 6.09, run 34040946171).

      - name: Install npm dependencies (including playwright)
        # node 22 : `npm install` nu plante sur les peer deps de la racine (edgesOut) —
        # même repli que audit-live.yml et que le job tests GitLab.
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Install Playwright Chromium
        run: npm run playwright:install

      - name: Validate JS syntax (CLAUDE.md erreur #32 method)
        run: npm run test:check-syntax

      - name: Run runtime audit suites (Playwright Chromium iPhone Safari UA)
        run: npm run test:all

      - name: Report
        if: always()
        run: echo "Runtime audit terminé. Voir output ci-dessus pour le score réel runtime."
