name: Décès INSEE — build Parquet → R2 (moteur de recherche local)
# Kevin « Go tout » 2026-08-05 : télécharge le fichier des personnes décédées INSEE
# (data.gouv, Licence Ouverte), le parse, le partitionne en Parquet ZSTD par 1ʳᵉ lettre
# du nom, télécharge le moteur DuckDB-WASM + l'extension parquet, et pousse le tout
# sur le bucket R2 kdmc-deces-insee (public + CORS déjà configurés par le préflight).
# Réseau ouvert (runner CI). Déclenche à la main.
on:
  workflow_dispatch: {}
permissions:
  contents: read
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Vérifier les secrets Cloudflare
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && echo "✓ token présent" || { echo "::error::CLOUDFLARE_API_TOKEN manquant"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && echo "✓ account présent" || { echo "::error::CLOUDFLARE_ACCOUNT_ID manquant"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Outils
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet duckdb
          node --version; python3 --version
      - name: Build + upload (pipeline complet)
        run: bash tools/arbre/build-deces-parquet.sh
      - name: Récap
        if: always()
        run: |
          echo "=== FIN ==="
          echo "Si l'upload a réussi, les données sont sur https://pub-1a8025a4d1634431908305a40060beda.r2.dev/"
          echo "parts/ = partitions Parquet · engine/ = DuckDB-WASM + extension parquet · config.json = métadonnées"
