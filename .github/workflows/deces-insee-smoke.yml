name: Décès INSEE — smoke LIVE navigateur (preuve end-to-end)
# Kevin « prouver, pas supposer » : charge l'outil dans un vrai Chromium et
# vérifie qu'une recherche connue rend des résultats depuis le Parquet R2.
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i -D playwright@1.48.0 && npx playwright install --with-deps chromium
      - name: Servir le site en local
        run: |
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          sleep 2
          curl -sSf -o /dev/null "http://127.0.0.1:8000/tools/deces-insee/" && echo "✓ page servie"
      - name: Smoke navigateur (recherche MAIFFRET → R2)
        run: node tools/arbre/deces-smoke.mjs
      - name: Capture d'écran (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deces-smoke
          path: deces-smoke.png
          if-no-files-found: ignore
