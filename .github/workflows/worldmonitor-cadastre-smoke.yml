name: WorldMonitor cadastre smoke (IGN réel)

# Vérifie que les sources IGN/DVF/Géorisques/BAN câblées dans World Monitor répondent
# RÉELLEMENT (leçon #134 : prouver les couches/endpoints, jamais supposer). Réseau ouvert.
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Sonder les endpoints IGN / DVF / Géorisques / BAN
        run: |
          set +e
          FAIL=0
          LON=2.3488; LAT=48.8534; Z=16
          TX=$(python3 -c "import math;n=2**$Z;print(int(($LON+180)/360*n))")
          TY=$(python3 -c "import math;lat=math.radians($LAT);n=2**$Z;print(int((1-math.log(math.tan(lat)+1/math.cos(lat))/math.pi)/2*n))")
          GEOM=$(python3 -c "import urllib.parse,json;print(urllib.parse.quote(json.dumps({'type':'Point','coordinates':[$LON,$LAT]})))")
          echo "Tuile z=$Z col=$TX row=$TY"

          check_img() {
            CT=$(curl -sS -m 25 -o /tmp/t.bin -w '%{content_type}|%{http_code}' "$2")
            SZ=$(wc -c </tmp/t.bin)
            echo ">>> $1 : $CT · ${SZ} octets"
            case "$CT" in image/*) echo "   OK image";; *) echo "   KO (corps: $(head -c 180 /tmp/t.bin))"; FAIL=1;; esac
          }
          check_json() {
            OUT=$(curl -sS -m 30 -w '\n__HTTP:%{http_code}__' "$2")
            CODE=$(printf '%s' "$OUT" | grep -o '__HTTP:[0-9]*__' | tr -dc 0-9)
            BODY=$(printf '%s' "$OUT" | sed 's/__HTTP:[0-9]*__//')
            echo ">>> $1 : HTTP $CODE"
            echo "$BODY" | head -c 600; echo
            if [ "$CODE" != "200" ]; then echo "   KO HTTP != 200"; FAIL=1; return; fi
            if [ -n "$3" ] && ! echo "$BODY" | grep -q "$3"; then echo "   (motif '$3' absent)"; fi
            echo "   OK repond"
          }

          echo "== 1) Cadastre WMTS (PARCELLAIRE_EXPRESS) =="
          check_img "cadastre" "https://data.geopf.fr/wmts?SERVICE=WMTS&VERSION=1.0.0&REQUEST=GetTile&LAYER=CADASTRALPARCELS.PARCELLAIRE_EXPRESS&STYLE=normal&FORMAT=image/png&TILEMATRIXSET=PM&TILEMATRIX=$Z&TILEROW=$TY&TILECOL=$TX"

          echo "== 2) Plan IGN WMTS (PLANIGNV2) =="
          check_img "planign" "https://data.geopf.fr/wmts?SERVICE=WMTS&VERSION=1.0.0&REQUEST=GetTile&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&STYLE=normal&FORMAT=image/png&TILEMATRIXSET=PM&TILEMATRIX=$Z&TILEROW=$TY&TILECOL=$TX"

          echo "== 3) Photo aerienne IGN (ORTHOPHOTOS jpeg) =="
          check_img "ortho" "https://data.geopf.fr/wmts?SERVICE=WMTS&VERSION=1.0.0&REQUEST=GetTile&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&STYLE=normal&FORMAT=image/jpeg&TILEMATRIXSET=PM&TILEMATRIX=$Z&TILEROW=$TY&TILECOL=$TX"

          echo "== 4) API Carto parcelle (tap) =="
          check_json "parcelle" "https://apicarto.ign.fr/api/cadastre/parcelle?geom=$GEOM" '"numero"'

          echo "== 5) API Carto zonage PLU (GPU) =="
          check_json "zone-urba" "https://apicarto.ign.fr/api/gpu/zone-urba?geom=$GEOM" '"libelle"'

          echo "== 6) Adresse BAN (reverse) =="
          check_json "ban" "https://api-adresse.data.gouv.fr/reverse/?lon=$LON&lat=$LAT" '"label"'

          echo "== 7) Georisques (risques par point, imbrique data[].risques_detail[]) =="
          check_json "georisques" "https://georisques.gouv.fr/api/v1/gaspar/risques?latlon=$LON%2C$LAT&rayon=1000" "libelle_risque_long"

          echo "======================================"
          if [ "$FAIL" = "0" ]; then echo "SMOKE OK — images verifiees ; JSON dumps ci-dessus = forme reelle"; else echo "au moins une IMAGE KO — voir ci-dessus"; fi
          exit $FAIL
