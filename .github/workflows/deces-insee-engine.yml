name: Décès INSEE — moteur DuckDB-WASM → R2 (bundle)
# Kevin « Go tout » 2026-08-05 : bundle le moteur DuckDB-WASM MVP (JS principal +
# apache-arrow inliné via esbuild) + wasm + worker + extension parquet, pousse sur
# engine/ du bucket R2. Rapide, indépendant du build des données. Déclenche à la main.
on:
  workflow_dispatch: {}
permissions:
  contents: read
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les secrets Cloudflare
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && echo "✓ token" || { echo "::error::token manquant"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && echo "✓ account" || { echo "::error::account manquant"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build + upload moteur
        run: bash tools/arbre/build-deces-engine.sh
