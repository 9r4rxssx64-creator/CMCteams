# Déploie kdmc-rag — mémoire intelligente (RAG) d'Apex : Workers AI (embeddings) + Vectorize.
# Secrets requis : CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, APEX_ADMIN_PIN_SHA256 (déjà là).
#
# DÉCLENCHEMENT : bouton (workflow_dispatch) + AUTO à chaque push qui touche le worker,
# sur main ET sur claude/** (schéma deploy-apex-chat.yml v1.1.125). Audit du 05/09 :
# la route /health existait dans la source depuis des semaines mais le worker en ligne
# datait du 08/07 — personne n'avait appuyé sur le bouton (dispatch seul = déploiement
# fantôme, leçon #213). La fusion robot dans main (GITHUB_TOKEN) ne déclenche pas les
# workflows `push`, d'où claude/**. Zéro cron, zéro volume automatique.
#
# ⚠️ Vectorize doit être disponible sur le compte (comme les Durable Objects ont été
# refusés — leçon #132). Si `wrangler deploy` échoue sur le binding VEC, le smoke le dira
# en clair ; côté Apex la mémoire reste fail-open (l'app fonctionne sans).
name: Deploy KDMC RAG (mémoire Apex)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'services/kdmc-rag/**'
      - '.github/workflows/deploy-kdmc-rag.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: services/kdmc-rag
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Vérifier les secrets (erreur exacte, pas silencieuse)
        env:
          PINSHA: ${{ secrets.APEX_ADMIN_PIN_SHA256 }}
        run: |
          MISSING=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && MISSING="$MISSING CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && MISSING="$MISSING CLOUDFLARE_ACCOUNT_ID"
          [ -z "$PINSHA" ] && MISSING="$MISSING APEX_ADMIN_PIN_SHA256"
          if [ -n "$MISSING" ]; then echo "::error::Secrets manquants :$MISSING"; exit 1; fi
          echo "Secrets OK"

      - name: Syntax check worker
        run: node --check worker.js

      - name: Installer wrangler
        run: npm i -g wrangler && wrangler --version

      - name: Créer l'index Vectorize (idempotent) — et DIRE s'il n'existe pas
        shell: bash {0}
        run: |
          # 1024 dims (bge-m3), cosine. Si l'index existe déjà → "already exists" → on continue.
          # 05/09 (run 33978540252) : le déploiement échouait plus loin avec « index 'apex-memory'
          # not found [code 10159] » parce que cette création échouait EN SILENCE (|| true, journal
          # jamais montré). Règle « toujours détailler les erreurs » : la sortie remonte en annotations.
          wrangler vectorize create apex-memory --dimensions=1024 --metric=cosine > /tmp/vec.log 2>&1
          RC=$?
          cat /tmp/vec.log
          if grep -qiE "already exists|resource with the name" /tmp/vec.log; then echo "index déjà présent — OK"; RC=0; fi
          if [ "$RC" != "0" ]; then
            grep -iE 'error|✘|failed|code|permission|authoriz|plan' /tmp/vec.log | tail -10 | while IFS= read -r L; do echo "::error::vectorize create ▸ $L"; done
          fi
          # Vérité de terrain : l'index est-il là, oui ou non ? (c'est ce que le deploy va exiger)
          if wrangler vectorize get apex-memory > /tmp/vecget.log 2>&1; then
            echo "::notice::Vectorize ▸ index apex-memory présent"; head -20 /tmp/vecget.log
          else
            tail -8 /tmp/vecget.log | while IFS= read -r L; do echo "::error::vectorize get ▸ $L"; done
            echo "::error::L'index Vectorize apex-memory N'EXISTE PAS sur le compte et n'a pas pu être créé (voir lignes ci-dessus : droit manquant du jeton CLOUDFLARE_API_TOKEN sur Vectorize, ou plan). Le worker kdmc-rag a un binding VEC dessus → wrangler deploy refusera (code 10159). Rien n'est déployé."
            exit 1
          fi

      - name: Pousser le secret d'auth
        env:
          PINSHA: ${{ secrets.APEX_ADMIN_PIN_SHA256 }}
        run: printf '%s' "$PINSHA" | wrangler secret put APEX_ADMIN_PIN_SHA256

      - name: Déployer le worker
        # `pipefail` : sinon le code de sortie est celui de `tee` (toujours 0)
        # et un DÉPLOIEMENT ÉCHOUÉ ressort VERT. Cf. tests/workflows-pipefail.test.mjs.
        shell: bash -eo pipefail {0}
        run: |
          set -e
          # Journal wrangler recopié dans le RÉSUMÉ du run (lisible sans connexion).
          # Le 05/09 le déploiement a échoué en 26 s sans qu'on puisse lire pourquoi.
          set +e
          wrangler deploy 2>&1 | tee /tmp/deploy.log
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" != "0" ]; then
            { echo "## ❌ \`wrangler deploy\` a échoué (code $RC)"; echo; echo '```'; tail -80 /tmp/deploy.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            # Le résumé n'est PAS lisible sans connexion GitHub ; les ANNOTATIONS le sont
            # (10 par type et par étape) → lignes d'erreur en ::error::, fin du journal en ::notice::.
            grep -iE 'error|✘|failed|code:' /tmp/deploy.log | tail -10 | while IFS= read -r L; do echo "::error::wrangler ▸ $L"; done
            tail -10 /tmp/deploy.log | while IFS= read -r L; do echo "::notice::wrangler ▸ $L"; done
            echo "::error::wrangler deploy a échoué (code $RC) — lignes ci-dessus"
            exit "$RC"
          fi
          grep -E 'Uploaded|Deployed|Current Version|workers.dev|binding|Vectorize' /tmp/deploy.log | head -6 | while IFS= read -r L; do echo "::notice::wrangler ▸ $L"; done
          grep -Eo 'https://[a-z0-9.-]+workers.dev' /tmp/deploy.log | head -1 > /tmp/url.txt || true
          echo "URL déployée : $(cat /tmp/url.txt 2>/dev/null)"
          { echo "## ✅ \`wrangler deploy\` OK"; echo; echo '```'; tail -40 /tmp/deploy.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke /health (preuve — leçon #95)
        run: |
          URL="$(cat /tmp/url.txt 2>/dev/null)"
          [ -z "$URL" ] && URL="https://kdmc-rag.9r4rxssx64.workers.dev"
          echo "GET $URL/health"
          curl -sS "$URL/health" -H "Origin: https://kd-mc.com" | tee /tmp/health.txt; echo
          grep -q '"ok":true' /tmp/health.txt && grep -q '"hasVec":true' /tmp/health.txt \
            && echo "✅ RAG en ligne (Vectorize + AI bindings OK)" \
            || echo "::warning::/health ne confirme pas hasVec:true — Vectorize peut-être indisponible sur le compte (mémoire Apex reste fail-open)."
