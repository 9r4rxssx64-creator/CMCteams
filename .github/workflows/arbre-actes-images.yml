name: Arbre — images des actes (Monaco)
# Télécharge les IMAGES scannées des actes Monaco (visionneuse Arkothèque) pour
# lire les noms des parents et raccorder les membres isolés avec preuve.
# Réseau ouvert côté runner (l'agent Claude a l'egress bloqué). Dispatch manuel.
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Télécharger les images d'actes
        run: node tools/arbre/fetch-actes-images.mjs
      - name: Sonde membres isolés (avis de décès CH/Nice + Journal de Monaco)
        run: node tools/arbre/probe-isoles.mjs || echo "sonde isolés partielle"
      - name: Toutes villes & pays — nouvelles pistes (INSEE, presse CH, Gallica, JdM, Vaud, AD13)
        run: node tools/arbre/research-nouvelles-pistes.mjs || echo "nouvelles pistes partielles"
      - name: Vague 5 — L'Écho de Beausoleil (Gallica) + cimetières Monaco + JdM formulaire
        run: node tools/arbre/research-echo-cimetieres.mjs || echo "vague 5 partielle"
      - name: Nettoyage node_modules (pas de commit)
        # npm install modifie le package.json RACINE du repo → restaurer les
        # fichiers suivis, sinon le rebase de secours échoue (« unstaged changes »)
        run: |
          rm -rf node_modules
          git checkout -- package.json package-lock.json 2>/dev/null || true
          git status --short | head
      - name: Commit images + rapport
        run: |
          git config user.name "arbre-bot"
          git config user.email "noreply@anthropic.com"
          git add arbre/research
          git commit -m "Arbre: images des actes Monaco (preuves filiation) [skip ci]" || { echo "aucun changement"; exit 0; }
          # main peut avoir bougé pendant les ~30 min de scraping → rebase avant push (3 essais)
          for i in 1 2 3; do
            git push && break
            git fetch origin "${GITHUB_REF_NAME}" && git rebase "origin/${GITHUB_REF_NAME}" && continue
            sleep 5
          done
