name = "kdmc-uptime"
main = "worker.js"
compatibility_date = "2025-06-01"
workers_dev = true

# account_id injecté par le workflow via CLOUDFLARE_ACCOUNT_ID (jamais commité).
#
# ⚠️ ZÉRO BINDING, VOLONTAIREMENT — ce n'est pas un oubli :
#   - Durable Object → échec au démarrage sur ce compte (error 1042, leçons #132/#133) ;
#   - KV → les wrangler.toml du dépôt portent des id "REPLACE_AFTER_CREATE" et le
#     provisioning dynamique a déjà cassé `wrangler deploy` (voir kdmc-router).
# L'état entre deux passages vit donc dans le Cache API, qui ne demande aucun binding.
# Il est évictable : au pire on reperd la mémoire des pannes en cours et la prochaine
# alerte se répète. C'est très largement préférable à un worker qui ne démarre pas.
#
# Secret optionnel posé par le workflow : KDMC_PUSH_TOKEN (depuis PUSH_ADMIN_TOKEN).
# Sans lui, le worker sonde et sert son état, mais n'envoie pas de notification.

[vars]
KDMC_PUSH_URL = "https://apex-push-worker.9r4rxssx64.workers.dev"

# ⚠️ PAS DE CRON ICI — et ce n'est pas un oubli non plus (mesuré le 05/09, run 33978540250) :
#   « This account has reached the Workers Free limit of 5 cron triggers per account »
#   Les 5 places sont prises : 4 par apex-chat-api (messaging-app/workers), 1 par
#   kdmc-outlook. Avec crons = ["0 * * * *"], wrangler TÉLÉVERSE le code puis sort en
#   erreur (code 1) au moment de poser le déclencheur → run rouge à chaque push.
#   `crons = []` retire explicitement tout déclencheur (doc Cloudflare : un tableau vide
#   = suppression ; absent = laissé en place).
#
# QUI DÉCLENCHE LE PASSAGE, ALORS ? kdmc-outlook (cron « 0 */2 * * * », déjà payé) appelle
# GET /run de ce worker dans son scheduled() — même schéma que kdmc-monaco (« compte déjà
# au max de 5 crons », wrangler.toml). Passage toutes les 2 h au lieu de 1 h : c'est le
# prix du plan gratuit, pas un choix. Le handler scheduled() de ce worker reste, prêt à
# servir le jour où une place se libère (Apex Chat peut rendre 3 places en regroupant ses
# 4 crons derrière un seul « */5 », voir message pipeline) ou si Kevin passe en Workers Paid.
# Toujours ZÉRO cron GitHub Actions (fait n°10/11).
[triggers]
crons = []
